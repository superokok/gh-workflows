name: Stale sweep

# 이 저장소 자신의 멈춤 감지. 여긴 auto-merge가 없어서 PR은 원래 사람을 기다리지만,
# `agent` 라벨이 붙은 이슈가 PR 없이 방치되는 건 여기서도 똑같이 일어난다.

on:
  schedule:
    # 하루 한 번, 23:17 UTC = 08:17 KST. 업무 시작 전에 도착해 있게 맞춘 시각이고,
    # 정각은 GitHub 전체가 몰려 지연이 크므로 17분에 둔다.
    #
    # **주기를 올리지 말 것.** Actions는 job마다 분 단위 올림 과금이라 3초짜리 실행도
    # 1분이다. 매시면 월 720분 — Free 할당량의 3분의 1을 "아무 일도 없음" 확인에 쓴다
    # (2026-09-07 실제로 소진됨). 하루 1회면 월 30분이고, 이 워크플로우의 값어치는
    # "빨리 알려준다"가 아니라 "찾아보러 가지 않아도 언젠가는 알려준다"에 있다.
    # 약점: GitHub은 부하가 높으면 예약 실행을 거르기도 한다 — 1회면 그날치가 통째로 날아간다.
    - cron: "17 23 * * *"
  workflow_dispatch:

jobs:
  sweep:
    uses: ./.github/workflows/stale-sweep.yml
    secrets: inherit
    permissions:
      pull-requests: write
      issues: write
      checks: read
      statuses: read
    with:
      base-branch: main
      # 이 저장소의 게이트는 lint와 review뿐이고 Vercel이 없다. 기본값(check,review,smoke)을
      # 그대로 두면 없는 이름이 전부 missing으로 잡혀 멀쩡한 PR마다 오탐 알림이 간다.
      gate-checks: "lint,review"
      require-vercel: false
