name: Preview Smoke (reusable)

# 런타임 검증 게이트 (docs/adr/0010-merge-gates.md).
# `check`(타입·단위테스트)도 Vercel 빌드도 "화면이 실제로 뜨는지"는 검증하지 못한다 —
# 하이드레이션 실패는 SSR HTML이 멀쩡해도 인터랙션이 죽는다.
# Vercel Preview 배포가 끝나면 그 URL을 대상으로 Playwright E2E 스모크를 돌린다.
#
# 판정 (e2e/fixtures.ts):
#   - 단언 실패 / pageerror(잡히지 않은 예외) → 실패(빨간불)
#   - console.error → 리포트에 첨부만. 기존 부채가 남아 있어 아직 차단하지 않는다
#     (2026-09-05 기준 운영 홈에도 404 리소스 콘솔 에러가 1건 있다)
#
# 실패하면 `claude-fix.yml`이 받아서 고친다 — 사람에게 바로 오지 않는다.
#
# ── 왜 `pull_request`로 트리거하나 (2026-09-09) ────────────────────────────────
# 예전엔 `deployment_status`로 깨어났다. 그러면 **Vercel 배포 이벤트가 안 오면 워크플로우가
# 아예 안 돌고**, 그 경우 `smoke` check-run이 생성되지 않는다. 필수 체크가 "없는" 상태는
# `success`가 아니라 **영구 `Pending`**이라 PR을 영원히 막는다 — 잡이 `skip`되는 건
# `success`로 취급돼 무해하지만 둘은 완전히 다르다. 그래서 이 게이트를 브랜치 보호의
# required check로 올릴 수가 없었다(ADR 0010이 차단 게이트로 정해둔 것과 어긋난 채로).
#
# 이제 PR 이벤트로 **항상** 돌고, 배포 URL은 이벤트로 받는 대신 **직접 조회하며 기다린다.**
# 체크는 언제나 생성되고 통과/실패 중 하나로 끝난다 — `missing`이 없다.
#
# 배포를 못 찾으면 **실패**로 끝낸다(중립·스킵이 아니다). 배포가 없다는 건 `Vercel` 체크도
# 초록이 아니라는 뜻이라 어차피 머지가 막히고, 여기서 조용히 통과시키면 런타임 검증이
# 사라진 걸 아무도 모른다. 빨간불은 보이고, 재실행으로 복구된다.
#
# 전제(리포 설정 — 코드 아님):
#   Vercel Preview·staging은 Deployment Protection이 켜져 있어 로그인 없이 못 연다.
#   Vercel → Project Settings → Deployment Protection → **Protection Bypass for Automation**
#   에서 시크릿을 만들고 GitHub Secret `VERCEL_AUTOMATION_BYPASS_SECRET`으로 등록하면 동작한다.
#   시크릿이 없으면 이 job은 통과한다(인프라 미설정으로 모든 머지를 막는 건 과하다). 다만
#   **조용히** 통과하지는 않는다 — enable-auto-merge.yml이 이 job을 차단 게이트로 보는 구성이라면
#   "스킵됐다"가 안 보이면 런타임 검증이 통째로 사라진 걸 아무도 모르게 되므로, warning
#   애노테이션으로 PR 체크 화면에 남긴다.
#
# `pull_request` 트리거라 **PR head 브랜치의 파일**이 동작한다 — default 브랜치를 기다리지
# 않으므로 이 파일 수정은 그 PR에서 바로 효력이 생긴다.

on:
  workflow_call:
    inputs:
      base-branch:
        description: |
          이 base를 향한 PR만 검사한다. `claude-review`·`enable-auto-merge`와 같은 필터다.
          없으면 **릴리스 PR(`develop`→`main`)에서도 돈다.** develop에 머지될 때마다 릴리스
          PR이 synchronize로 갱신되므로 Playwright 스위트가 통째로 한 번 더 돈다 — 게다가
          릴리스 PR은 head가 `develop`이라 **staging 배포를 잡아서** 거기다 E2E를 돌린다
          (2026-09-09 실측: 막히진 않고 success로 끝났다). 이미 develop PR에서 검증을 마친
          코드를 대상만 바꿔 다시 도는 셈이라 순수 낭비다.
        type: string
        default: "develop"
      node-version:
        type: string
        default: "22"
      skip-paths-regex:
        description: |
          변경 파일이 **전부** 이 정규식에 걸리면 스모크를 건너뛴다. 문서만 바뀐 PR에
          브라우저 E2E를 돌릴 이유가 없다(실측 run당 2~3분).
          step만 스킵하고 job은 그대로 끝나므로 check-run은 `success`로 생성된다 —
          워크플로우 수준 `paths:` 필터는 check-run 자체가 안 생겨 영구 Pending이 되므로 쓰지 않는다.
          기본값은 **마크다운만** — `docs/` 밑에도 실행되는 스크립트가 있어 디렉터리로 잡지 않는다.
        type: string
        default: '\.md$'

# 같은 PR에 새 커밋이 오면 앞선 스모크를 취소한다(공식 권장 키). Playwright 스위트라
# run당 2분 이상이고, 낡은 커밋 대상 실행은 끝나도 버려진다(2026-09-07 실측: 월 89 run / 185분).
concurrency:
  group: preview-smoke-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  smoke:
    if: >-
      github.event.pull_request.base.ref == inputs.base-branch &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: read    # Vercel Preview 배포 URL 조회
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: 스모크 대상인지 판정 (시크릿 · 변경 파일)
        id: guard
        env:
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SKIP_RE: ${{ inputs.skip-paths-regex }}
        run: |
          # 문서만 바뀐 PR이면 브라우저 검증이 무의미하다. 파일 목록을 못 받으면 **돌린다** —
          # 판정 실패로 런타임 검증이 조용히 사라지는 쪽이 훨씬 나쁘다.
          #
          # `grep -q`를 쓰지 않는다 — 일치하는 순간 파이프를 닫아 printf가 SIGPIPE로 죽는다.
          # 위 "배포 URL 대기" 스텝이 `head`에서 겪은 것과 같은 함정이라 여기서도 피한다.
          files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename' 2>/dev/null || true)
          non_md=$(printf '%s\n' "$files" | grep -vE "$SKIP_RE" || true)
          if [ -n "$files" ] && [ -z "$non_md" ]; then
            printf '문서 전용 PR — 스모크를 건너뜁니다:\n%s\n' "$files" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi

          if [ -z "$BYPASS" ]; then
            echo "::warning title=Preview Smoke 스킵::VERCEL_AUTOMATION_BYPASS_SECRET 미설정 — 런타임 검증이 돌지 않았습니다. Vercel → Deployment Protection → Protection Bypass for Automation에서 시크릿을 만들어 등록해주세요."
            echo "VERCEL_AUTOMATION_BYPASS_SECRET 미설정 — 스모크 스킵" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      # 예전엔 이 URL을 deployment_status 이벤트에서 받았다. 그 이벤트가 안 오면 워크플로우가
      # 통째로 안 돌아 check-run이 생성되지 않았고, 그건 필수 체크로 쓸 때 영구 Pending이 된다.
      # 이제 직접 조회하며 기다린다 — 이 잡은 어떤 경우에도 결론을 낸다.
      - name: Vercel Preview 배포 URL 대기
        id: preview
        if: steps.guard.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          TIMEOUT_S: "600"     # 10분. Vercel 빌드가 이보다 오래 걸리면 재실행이 맞다
          INTERVAL_S: "15"
        run: |
          set -euo pipefail

          deadline=$(( $(date -u +%s) + TIMEOUT_S ))
          url=""
          declare -A resolved   # 실패로 확정된 배포 id → 이후 폴링에서 재조회하지 않고 건너뛴다

          while :; do
            # 이 커밋의 배포 중 성공 상태이고 URL이 있는 것. Vercel은 Preview/Production을
            # 각각 만들므로 environment 이름으로 거르지 않고 URL 유무로만 본다 — 실질적으로
            # PR head sha에는 Vercel Preview 배포만 걸리기 때문에 지금은 안전하다. 같은 sha에
            # 다른 배포 연동(별도 Vercel 프로젝트, 다른 CI 등)이 붙으면 그 URL을 잘못 집을 수
            # 있으니, 그런 연동을 추가할 땐 이 필터를 다시 넣어야 한다.
            #
            # 파이프에 `head`를 쓰지 않는다 — `set -o pipefail`에서 head가 파이프를 일찍 닫으면
            # SIGPIPE로 전체가 실패로 잡혀, 조회 실패와 "아직 없음"이 구별되지 않는다.
            ids=$(gh api "repos/$REPO/deployments?sha=$SHA&per_page=100" --jq '.[].id' 2>/dev/null || true)

            url=""
            fail_msg=""
            for id in $ids; do
              # 이미 실패로 확정된 배포는 상태가 바뀌지 않으므로 매 폴링마다 다시 조회하지 않는다
              [ -n "${resolved[$id]:-}" ] && continue

              statuses=$(gh api "repos/$REPO/deployments/$id/statuses?per_page=100" --jq '[.[] | {state, environment_url}]' 2>/dev/null || echo '[]')

              found=$(echo "$statuses" | jq -r 'map(select(.state=="success")) | map(.environment_url // "") | map(select(. != "")) | first // empty')
              if [ -n "$found" ]; then
                url="$found"
                break
              fi

              # 상태 이력은 최신순이라 맨 앞 항목이 현재 상태다. error/failure면 이 배포는
              # 더 볼 필요가 없다 — 타임아웃까지 기다리지 않고 바로 실패로 끝낸다.
              latest_state=$(echo "$statuses" | jq -r '.[0].state // empty')
              if [ "$latest_state" = "error" ] || [ "$latest_state" = "failure" ]; then
                resolved[$id]=1
                fail_msg="배포 id $id 상태: $latest_state"
              fi
            done

            if [ -n "$url" ]; then
              echo "배포 URL: $url"
              echo "url=$url" >> "$GITHUB_OUTPUT"
              break
            fi

            if [ -n "$fail_msg" ]; then
              echo "::error title=Preview 배포 실패::$fail_msg — Vercel 빌드가 실패했습니다(Vercel 체크도 빨간불일 것입니다). Vercel을 확인하고 필요하면 재실행해주세요."
              exit 1
            fi

            if [ "$(date -u +%s)" -ge "$deadline" ]; then
              echo "::error title=Preview 배포를 찾지 못함::${TIMEOUT_S}초 안에 이 커밋($SHA)의 성공한 Vercel Preview 배포가 나타나지 않았습니다. Vercel 빌드가 실패했거나(그 경우 Vercel 체크도 빨간불입니다) 배포가 지연됐습니다 — Vercel을 확인하고 이 잡을 재실행해주세요."
              exit 1
            fi

            echo "아직 없음 — ${INTERVAL_S}초 후 재확인"
            sleep "$INTERVAL_S"
          done

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.run == 'true'
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - run: npm ci
        if: steps.guard.outputs.run == 'true'
      # Pixel 7 프로젝트도 chromium 엔진이라 브라우저는 하나면 된다
      - run: npx playwright install --with-deps chromium
        if: steps.guard.outputs.run == 'true'

      - name: E2E 스모크
        if: steps.guard.outputs.run == 'true'
        env:
          E2E_BASE_URL: ${{ steps.preview.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          echo "대상: $E2E_BASE_URL" | tee -a "$GITHUB_STEP_SUMMARY"
          npx playwright test

      # 실패했을 때 원인을 보려면 리포트·트레이스·스크린샷·비디오가 필요하다.
      # claude-fix.yml이 `gh run view --log-failed`로 읽는 로그와 별개로, 사람이 열어볼 몫.
      - uses: actions/upload-artifact@v4
        if: always() && steps.guard.outputs.run == 'true'
        with:
          name: playwright-report-${{ github.event.pull_request.head.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
