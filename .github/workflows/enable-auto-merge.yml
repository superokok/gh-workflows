name: Enable auto-merge (reusable)

# 네이티브 auto-merge를 켤지 말지 **한 번만** 결정한다. 머지 판정 자체는 GitHub이 한다.
#
# 이전(`auto-merge.yml`, 221줄)은 게이트를 우리가 직접 판정하고 머지까지 수행했다.
# GitHub Free 프라이빗 저장소엔 브랜치 보호가 없어서 달리 방법이 없었다(ADR 0007·0008).
# Pro로 올리면서 그 제약이 사라졌고, 표준(브랜치 보호 required checks + 네이티브
# auto-merge)으로 옮긴다.
#
# ── 무엇이 좋아지나 (2026-09-07·09 실측 근거) ────────────────────────────────
# 이전 방식은 **감시자 자신이 죽을 수 있었다.** 워크플로우라 스스로 시작해야 하고
# (호출부 permissions 누락으로 startup_failure 두 번), `workflow_run` 이벤트로 깨어나야
# 하고(이벤트 유실 가능), 죽으면 아무 신호 없이 전체 머지가 멈췄다(9/7 3시간 정지).
# 네이티브 auto-merge는 GitHub이 직접 평가한다 — 죽을 워크플로우도, 잃을 이벤트 중계도 없다.
# 남는 위험(필수 체크가 영영 안 생기면 대기)은 그대로지만, PR 화면에 보이게 된다.
#
# ── 위험 경로를 "체크 실패"로 만들지 않는 이유 ────────────────────────────────
# 필수 체크를 실패시키면 **사람도 머지를 못 한다**(관리자 우회가 필요해진다).
# 네이티브 auto-merge는 PR별 opt-in이므로, **안 켜는 것 자체가 게이트**다. 체크는 전부
# 초록인 채로 머지 버튼만 사람 몫으로 남는다 — 이게 우리가 원하던 동작 그대로다.

on:
  workflow_call:
    inputs:
      base-branch:
        description: 이 base를 향한 PR만 대상으로 한다
        type: string
        default: "develop"
      merge-method:
        description: squash / merge / rebase
        type: string
        default: "squash"
      risk-paths:
        description: |
          위험 경로 정규식(ERE). 변경 파일이 하나라도 걸리면 auto-merge를 켜지 않고
          do-not-merge 라벨과 코멘트를 남겨 사람 머지로 넘긴다.

          **빈 값이면 경로 기반 게이트를 쓰지 않는다.** 아래 `gate-weakening-markers`가
          그 자리를 대신한다 — "어떤 파일을 건드렸나"가 아니라 "게이트가 약해졌나"를 본다.
          경로 게이트는 같은 경로를 건드릴 때마다 매번 사람을 부르는데, **매번 부르는
          게이트는 결국 안 읽고 통과시키게 된다.** 그러면 지연만 남고 검출은 0이다.
        type: string
        default: ""
      gate-paths:
        description: |
          아래 약화 검사를 돌릴 파일 범위. 여기 걸리는 파일이 하나도 안 바뀌면 체크아웃도
          하지 않는다(보통 PR은 이쪽이다 — 비용 0).
        type: string
        default: "^(\\.github/workflows/|\\.claude/|scripts/hooks/|common/)"
      gate-weakening-markers:
        description: |
          **게이트를 약화시키는 변경**을 base와의 diff에서 찾는 정규식 목록(한 줄에 하나).
          줄 앞의 `-`는 *삭제된 줄*, `+`는 *추가된 줄*에서 찾는다는 뜻이다.

          왜 경로가 아니라 diff인가: 위험 경로 게이트는 "이 파일을 건드렸다"까지만 알고
          **무엇을 했는지는 모른다.** 그래서 주석 한 줄을 고쳐도 사람을 부르고, 그 빈도가
          곧 "안 보고 머지"를 만든다. 반면 게이트가 약해지는 방식은 몇 가지로 정해져 있고
          대부분 diff에 **삭제된 줄**로 나타난다 — 권한 블록이 사라지거나(잡이
          startup_failure로 조용히 죽는다), 훅 등록이 사라지거나, 테스트 호출이 사라지거나,
          트리거가 사라지는 것. 이건 기계가 볼 수 있다. "기계가 원리적으로 못 잡는다"고
          적어뒀던 것 중 상당 부분은 **안 만들어본 것**이었다.

          오탐이 나면 결과는 기존 위험 경로 게이트와 같다(사람 머지) — 지금보다 나빠지지 않는다.
        type: string
        default: |
          -^\s*permissions:
          -^\s*base-branch:
          -^\s*risk-paths:
          -^\s*pull_request:
          -^\s*needs:
          -guard-branch\.sh
          -guard-env\.sh
          -PreToolUse
          -run-tests\.sh
          -test:hooks
          +^\s*continue-on-error:\s*true
      require-paired-change:
        description: |
          `A||B` 꼴을 한 줄에 하나씩. **A에 걸리는 파일이 바뀌면 B에 걸리는 파일도 같이
          바뀌어야 한다.** 아니면 사람 머지로 넘긴다.

          훅처럼 "회귀 테스트가 있어도 새 우회로는 못 잡는" 것에 쓴다. 테스트가 그 우회로를
          잡는지까지는 기계가 모르지만, **우회로를 기대 동작으로 적게 강제**하는 건 기계가
          할 수 있다 — 아무 테스트도 안 건드린 채 조건 하나를 더하는 경로가 막힌다.
        type: string
        default: ""
      notify-handle:
        description: |
          위험 경로 게이트가 사람 머지로 넘길 때 담당자로 지정할 GitHub 핸들(예: "octocat").
          빈 문자열(기본값)이면 아무것도 하지 않는다 — 기존 호출부는 무변화.

          **여기서는 담당자를 붙이지 않는다(#55).** 예전엔 이 게이트가 위험 경로를 감지한
          바로 그 순간(리뷰가 아직 도는 중) 담당자를 붙여서, 알림이 "버튼이 활성화되기
          전"에 도착했다(실측: 위험 경로 감지 직후 담당자 지정 → `review`는 2분 29초를
          더 돎). 담당자 지정은 `mergeStateStatus == CLEAN`(버튼 활성화)을 판정할 수 있는
          `claude-review.yml`의 `notify-handle` 입력이 대신 맡는다 — 두 호출부에 같은
          값을 넘긴다.

          이 입력이 여기서 하는 일은 딱 하나: **이미 담당자로 붙어 있으면 뗀다.** 초록
          이었다가 새 커밋이 와서 다시 위험 경로로 판정되면, "지금 눌러도 된다"가 다시
          거짓이 되기 때문이다. 담당자 해제는 알림을 만들지 않아 무해하고, 체크가 다시
          초록이 되면 `claude-review.yml` 쪽이 다시 붙이며 알림이 간다.
        type: string
        default: ""

jobs:
  decide:
    # Dependabot PR 제외 — 이유는 `claude-review.yml`의 같은 조건 주석 참고(시크릿이
    # 전달되지 않아 App 토큰 발급부터 실패한다). 여기가 막혀도 머지가 잠기지는 않지만
    # (`decide / decide`는 보통 필수 체크가 아니다) 빨간불과 분이 그대로 나간다.
    #
    # 스킵의 결과는 **auto-merge가 안 켜지는 것**이고, 그게 맞는 동작이다 — 의존성
    # 업데이트는 거의 전부 공급망 위험 경로라 원래도 `do-not-merge`가 붙어 사람 머지로
    # 갔을 것이다. 사람이 봐야 한다는 결론은 같고, 경로만 조용해진다.
    if: >-
      github.event.pull_request.base.ref == inputs.base-branch &&
      github.event.pull_request.draft == false &&
      github.actor != 'dependabot[bot]'
    # 같은 PR에 대한 실행을 직렬화한다. `opened` 직후 `synchronize`가 바로 이어지거나
    # 짧은 시간에 push가 겹치면 이 job이 동시에 여러 개 돌 수 있고, 그러면 라벨·코멘트
    # 중복 방지 체크와 `--disable-auto`/`--auto` 호출이 서로 경합해 auto-merge 상태가
    # 꼬일 수 있다. cancel-in-progress는 켜지 않는다 — 중간에 잘리면 "auto-merge를 껐지만
    # 코멘트는 못 단" 상태로 남을 수 있어, 그냥 줄 세워 마지막 push 기준으로 다시 판정하게 한다.
    concurrency:
      group: enable-auto-merge-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write        # auto-merge 활성화
      pull-requests: write   # 라벨 · 코멘트
      issues: write          # 라벨은 issues API를 탄다
    steps:
      # ── 자격증명: PAT가 아니라 GitHub App 설치 토큰 ──────────────────────────
      # App은 private key라 **만료가 없고**, 설치를 "All repositories"로 두면 새 저장소가
      # 자동으로 포함돼 저장소 목록을 갱신할 일이 없다. fine-grained PAT가 강제하던 1년
      # 교체와 저장소별 접근 목록 관리가 둘 다 사라진다.
      #
      # **자동 GITHUB_TOKEN과 달리 App 토큰으로 만든 이벤트는 다른 워크플로우를 트리거한다.**
      # 이 루프가 PAT를 쓰던 이유가 정확히 그거였고(라벨·머지·push가 다음 워크플로우를 깨워야
      # 한다), App은 그 성질을 그대로 갖는다.
      #
      # `app-id`(숫자)가 아니라 `client-id`를 쓴다. v3의 권장이기도 하지만, 실질적인 이유는
      # **App ID와 Installation ID가 둘 다 숫자라 구별이 안 된다**는 것이다. 설치 화면 URL의
      # 숫자를 App ID로 착각해 넣으면 JWT의 iss가 앱을 가리키지 않아
      # `A JSON web token could not be decoded`로 죽는다(2026-09-11 실제로 겪었다).
      # Client ID는 `Iv23…` 형태라 그 착각이 성립하지 않는다.
      #
      # App에 줘야 하는 권한: Contents / Pull requests / Issues / **Workflows** = write.
      # Workflows가 없으면 `.github/workflows/*` 커밋이 거부된다 — Claude GitHub App 설치
      # 토큰을 못 쓰고 PAT로 갔던 원래 이유가 이것이다(ADR 0007 "알려진 제약").
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.AGENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}

      # ── 게이트가 약해졌는가 — 경로가 아니라 diff를 본다 ──────────────────────
      - name: 변경 파일 수집
        id: changed
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          GATE_PATHS: ${{ inputs.gate-paths }}
        run: |
          set -euo pipefail
          gh pr view "$PR" --repo "$REPO" --json files --jq '.files[].path' \
            > "$RUNNER_TEMP/files.txt"
          # 게이트 범위를 안 건드렸으면 체크아웃도 안 한다 — 보통 PR의 비용은 0이다.
          if [ -n "$GATE_PATHS" ] && grep -qE "$GATE_PATHS" "$RUNNER_TEMP/files.txt"; then
            echo "touches_gate=true" >> "$GITHUB_OUTPUT"
            echo "게이트 범위 변경 있음 — 약화 검사를 돌린다"
          else
            echo "touches_gate=false" >> "$GITHUB_OUTPUT"
          fi

      # `pull_request`에서 기본 체크아웃은 **머지 커밋**이다 — 통합 브랜치에 실제로 얹힐
      # 결과를 보는 것이라 PR 헤드보다 정확하다.
      - uses: actions/checkout@v7
        if: steps.changed.outputs.touches_gate == 'true'
        with:
          fetch-depth: 0

      - name: 게이트 약화 검사
        if: steps.changed.outputs.touches_gate == 'true'
        env:
          BASE: ${{ inputs.base-branch }}
          MARKERS: ${{ inputs.gate-weakening-markers }}
          PAIRED: ${{ inputs.require-paired-change }}
          GATE_PATHS: ${{ inputs.gate-paths }}
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/gate-findings.txt"
          add() { printf '%s\n' "$1" >> "$RUNNER_TEMP/gate-findings.txt"; }

          if ! git rev-parse --verify -q "origin/$BASE" >/dev/null; then
            echo "::warning title=게이트 약화 검사 건너뜀::origin/$BASE 를 찾지 못했다"
            exit 0
          fi

          changed_all=$(git diff --name-only "origin/$BASE" HEAD || true)
          gate_files=$(printf '%s\n' "$changed_all" | grep -E "$GATE_PATHS" || true)

          # ── 삭제/추가된 줄에서 약화 표식을 찾는다 ──────────────────────────
          while IFS= read -r raw; do
            marker=$(printf '%s' "$raw" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
            [ -n "$marker" ] || continue
            dir=$(printf '%s' "$marker" | cut -c1)
            re=$(printf '%s' "$marker" | cut -c2-)
            [ -n "$re" ] || continue
            case "$dir" in
              -) want='^-' ; skip='^---' ; label='삭제됨' ;;
              +) want='^\+'; skip='^\+\+\+'; label='추가됨' ;;
              *) echo "::warning::표식의 방향(+/-)이 없다: $marker"; continue ;;
            esac
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              hits=$(git diff "origin/$BASE" HEAD -- "$f" \
                       | grep -E "$want" | grep -Ev "$skip" \
                       | sed -E 's/^.//' | grep -E "$re" || true)
              if [ -n "$hits" ]; then
                first=$(printf '%s\n' "$hits" | head -2 | sed 's/^[[:space:]]*//' | tr '\n' ' ')
                add "- \`$f\` — $label: $first"
              fi
            done <<< "$gate_files"
          done <<< "$MARKERS"

          # ── 짝 변경 규칙 ───────────────────────────────────────────────────
          while IFS= read -r raw; do
            rule=$(printf '%s' "$raw" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
            [ -n "$rule" ] || continue
            case "$rule" in
              *"||"*) ;;
              *) echo "::warning::짝 규칙 형식이 아니다: $rule"; continue ;;
            esac
            a=${rule%%||*}
            b=${rule##*||}
            if printf '%s\n' "$changed_all" | grep -qE "$a"; then
              if ! printf '%s\n' "$changed_all" | grep -qE "$b"; then
                add "- \`$a\` 를 바꿨는데 \`$b\` 는 그대로다 — 짝 변경 규칙 위반"
              fi
            fi
          done <<< "$PAIRED"

          if [ -s "$RUNNER_TEMP/gate-findings.txt" ]; then
            echo "게이트 약화 의심:"; cat "$RUNNER_TEMP/gate-findings.txt"
          else
            echo "게이트 약화 없음 — 자동 머지 경로로 간다"
          fi

      # ── 열릴 때부터 충돌인 PR도 부른다 ────────────────────────────────────────
      #
      # `after-merge`에 "이 머지로 충돌하게 된 PR에 사람을 부른다"가 이미 있는데, 그건
      # **머지 이벤트에만 돈다.** 그래서 **머지가 끝난 뒤에 열린 PR이 이미 충돌 상태면
      # 아무도 안 부른다** — 그 뒤로 머지가 없으면 다시 볼 기회조차 없다.
      #
      # 2026-09-17 실측: #104가 06:16에 머지되고 #105가 06:43에 그 위에서 열렸는데(브랜치를
      # `origin/main`이 아닌 다른 브랜치에서 딴 실수), 열릴 때부터 CONFLICTING이었다.
      # 라벨도 담당자도 안 붙었고 **사용자가 PR 목록을 직접 보고 발견했다.**
      #
      # 충돌은 체크를 빨갛게 만들지 않는다 — `mergeable`이 CONFLICTING이 될 뿐이라
      # auto-merge가 조용히 안 켜지고, 그 침묵은 "아직 검사 중"과 구별되지 않는다.
      - name: 열릴 때부터 충돌이면 사람을 부른다
        id: conflict
        if: ${{ !cancelled() && inputs.notify-handle != '' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ inputs.base-branch }}
          NOTIFY_HANDLE: ${{ inputs.notify-handle }}
        run: |
          set +e
          set -o pipefail

          # GitHub은 `mergeable`을 **비동기로** 계산한다. PR이 막 열린 직후에는 거의 항상
          # UNKNOWN이고, 그때 판정하면 충돌을 통째로 놓친다. UNKNOWN인 동안만 다시 묻는다 —
          # 보통 몇 초면 끝나므로 평소 비용은 API 호출 한 번이다.
          RETRY_COUNT=6
          RETRY_INTERVAL_SEC=5
          for i in $(seq 1 "$RETRY_COUNT"); do
            info=$(gh pr view "$PR" --repo "$REPO" --json mergeable,labels,assignees 2>/dev/null)
            mergeable=$(printf '%s' "$info" | jq -r '.mergeable // "UNKNOWN"' 2>/dev/null)
            [ "$mergeable" != "UNKNOWN" ] && break
            echo "mergeable 계산 대기 중 (시도 $i/$RETRY_COUNT)"
            [ "$i" -lt "$RETRY_COUNT" ] && sleep "$RETRY_INTERVAL_SEC"
          done

          has_label=$(printf '%s' "$info" | jq -r '[.labels[].name] | any(. == "needs-rebase")' 2>/dev/null)

          # 충돌이 풀렸으면 라벨을 뗀다. 안 떼면 낡은 라벨이 남아 다음 충돌 때 "이미 알렸다"로
          # 판정돼 **진짜 충돌이 조용해진다**(`after-merge`의 같은 스텝과 같은 이유).
          if [ "$mergeable" = "MERGEABLE" ] && [ "$has_label" = "true" ]; then
            gh pr edit "$PR" --repo "$REPO" --remove-label needs-rebase >/dev/null 2>&1 \
              && echo "충돌 해소됨 — needs-rebase 제거"
            exit 0
          fi

          if [ "$mergeable" != "CONFLICTING" ]; then
            echo "충돌 아님 (mergeable=$mergeable)"; exit 0
          fi

          # 라벨이 곧 멱등 표식이다. push마다 이 스텝이 다시 도는데, 같은 충돌로 매번
          # 부르면 그 알림은 읽히지 않게 된다.
          if [ "$has_label" = "true" ]; then
            echo "이미 needs-rebase — 중복 알림 방지, 스킵"; exit 0
          fi

          if ! err=$(gh pr edit "$PR" --repo "$REPO" --add-label needs-rebase 2>&1); then
            echo "::warning title=needs-rebase 라벨 부착 실패::PR #${PR}: ${err}"
          fi
          if ! err=$(gh pr edit "$PR" --repo "$REPO" --add-assignee "$NOTIFY_HANDLE" 2>&1); then
            echo "::warning title=담당자 지정 실패::PR #${PR}에 @${NOTIFY_HANDLE} 지정 실패 — 충돌 알림이 사람에게 닿지 않았을 수 있다: ${err}"
          fi
          {
            printf '@%s\n\n' "$NOTIFY_HANDLE"
            printf '%s\n\n' "⚠️ **머지 충돌** \`[AGENT-ACTION-REQUIRED]\` — 이 PR은 \`${BASE}\`와 충돌한 상태로 열렸습니다."
            printf '%s\n\n' '충돌은 체크를 빨갛게 만들지 않아서 auto-merge가 **조용히** 멈춥니다. 자동 리베이스는 하지 않습니다 — 리뷰 중인 커밋을 기계가 다시 쓰면 고친 것이 사라질 수 있어, 어느 쪽을 살릴지는 diff를 본 사람이 정해야 합니다.'
            printf '%s\n' '해소하고 push하면 `needs-rebase` 라벨이 자동으로 떨어집니다.'
          } | gh pr comment "$PR" --repo "$REPO" --body-file -
          echo "충돌 — 라벨·담당자·코멘트 완료"

      - name: 위험 경로면 사람에게, 아니면 auto-merge 켜기
        env:
          # PAT를 쓴다 — GITHUB_TOKEN으로 켠 auto-merge가 수행하는 머지는 그 결과 push가
          # 다른 워크플로우를 깨우지 않는다(GitHub 플랫폼 제약, ADR 0007). release-pr.yml이
          # 갱신되지 않고 develop의 CI도 안 돌게 된다.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          RISK_RE: ${{ inputs.risk-paths }}
          METHOD: ${{ inputs.merge-method }}
          NOTIFY_HANDLE: ${{ inputs.notify-handle }}
        run: |
          set -euo pipefail

          # **빈 정규식을 grep에 그대로 넘기면 모든 줄이 걸린다** — 경로 게이트를 끈
          # 저장소에서 전 PR이 사람 머지가 된다. 빈 값은 "검사 안 함"이다.
          risky=""
          if [ -n "$RISK_RE" ]; then
            risky=$(grep -E "$RISK_RE" "$RUNNER_TEMP/files.txt" || true)
          fi

          gate=""
          if [ -s "$RUNNER_TEMP/gate-findings.txt" ]; then
            gate=$(cat "$RUNNER_TEMP/gate-findings.txt")
          fi

          if [ -n "$risky" ] || [ -n "$gate" ]; then
            if [ -n "$risky" ]; then echo "위험 경로 감지:"; echo "$risky"; fi
            if [ -n "$gate" ]; then echo "게이트 약화 감지:"; echo "$gate"; fi

            # 이전에 켜뒀는데 나중 push로 위험해진 경우를 반드시 되돌린다.
            # 안 끄면 체크가 초록이 되는 순간 사람 확인 없이 머지된다.
            # `A && B || C`는 if-then-else가 아니다(shellcheck SC2015). if로 쓴다.
            if gh pr merge "$PR" --repo "$REPO" --disable-auto 2>/dev/null; then
              echo "이전에 켜둔 auto-merge를 껐다"
            fi

            # **이 라벨은 사람 게이트 전체가 의존하는 표식이다.** 부착이 실패하면 auto-merge는
            # 꺼졌는데 표식이 없어, `claude-review.yml`의 `notify-ready`가 초록 경로에서
            # `has_dnm != true`로 판정해 담당자를 붙이지 않는다 — 사람이 아무것도 못 받는다.
            # 저장소의 다른 라벨 조작(after-merge의 drain-queue, claude-agent의 wake-if-idle)은
            # 이미 5회 재시도 + 실패 시 `::error`인데(PR #53 리뷰 지적) 정작 여기만
            # `|| true`로 삼키고 있었다. 같은 처리로 맞춘다 — 재시도 딜레이도 그 둘의
            # `label_with_retry`처럼 지수 백오프(3→6→12→24초)로 맞춘다. 고정 딜레이면
            # 같은 일시적 실패 구간(예: API 레이트리밋)에 5회가 몰려 실패 확률이 높아진다(#67).
            # 이 블록은 `set -euo pipefail` 아래에 있다. 성공/실패를 변수에 담아야 하므로
            # `cmd && var=true` 꼴을 쓰지 않는다 — 테스트가 거짓이면 그 자체가 종료 코드 1이라
            # 스크립트가 **그 자리에서 죽어** 아래 코멘트가 나가지 않는다.
            labeled=false
            n=1
            delay=3
            while [ "$n" -le 5 ]; do
              if gh pr edit "$PR" --repo "$REPO" --add-label do-not-merge; then
                labeled=true
                break
              fi
              if [ "$n" -eq 5 ]; then
                break
              fi
              echo "do-not-merge 라벨 부착 실패 (PR #$PR), ${delay}초 후 재시도 ($n/5)"
              sleep "$delay"
              n=$((n + 1))
              delay=$((delay * 2))
            done

            # **남은 경합(#96, PR #95 리뷰 지적):** 이 `decide` job과 `claude-review.yml`의
            # 담당자 지정 스텝은 서로 다른 워크플로우라 순서를 보장할 수 없다. 담당자 지정
            # 스텝이 이 라벨이 아직 붙기 전 순간을 읽으면 "do-not-merge 아님"으로 판정해
            # 끝나버릴 수 있다 — 그러면 이후 체크가 계속 초록이 안 되는 한 사람이 영영
            # 안 불린다. 이 `decide` job 자신도 PR의 체크 목록(`statusCheckRollup`)에
            # 하나로 잡히므로, 담당자 지정 스텝이 **매 재시도마다 그 목록을 다시 읽는 한**
            # (바로 위 `read_required`의 #96 수정) 이 job이 끝나기 전엔 초록 판정 자체가
            # 안 나 경합 창이 실질적으로 닫힌다. 다만 이 job이 통계적으로 아주 빨리 끝나
            # 아직 체크 목록에 잡히기도 전에 사라지는 극단적인 경우까지는 막지 못한다 —
            # 발생 가능성이 낮아 다음 실제 사례가 나오면 그때 고친다.
            # 담당자는 여기서 붙이지 않는다(#55) — 체크가 아직 도는 중일 수 있어 "지금
            # 눌러도 된다"가 거짓인 채로 알림이 갈 수 있다. 대신 이전 push로 이미 붙어
            # 있으면 뗀다: 그때는 초록이었지만 이번 push로 다시 위험 경로가 됐으니 그
            # 불변식이 다시 거짓이다. 해제는 알림을 만들지 않아 무해하고, 다시 초록이
            # 되면 `claude-review.yml`이 다시 붙이며 알림이 간다.
            if [ -n "$NOTIFY_HANDLE" ]; then
              gh pr edit "$PR" --repo "$REPO" --remove-assignee "$NOTIFY_HANDLE" 2>/dev/null || true
              gh pr edit "$PR" --repo "$REPO" --remove-reviewer "$NOTIFY_HANDLE" 2>/dev/null || true
            fi

            # 같은 마커가 이미 있으면 다시 달지 않는다(push마다 재실행되므로).
            if ! gh pr view "$PR" --repo "$REPO" --json comments --jq '.comments[].body' \
                 | grep -qF '<!-- gate:risk-path -->'; then
              # **여기서 `@핸들`을 붙이지 않는다.** 멘션은 watch 설정과 무관하게 메일을
              # 만드는데, 이 스텝은 PR이 열리자마자 돈다 — 체크가 아직 도는 중이고 머지
              # 버튼은 비활성이다. #55가 "담당자 지정"을 초록 시점으로 옮겼지만 **코멘트
              # 안의 멘션은 그대로 남아 있어서**, 고친 경로 옆으로 같은 알림이 계속 새고
              # 있었다(2026-09-17 실측: PR 생성 17초 뒤 멘션 메일, 체크는 그 뒤로 100초 더 돎).
              # 이 코멘트는 **기록**이다 — 왜 자동 머지를 안 켰는지 남긴다.
              # 사람을 부르는 건 초록이 된 뒤의 담당자 지정 하나로 일원화한다.
              {
                printf '%s\n\n' '⏸️ **자동 머지를 켜지 않았습니다**'
                if [ -n "$gate" ]; then
                  printf '%s\n\n' '**게이트가 약해졌을 수 있습니다.** 아래 변경은 검사를 통과시키는 게 아니라 *검사를 사라지게* 만들 수 있어서 이것만은 사람이 봐야 합니다 — 이 부류는 CI에서도 스테이징에서도 증상이 없습니다.'
                  printf '%s\n' "$gate"
                  printf '\n%s\n\n' '의도한 변경이면 그대로 Merge하세요.'
                fi
                if [ -n "$risky" ]; then
                  printf '%s\n\n' '위험 경로 파일이 바뀌어 자동 머지를 켜지 않았습니다 — diff를 보고 직접 Merge해주세요.'
                  printf '```\n%s\n```\n\n' "$risky"
                fi
                printf '%s\n' '체크가 전부 초록이 되면 담당자로 지정해 알려드립니다 — 그때 눌러주세요.'
                printf '%s\n' '<!-- gate:risk-path -->'
              } | gh pr comment "$PR" --repo "$REPO" --body-file -
            fi

            # 실패를 드러내는 건 **코멘트를 보낸 뒤**다. 라벨이 없으면 담당자 지정 경로가
            # 죽으므로, 남은 알림인 이 코멘트만큼은 반드시 나가야 한다.
            if [ "$labeled" != "true" ]; then
              echo "::error title=do-not-merge 라벨 부착 실패::PR #${PR}에 5회 모두 실패했다. auto-merge는 꺼졌지만 표식이 없어 담당자 지정 경로(notify-ready)가 동작하지 않는다 — 라벨을 수동으로 붙여달라."
              if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
                printf '🔴 PR #%s `do-not-merge` 라벨 부착 5회 실패 — 수동 부착 필요\n' "$PR" >> "$GITHUB_STEP_SUMMARY"
              fi
              exit 1
            fi
            exit 0
          fi

          # 위험 경로가 아니면 auto-merge를 켠다. 이후 판정·머지는 GitHub이 한다.
          # 이미 켜져 있으면 이 명령은 실패하는데(무해), 그때도 잡을 초록으로 둔다.
          gh pr edit "$PR" --repo "$REPO" --remove-label do-not-merge 2>/dev/null || true

          if gh pr merge "$PR" --repo "$REPO" --auto --"$METHOD" --delete-branch; then
            echo "auto-merge 켬 ($METHOD) — 필수 체크가 전부 통과하면 GitHub이 머지한다"
          else
            # 흔한 경우: 이미 켜져 있음 / 이미 머지됨 / 충돌.
            # 여기서 실패로 만들면 빨간불이 나서 claude-fix가 고칠 것도 없는 걸 고치려 든다.
            echo "auto-merge를 켜지 못했다 — 이미 켜져 있거나, 머지됨, 또는 충돌 상태일 수 있다"
            gh pr view "$PR" --repo "$REPO" --json mergeable,mergeStateStatus,autoMergeRequest \
              --jq '{mergeable, mergeStateStatus, autoMerge: (.autoMergeRequest != null)}'
          fi
