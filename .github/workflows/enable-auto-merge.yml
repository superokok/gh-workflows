name: Enable auto-merge (reusable)

# 네이티브 auto-merge를 켤지 말지 **한 번만** 결정한다. 머지 판정 자체는 GitHub이 한다.
#
# 이전(`auto-merge.yml`, 221줄)은 게이트를 우리가 직접 판정하고 머지까지 수행했다.
# GitHub Free 프라이빗 저장소엔 브랜치 보호가 없어서 달리 방법이 없었다(ADR 0007·0008).
# Pro로 올리면서 그 제약이 사라졌고, 표준(브랜치 보호 required checks + 네이티브
# auto-merge)으로 옮긴다.
#
# ── 무엇이 좋아지나 (2026-09-07·09 실측 근거) ────────────────────────────────
# 이전 방식은 **감시자 자신이 죽을 수 있었다.** 워크플로우라 스스로 시작해야 하고
# (호출부 permissions 누락으로 startup_failure 두 번), `workflow_run` 이벤트로 깨어나야
# 하고(이벤트 유실 가능), 죽으면 아무 신호 없이 전체 머지가 멈췄다(9/7 3시간 정지).
# 네이티브 auto-merge는 GitHub이 직접 평가한다 — 죽을 워크플로우도, 잃을 이벤트 중계도 없다.
# 남는 위험(필수 체크가 영영 안 생기면 대기)은 그대로지만, PR 화면에 보이게 된다.
#
# ── 위험 경로를 "체크 실패"로 만들지 않는 이유 ────────────────────────────────
# 필수 체크를 실패시키면 **사람도 머지를 못 한다**(관리자 우회가 필요해진다).
# 네이티브 auto-merge는 PR별 opt-in이므로, **안 켜는 것 자체가 게이트**다. 체크는 전부
# 초록인 채로 머지 버튼만 사람 몫으로 남는다 — 이게 우리가 원하던 동작 그대로다.

on:
  workflow_call:
    inputs:
      base-branch:
        description: 이 base를 향한 PR만 대상으로 한다
        type: string
        default: "develop"
      merge-method:
        description: squash / merge / rebase
        type: string
        default: "squash"
      risk-paths:
        description: |
          위험 경로 정규식(ERE). 변경 파일이 하나라도 걸리면 auto-merge를 켜지 않고
          do-not-merge 라벨과 코멘트를 남겨 사람 머지로 넘긴다. 프로젝트마다 다르므로 필수.
        type: string
        required: true
      notify-handle:
        description: |
          위험 경로 게이트가 사람 머지로 넘길 때 담당자로 지정할 GitHub 핸들(예: "octocat").
          빈 문자열(기본값)이면 아무것도 하지 않는다 — 기존 호출부는 무변화.

          **여기서는 담당자를 붙이지 않는다(#55).** 예전엔 이 게이트가 위험 경로를 감지한
          바로 그 순간(리뷰가 아직 도는 중) 담당자를 붙여서, 알림이 "버튼이 활성화되기
          전"에 도착했다(실측: 위험 경로 감지 직후 담당자 지정 → `review`는 2분 29초를
          더 돎). 담당자 지정은 `mergeStateStatus == CLEAN`(버튼 활성화)을 판정할 수 있는
          `claude-review.yml`의 `notify-handle` 입력이 대신 맡는다 — 두 호출부에 같은
          값을 넘긴다.

          이 입력이 여기서 하는 일은 딱 하나: **이미 담당자로 붙어 있으면 뗀다.** 초록
          이었다가 새 커밋이 와서 다시 위험 경로로 판정되면, "지금 눌러도 된다"가 다시
          거짓이 되기 때문이다. 담당자 해제는 알림을 만들지 않아 무해하고, 체크가 다시
          초록이 되면 `claude-review.yml` 쪽이 다시 붙이며 알림이 간다.
        type: string
        default: ""

jobs:
  decide:
    # Dependabot PR 제외 — 이유는 `claude-review.yml`의 같은 조건 주석 참고(시크릿이
    # 전달되지 않아 App 토큰 발급부터 실패한다). 여기가 막혀도 머지가 잠기지는 않지만
    # (`decide / decide`는 보통 필수 체크가 아니다) 빨간불과 분이 그대로 나간다.
    #
    # 스킵의 결과는 **auto-merge가 안 켜지는 것**이고, 그게 맞는 동작이다 — 의존성
    # 업데이트는 거의 전부 공급망 위험 경로라 원래도 `do-not-merge`가 붙어 사람 머지로
    # 갔을 것이다. 사람이 봐야 한다는 결론은 같고, 경로만 조용해진다.
    if: >-
      github.event.pull_request.base.ref == inputs.base-branch &&
      github.event.pull_request.draft == false &&
      github.actor != 'dependabot[bot]'
    # 같은 PR에 대한 실행을 직렬화한다. `opened` 직후 `synchronize`가 바로 이어지거나
    # 짧은 시간에 push가 겹치면 이 job이 동시에 여러 개 돌 수 있고, 그러면 라벨·코멘트
    # 중복 방지 체크와 `--disable-auto`/`--auto` 호출이 서로 경합해 auto-merge 상태가
    # 꼬일 수 있다. cancel-in-progress는 켜지 않는다 — 중간에 잘리면 "auto-merge를 껐지만
    # 코멘트는 못 단" 상태로 남을 수 있어, 그냥 줄 세워 마지막 push 기준으로 다시 판정하게 한다.
    concurrency:
      group: enable-auto-merge-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write        # auto-merge 활성화
      pull-requests: write   # 라벨 · 코멘트
      issues: write          # 라벨은 issues API를 탄다
    steps:
      # ── 자격증명: PAT가 아니라 GitHub App 설치 토큰 ──────────────────────────
      # App은 private key라 **만료가 없고**, 설치를 "All repositories"로 두면 새 저장소가
      # 자동으로 포함돼 저장소 목록을 갱신할 일이 없다. fine-grained PAT가 강제하던 1년
      # 교체와 저장소별 접근 목록 관리가 둘 다 사라진다.
      #
      # **자동 GITHUB_TOKEN과 달리 App 토큰으로 만든 이벤트는 다른 워크플로우를 트리거한다.**
      # 이 루프가 PAT를 쓰던 이유가 정확히 그거였고(라벨·머지·push가 다음 워크플로우를 깨워야
      # 한다), App은 그 성질을 그대로 갖는다.
      #
      # `app-id`(숫자)가 아니라 `client-id`를 쓴다. v3의 권장이기도 하지만, 실질적인 이유는
      # **App ID와 Installation ID가 둘 다 숫자라 구별이 안 된다**는 것이다. 설치 화면 URL의
      # 숫자를 App ID로 착각해 넣으면 JWT의 iss가 앱을 가리키지 않아
      # `A JSON web token could not be decoded`로 죽는다(2026-09-11 실제로 겪었다).
      # Client ID는 `Iv23…` 형태라 그 착각이 성립하지 않는다.
      #
      # App에 줘야 하는 권한: Contents / Pull requests / Issues / **Workflows** = write.
      # Workflows가 없으면 `.github/workflows/*` 커밋이 거부된다 — Claude GitHub App 설치
      # 토큰을 못 쓰고 PAT로 갔던 원래 이유가 이것이다(ADR 0007 "알려진 제약").
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.AGENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}

      - name: 위험 경로면 사람에게, 아니면 auto-merge 켜기
        env:
          # PAT를 쓴다 — GITHUB_TOKEN으로 켠 auto-merge가 수행하는 머지는 그 결과 push가
          # 다른 워크플로우를 깨우지 않는다(GitHub 플랫폼 제약, ADR 0007). release-pr.yml이
          # 갱신되지 않고 develop의 CI도 안 돌게 된다.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          RISK_RE: ${{ inputs.risk-paths }}
          METHOD: ${{ inputs.merge-method }}
          NOTIFY_HANDLE: ${{ inputs.notify-handle }}
        run: |
          set -euo pipefail

          risky=$(gh pr view "$PR" --repo "$REPO" --json files --jq '.files[].path' \
                    | grep -E "$RISK_RE" || true)

          if [ -n "$risky" ]; then
            echo "위험 경로 감지:"; echo "$risky"

            # 이전에 켜뒀는데 나중 push로 위험해진 경우를 반드시 되돌린다.
            # 안 끄면 체크가 초록이 되는 순간 사람 확인 없이 머지된다.
            # `A && B || C`는 if-then-else가 아니다(shellcheck SC2015). if로 쓴다.
            if gh pr merge "$PR" --repo "$REPO" --disable-auto 2>/dev/null; then
              echo "이전에 켜둔 auto-merge를 껐다"
            fi

            gh pr edit "$PR" --repo "$REPO" --add-label do-not-merge || true

            # 담당자는 여기서 붙이지 않는다(#55) — 체크가 아직 도는 중일 수 있어 "지금
            # 눌러도 된다"가 거짓인 채로 알림이 갈 수 있다. 대신 이전 push로 이미 붙어
            # 있으면 뗀다: 그때는 초록이었지만 이번 push로 다시 위험 경로가 됐으니 그
            # 불변식이 다시 거짓이다. 해제는 알림을 만들지 않아 무해하고, 다시 초록이
            # 되면 `claude-review.yml`이 다시 붙이며 알림이 간다.
            if [ -n "$NOTIFY_HANDLE" ]; then
              gh pr edit "$PR" --repo "$REPO" --remove-assignee "$NOTIFY_HANDLE" 2>/dev/null || true
              gh pr edit "$PR" --repo "$REPO" --remove-reviewer "$NOTIFY_HANDLE" 2>/dev/null || true
            fi

            # 같은 마커가 이미 있으면 다시 달지 않는다(push마다 재실행되므로).
            if ! gh pr view "$PR" --repo "$REPO" --json comments --jq '.comments[].body' \
                 | grep -qF '<!-- gate:risk-path -->'; then
              {
                if [ -n "$NOTIFY_HANDLE" ]; then
                  printf '@%s\n\n' "$NOTIFY_HANDLE"
                fi
                printf '%s\n\n' '🔴 **머지 필요** `[AGENT-ACTION-REQUIRED]`'
                printf '%s\n\n' '위험 경로 파일이 바뀌어 자동 머지를 켜지 않았습니다. 체크가 전부 초록이어도 머지되지 않습니다 — diff를 보고 직접 Merge해주세요.'
                printf '```\n%s\n```\n\n' "$risky"
                printf '%s\n' '<!-- gate:risk-path -->'
              } | gh pr comment "$PR" --repo "$REPO" --body-file -
            fi
            exit 0
          fi

          # 위험 경로가 아니면 auto-merge를 켠다. 이후 판정·머지는 GitHub이 한다.
          # 이미 켜져 있으면 이 명령은 실패하는데(무해), 그때도 잡을 초록으로 둔다.
          gh pr edit "$PR" --repo "$REPO" --remove-label do-not-merge 2>/dev/null || true

          if gh pr merge "$PR" --repo "$REPO" --auto --"$METHOD" --delete-branch; then
            echo "auto-merge 켬 ($METHOD) — 필수 체크가 전부 통과하면 GitHub이 머지한다"
          else
            # 흔한 경우: 이미 켜져 있음 / 이미 머지됨 / 충돌.
            # 여기서 실패로 만들면 빨간불이 나서 claude-fix가 고칠 것도 없는 걸 고치려 든다.
            echo "auto-merge를 켜지 못했다 — 이미 켜져 있거나, 머지됨, 또는 충돌 상태일 수 있다"
            gh pr view "$PR" --repo "$REPO" --json mergeable,mergeStateStatus,autoMergeRequest \
              --jq '{mergeable, mergeStateStatus, autoMerge: (.autoMergeRequest != null)}'
          fi
