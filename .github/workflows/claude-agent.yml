name: Claude Agent (issue → PR) (reusable)

# 자율 작업 루프의 실행부 (docs/adr/0007-autonomous-agent-loop.md).
# 'agent' 라벨이 붙은 이슈를 프로젝트 규범대로 구현해서 PR을 연다.
# 머지는 CI check + auto-merge, 운영 반영은 사람 게이트(여기서 안 함).
#
# 전제(리포 설정 — 코드 아님):
#  - Claude GitHub App 설치 + secrets.CLAUDE_CODE_OAUTH_TOKEN (claude /install-github-app)
#  - secrets.AGENT_APP_CLIENT_ID / AGENT_APP_PRIVATE_KEY: 이 루프 전용 GitHub App.
#    Workflows 권한이 있어야 `.github/workflows/*` 커밋이 거부되지 않는다 — Claude
#    GitHub App 설치 토큰엔 그게 없어서 원래는 PAT로 우회했고(docs/adr/0007 "알려진 제약"),
#    자체 App은 그 권한을 직접 줄 수 있어 PAT 없이 해결된다.
#    secrets.GITHUB_TOKEN은 절대 안 쓴다(그 토큰 커밋엔 GitHub이 CI를 안 돌림).
#  - Settings → General → Allow auto-merge
#  - 브랜치 보호 + 'agent' 라벨 존재
#
# 2026-09-07: Node/Prisma 전제를 입력으로 뺐다. 워크플로우 저장소처럼 package.json이
# 없는 곳도 자기 이슈를 스스로 처리할 수 있어야 하기 때문이다 — 재사용 워크플로우를
# 분리하면서 "워크플로우 관련 후속 이슈는 그 저장소에 생기는데 거기엔 루프가 없다"는
# 구멍이 생겼다. `check.yml`과 같은 규칙: 커맨드 문자열이 빈 문자열이면 그 단계를 건너뛴다.

on:
  workflow_call:
    inputs:
      base-branch:
        description: 작업 브랜치를 딸 기준이자 PR의 base. 통합 브랜치가 없으면 "main"
        type: string
        default: "develop"
      node-version:
        type: string
        default: "22"
      java-version:
        description: JVM 빌드가 있는 프로젝트만 넘긴다 (예 "21"). 빈 문자열이면 건너뜀
        type: string
        default: ""
      java-distribution:
        description: setup-java의 distribution. java-version이 빈 문자열이면 무시된다
        type: string
        default: "temurin"
      # setup-node는 `node-version`이 아니라 `install`로 껐다 켠다 — check.yml과 규칙이
      # 다르다. check.yml은 검증 스텝들이 서로 독립이라(typecheck/test/lint 각자 켜고 끔)
      # node-version 하나로 setup-node만 끊어도 된다. 여기(agent/fix)는 install → prepare →
      # verify가 한 줄로 이어지는 순차 파이프라인이라, Node 셋업만 끄고 install/prepare는
      # 그대로 두면 "npm ci"가 Node 없이 돌게 되는 등 어중간한 상태가 남는다. install을
      # 끄는 스위치 하나로 그 파이프라인 전체를 통째로 건너뛰는 편이 안전하다.
      install:
        description: 의존성 설치. 빈 문자열이면 Node 셋업까지 통째로 건너뜀 (YAML만 있는 저장소)
        type: string
        default: "npm ci"
      prepare:
        description: 설치 직후 준비 단계 (코드 생성 등). 빈 문자열이면 건너뜀
        type: string
        default: "npx prisma generate"
      verify:
        description: 에이전트가 통과시켜야 하는 검증 커맨드. 빈 문자열이면 자동 검증 없음
        type: string
        default: "npm run check"
      changelog-file:
        description: 기능/로직 변경을 기록할 파일. 빈 문자열이면 건너뜀
        type: string
        default: "docs/BUSINESS_LOGIC.md"
      plan-only-paths:
        description: 구현하지 말고 계획만 코멘트하고 끝낼 경로 (사전 계획 게이트). 없으면 ""
        type: string
        default: "prisma/"
      risk-areas:
        description: 건드리면 do-not-merge를 붙일 구간 (사람이 diff 보고 머지)
        type: string
        default: "`auth` · `api/admin` · `scripts/` 배치 · `package.json` 의존성"

# **저장소당 하나만 돈다.** 이슈별로 묶으면 서로 다른 이슈의 에이전트가 병렬로 돌고,
# 둘 다 "열린 PR 없음"을 보고 진행해 WIP 제한이 뚫린다 — check-then-act 경합이다
# (2026-09-09 실측: 10:02:39·10:03:26에 각각 시작해 45초·85초 뒤 PR을 하나씩 열었다).
#
# 직렬화하면 두 번째는 첫 번째가 PR을 연 뒤에 시작하므로 그걸 보고 큐로 빠진다.
#
# `cancel-in-progress: false`인데도 **대기 슬롯은 하나뿐이다** — 세 번째가 오면 두 번째
# 대기 실행이 취소된다. 그 이슈는 `agent` 라벨만 남고 아무 일도 안 일어나므로,
# `after-merge.yml`의 drain-queue가 그런 "정지한 agent 이슈"도 같이 되살린다.
concurrency:
  group: claude-agent-${{ github.repository }}
  cancel-in-progress: false

jobs:
  # 판이 비었을 때 큐가 스스로 시작하게 한다(#49). 예전엔 `after-merge.yml`의
  # drain-queue(PR close)만 착수 판정을 했는데, PR이 하나도 없는 상태에서 이슈가
  # `agent-queued`로 만들어지면 그 close 이벤트 자체가 영영 안 와서 아무도 안 깨웠다.
  # 그래서 `agent-queued`가 붙는 이벤트에서도 같은 판정을 한 번 돌린다.
  #
  # **라벨 스왑 루프가 아니다.** 이 job은 `github.event.label.name == 'agent-queued'`일
  # 때만 돈다. 승격 과정에서 `agent-queued`를 떼고 `agent`를 붙이면 새 `labeled` 이벤트가
  # 나가지만, 그 이벤트의 `label.name`은 `agent`이지 `agent-queued`가 아니므로 이 job의
  # `if`에 다시 걸리지 않는다 — 승격은 이슈당 한 번뿐이고, 실제 착수(아래 `agent` job)는
  # 그 새 이벤트로 정확히 한 번만 돈다.
  #
  # drain-queue와 같은 이유로 **오래 기다린 순서(FIFO)를 지킨다** — 방금 라벨이 붙은
  # 이슈가 아니라 `agent-queued` 중 가장 오래된 이슈를 승격한다. 그래야 "판이 비었는데
  # 더 먼저 대기하던 이슈가 있다"는 상황에서도 새치기가 나지 않는다.
  #
  # 대기 슬롯 1개 문제(concurrency 그룹의 대기 칸이 하나뿐이라 세 번째 실행이 두 번째
  # 대기를 취소하는 것, 파일 상단 주석 참고)는 여기서 고치지 않는다. 이 job도 같은
  # `claude-agent-${{ github.repository }}` 그룹에 걸려 있어 취소될 수 있지만, 그건
  # "이미 누군가 판을 채우는 중"일 때만 일어난다 — 즉 판이 계속 비어 있는 원래 증상은
  # 최소 하나는 반드시 착수되므로 사라진다. 취소된 나머지는 그 PR이 나중에 닫힐 때
  # `after-merge.yml`의 drain-queue가 마저 깨운다(기존 경로 그대로).
  wake-if-idle:
    if: github.event.label.name == 'agent-queued'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      # PAT가 아니라 App 설치 토큰을 쓴다 — GITHUB_TOKEN으로 붙인 라벨은 `issues: labeled`
      # 이벤트를 내지 않아(GitHub 플랫폼 제약) 승격 뒤 `agent` job이 깨어나지 않는다.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.AGENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}

      - name: 판이 비었으면 가장 오래 기다린 이슈를 즉시 승격
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ inputs.base-branch }}
        run: |
          set -euo pipefail

          # remove-label → add-label 사이는 원자적이지 않다 — after-merge.yml의
          # drain-queue와 같은 이유로 add-label은 재시도하고, 그래도 실패하면 되돌린다.
          add_label_with_retry() {
            local issue="$1" label="$2" attempts=5 delay=3 n=1
            until gh issue edit "$issue" --repo "$REPO" --add-label "$label"; do
              if [ "$n" -ge "$attempts" ]; then return 1; fi
              echo "라벨 부착 실패 (#$issue → $label), ${delay}초 후 재시도 ($n/$attempts)"
              sleep "$delay"
              n=$((n + 1))
              delay=$((delay * 2))
            done
          }

          # drain-queue(after-merge.yml)와 같은 기준: 릴리스 PR(base=main)과 Dependabot
          # PR은 세지 않는다 — Dependabot PR은 사람이 처리할 때까지 계속 열려 있어서 그대로
          # 세면 큐가 영원히 안 풀린다(#47). 파일 겹침 판단은 여기서 하지 않는다 — 승격된
          # 이슈를 실제로 맡을 `agent` job의 스텝 0이 다시 판단해 필요하면 큐로 되돌린다.
          open=$(gh pr list --repo "$REPO" --base "$BASE" --state open --json number,author \
                   --jq '[.[] | select(.author.login != "dependabot[bot]")] | length')
          if [ "$open" != "0" ]; then
            echo "열린 $BASE PR $open건(Dependabot 제외) — 대기 유지, 승격하지 않는다"; exit 0
          fi

          next=$(gh issue list --repo "$REPO" --state open --label agent-queued \
                   --json number,createdAt --jq 'sort_by(.createdAt) | (.[0].number // empty)')
          if [ -z "$next" ]; then
            echo "agent-queued 이슈 없음 — 할 일 없음(라벨이 이미 바뀌었을 수 있다)"; exit 0
          fi

          echo "판이 비어 있음 — 가장 오래 기다린 #$next 를 즉시 승격한다"
          gh issue edit "$next" --repo "$REPO" --remove-label agent-queued
          gh issue comment "$next" --repo "$REPO" \
            --body "판이 비어 있어 대기 없이 바로 착수합니다." || echo "댓글 실패 — 계속 진행"
          # 라벨 부착이 claude-agent.yml의 agent job을 깨운다. 마지막에 붙인다.
          if ! add_label_with_retry "$next" agent; then
            echo "::error::#$next 에 agent 라벨을 붙이지 못했다 — agent-queued로 되돌린다"
            gh issue edit "$next" --repo "$REPO" --add-label agent-queued || true
            gh issue comment "$next" --repo "$REPO" \
              --body "⚠️ 즉시 착수 중 agent 라벨 부착에 실패해 agent-queued로 되돌렸습니다. 다음 판이 빌 때 다시 시도됩니다." || true
            exit 1
          fi

  agent:
    if: github.event.label.name == 'agent'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    # 암호화된 .env(repo에 커밋됨) 복호화 — 러너의 검증 커맨드 / dev DB 접근 (docs/adr/0009)
    env:
      DOTENV_PRIVATE_KEY: ${{ secrets.DOTENV_PRIVATE_KEY }}
    steps:
      # ── 자격증명: PAT가 아니라 GitHub App 설치 토큰 ──────────────────────────
      # App은 private key라 **만료가 없고**, 설치를 "All repositories"로 두면 새 저장소가
      # 자동으로 포함돼 저장소 목록을 갱신할 일이 없다. fine-grained PAT가 강제하던 1년
      # 교체와 저장소별 접근 목록 관리가 둘 다 사라진다.
      #
      # **자동 GITHUB_TOKEN과 달리 App 토큰으로 만든 이벤트는 다른 워크플로우를 트리거한다.**
      # 이 루프가 PAT를 쓰던 이유가 정확히 그거였고(라벨·머지·push가 다음 워크플로우를 깨워야
      # 한다), App은 그 성질을 그대로 갖는다.
      #
      # `app-id`(숫자)가 아니라 `client-id`를 쓴다. v3의 권장이기도 하지만, 실질적인 이유는
      # **App ID와 Installation ID가 둘 다 숫자라 구별이 안 된다**는 것이다. 설치 화면 URL의
      # 숫자를 App ID로 착각해 넣으면 JWT의 iss가 앱을 가리키지 않아
      # `A JSON web token could not be decoded`로 죽는다(2026-09-11 실제로 겪었다).
      # Client ID는 `Iv23…` 형태라 그 착각이 성립하지 않는다.
      #
      # App에 줘야 하는 권한: Contents / Pull requests / Issues / **Workflows** = write.
      # Workflows가 없으면 `.github/workflows/*` 커밋이 거부된다 — Claude GitHub App 설치
      # 토큰을 못 쓰고 PAT로 갔던 원래 이유가 이것이다(ADR 0007 "알려진 제약").
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.AGENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}

      # 이슈 이벤트의 기본 체크아웃은 default 브랜치라 작업 기준이 어긋날 수 있다 →
      # base-branch를 직접 체크아웃한다. 여기서 에이전트가 그 위에 작업 브랜치를 딴다.
      # token을 App 설치 토큰으로 지정 - 기본 GITHUB_TOKEN엔 Workflows 권한이 없어
      # 이 체크아웃 이후 커밋에서 .github/workflows/* 변경이 거부된다.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.base-branch }}
          token: ${{ steps.app-token.outputs.token }}

      # 검증 커맨드를 러너에서 바로 돌릴 수 있게 준비 (check.yml과 동일 구성).
      # setup-java는 install 스위치와 무관하게 독립적으로 켜진다 — JVM 전용 프로젝트
      # (Node 파이프라인이 아예 없는 저장소)도 검증을 돌릴 수 있어야 한다.
      - name: Setup JDK
        if: inputs.java-version != ''
        uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: ${{ inputs.java-distribution }}
          cache: gradle
      - uses: actions/setup-node@v4
        if: inputs.install != ''
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - if: inputs.install != ''
        run: ${{ inputs.install }}
      - if: inputs.install != '' && inputs.prepare != ''
        run: ${{ inputs.prepare }}

      # github_token엔 App 설치 토큰을 넘긴다 - secrets.GITHUB_TOKEN을 넘기면 그걸로 만든
      # 커밋에는 GitHub이 CI를 안 돌리므로(문서 명시) 그건 절대 쓰지 않는다. App 토큰은
      # 그 제약이 없고(이벤트가 워크플로우를 트리거한다), Workflows 권한이 있어
      # .github/workflows/*도 커밋 가능하다.
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app-token.outputs.token }}
          # 봇이 붙인 `agent` 라벨(리뷰의 후속 이슈 자동 착수 등)로 깨어나면 그 issues: labeled
          # 이벤트의 actor도 봇이라 "Workflow initiated by non-human actor"로 거부된다.
          # 배경은 README.md "알아둘 것" 참고.
          allowed_bots: "claude,superokok-agent-ops"
          # 2026-09-05: 이 job이 결정론적으로 즉사하는데(첫 턴에서 is_error, duration 384ms,
          # total_cost_usd 0, modelUsage {} — 모델 호출 자체가 안 됨) 로그가 가려져 원인이 안 보인다.
          # 액션이 안내하는 대로 전체 출력을 켠다. 같은 토큰을 쓰는 claude-review.yml은 정상
          # 동작하므로 토큰/구독 문제는 아니고, 실패는 #119·#120이 main에 올라간 직후부터 시작됐다.
          # 원인이 밝혀지면 이 옵션은 되돌린다(출력에 프롬프트·환경이 그대로 남는다).
          show_full_output: true
          prompt: |
            GitHub 이슈 #${{ github.event.issue.number }} 를 구현한다. 이슈 제목·본문이 요구사항이다.

            저장소 루트에 `CLAUDE.md`가 있으면 그 "작업 루프"를 그대로 따른다. 아래는 그 요약이자,
            `CLAUDE.md`가 없는 저장소에서의 기본값이다:

            0. **먼저 열린 PR을 확인한다. 있으면(예외 아래 참고) 착수하지 않는다.**
                 gh pr list --base ${{ inputs.base-branch }} --state open --json number,title,labels,author
               (릴리스 PR은 base가 `main`이라 이 목록에 안 잡힌다 — 세지 않는 게 맞다.)

               **예외: Dependabot(`author.login == "dependabot[bot]"`) PR은 기본적으로 세지 않는다.**
               Dependabot PR은 리뷰·자동머지가 안 돌게 막혀 있어(README "알아둘 것" 참고)
               사람이 처리할 때까지 계속 열려 있다 — 그대로 WIP 카운트에 넣으면 다음 달에도
               같은 24시간급 정지가 온다(#47 실측: 2026-09-13~14 devDepth, Dependabot PR
               4건 때문에 이슈 하나가 사람이 개입할 때까지 멈췄다). 다만 **완전히 무시하지도
               않는다** — 겹치는 코드가 하나도 없어도 같은 파일 끝에 동시에 append하면
               충돌한다는 게 원래 WIP=1의 근거였다(2026-09-09, PR #190·#191).
               그래서 세지 않는 대신 **파일 겹침만 본다**:
                 - Dependabot PR마다 `gh pr view <n> --json files`로 변경 파일을 본다.
                 - 그중 의존성 manifest/락파일(`package.json`, `package-lock.json`,
                   `yarn.lock`, `pnpm-lock.yaml`, `build.gradle`, `build.gradle.kts`,
                   `pom.xml`, `Gemfile.lock`, `go.sum`, `go.mod` 등)이 있고, 이번 이슈의
                   작업이 같은 파일을 건드릴 것으로 보이면 **그 PR은 예외 없이 카운트한다**
                   (즉 대기).
                 - 겹치는지 애매하면 안전한 쪽으로 대기한다.
               Dependabot이 아닌 PR은 지금까지처럼 예외 없이 전부 카운트한다.

               **하나라도 (위 기준으로) 남으면** 구현하지 말고 이렇게 끝낸다:
                 gh issue edit ${{ github.event.issue.number }} --remove-label agent
                 gh issue edit ${{ github.event.issue.number }} --add-label agent-queued
                 gh issue comment ${{ github.event.issue.number }} --body "<대기 사유 + 앞 PR 번호>"
               (`agent-queued` 라벨이 없으면 `gh label create agent-queued --color FBCA04
                --description "앞 PR 대기 중 — after-merge가 자동으로 깨운다" --force` 로 만든다.)

               왜(일반 PR): **동시에 열린 PR이 둘이면 충돌이 구조적으로 발생한다.** 겹치는
               코드가 하나도 없어도 난다 — 2026-09-09에 PR #190·#191이 서로 무관한 작업인데
               둘 다 변경 기록 파일 끝에 append해서 충돌했다. WIP를 1로 묶으면 그 부류가
               통째로 사라진다(텍스트 충돌·의미적 충돌·중복 작업).

               **사람을 부르는 게 아니다.** 앞 PR이 머지되거나(또는 겹치던 Dependabot PR이
               닫히면) `after-merge.yml`의 `drain-queue`가 가장 오래 기다린 `agent-queued`
               이슈를 자동으로 깨운다. 그러니 여기서는 조용히 대기시키고 끝내면 된다.

            1. `${{ inputs.base-branch }}`가 이미 체크아웃돼 있다. **여기서 네가 직접 작업 브랜치를 딴다**:
               `git switch -c <type>/<slug>` (예: `fix/eslint-errors`). 액션은 브랜치를 만들어 주지
               않는다 — 2026-09-05 실측에서 에이전트가 기준 브랜치 위에 그대로 앉아 커밋할 곳을
               못 찾고 턴을 소진했다. remote는 workflow 스코프 PAT로 인증돼 있어 push까지 된다.
               **`${{ inputs.base-branch }}`·`main`에는 절대 커밋·push하지 않는다.**
            2. 사전 계획 게이트 경로: `${{ inputs.plan-only-paths }}`
               — 이 값이 비어 있지 않고 거기 해당하는 변경이 필요하면, 코드를 고치지 말고
               이슈에 짧은 구현 계획만 코멘트로 남기고 종료한다. 그때 **`agent` 라벨을 직접 뗀다**:
                 gh issue edit ${{ github.event.issue.number }} --remove-label agent
               그리고 코멘트 끝에 재개 방법을 적는다 — **`@claude` 쪽을 먼저** 안내한다:
               "계획에 동의하시면 이 이슈에 `@claude 진행해줘`라고 코멘트해주세요
                (또는 `agent` 라벨을 다시 붙이셔도 됩니다)."
               사용자가 계획을 읽는 자리가 코멘트 스레드라, 거기서 답글 한 줄로 이어지는 게
               라벨을 찾아 붙이는 것보다 외울 게 적다. `claude.yml`(@claude 멘션 워크플로우)이
               이 경우를 알고 있어서, 승인 후엔 계획대로 구현하고 PR까지 연다.
               라벨을 달아둔 채로 끝나면, 이 워크플로우는 `issues: labeled`로 깨어나므로 이미 붙은
               라벨을 다시 붙일 수가 없어 **사용자가 승인해도 재개할 방법이 없다.**
               `agent` 라벨은 "처리 중/처리 대기" 상태를 뜻한다 — 손을 뗄 땐 라벨도 뗀다.
            3. 작게 구현한다. 검증 커맨드: `${{ inputs.verify }}`
               — 이 값이 비어 있지 않으면 그게 통과해야 한다. 비어 있으면 이 저장소엔 자동
               검증이 없다는 뜻이니, 대신 바꾼 파일이 형식적으로 유효한지 직접 확인한다
               (예: YAML이면 파싱, 스크립트면 문법 검사).
            4. 순수 함수(파서·변환·헬퍼)를 새로 만들거나 고치면 옆에 테스트도 같이 쓴다.
            5. 기록 파일: `${{ inputs.changelog-file }}`
               — 비어 있지 않고 기능/로직 변경이면 여기 먼저 기록하고 같은 브랜치에 포함한다.
            6. **작업이 눈에 띄게 진전되면 그때그때 커밋하고 `git push -u origin <branch>`로 일찍 올린다.**
               마지막에 몰아서 하지 않는다 — 턴 상한에 걸려도 브랜치가 남아 있어야 이어서 할 수 있다
               (실측: 22개 에러를 0으로 다 고쳐놓고 커밋 전에 잘려 전부 날아갔다).
               그 다음 `gh pr create --base ${{ inputs.base-branch }}` 로 PR을 연다. 본문에
               `Closes #${{ github.event.issue.number }}`, 목표·완료조건·검증 결과를 적는다.
            6-a. **이 이슈가 후속 이슈(`review-followup`)면 만든 PR에 `followup-pr` 라벨을 붙인다.**
               이번 실행의 값: `${{ contains(github.event.issue.labels.*.name, 'review-followup') }}`
               — `true`일 때만 아래를 실행하고, `false`면 건너뛴다.
                 gh label create followup-pr --color D4C5F9 --description "후속 이슈에서 나온 PR (리뷰 깊이 제한용)" --force
                 gh pr edit <n> --add-label followup-pr
               왜: `claude-review.yml`이 이 라벨을 보고 **새 후속 이슈를 만들지 않는다**.
               안 붙이면 후속 PR의 리뷰가 또 이슈를 만들고 그게 또 자동 착수돼 연쇄가 끝나지
               않는다. 이 라벨은 머지를 막지 않는다 — `do-not-merge`와 무관하다.
            7. **위험 구간을 건드렸으면** (${{ inputs.risk-areas }})
               → `gh pr edit <n> --add-label do-not-merge` 하고, PR에 "위험 구간 — diff 리뷰 후
               사람이 수동 머지" 코멘트를 단다. **위험 구간이 아니면** 라벨 없이 그대로 둔다
               (게이트가 초록이면 `enable-auto-merge.yml`이 자동 머지). 직접 `gh pr merge`는 부르지 않는다.
            8. 운영 반영(릴리스) PR은 절대 만들지 않는다. 그건 사람이 한다.

            네가 만지는 파일의 린트 에러는 0으로 유지한다.
          claude_args: >-
            --max-turns 150
            --model claude-sonnet-5
            --allowedTools "Edit,Write,Read,Bash,Glob,Grep"
