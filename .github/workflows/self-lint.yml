name: Lint

# 이 저장소 자신의 검증 게이트. 여긴 package.json이 없어서 `check.yml`을 쓸 수 없다 —
# 대신 actionlint로 워크플로우 YAML을 본다. self-agent가 쓰는 검증 커맨드와 같은 스크립트다.

# `push: [main]`은 걸지 않는다(2026-09-10 제거). main으로 가는 길이 PR 하나뿐이라 머지 직후의
# main 트리는 방금 PR에서 검사한 트리와 같다 — 같은 검사를 한 번 더 청구할 뿐이었다
# (실측: 18 job / 실제 1.9분 / 청구 18분).
on:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/lint-workflows.sh

      # 스켈레톤(`scripts/skeleton/`)은 `.github/workflows/` 밖이라 위 lint가 보지 않는다.
      # 그대로 두면 **새 프로젝트에만 깨진 호출부가 배달된다** — 이 저장소는 초록인 채로.
      # 렌더 + actionlint + 계약 검사를 스크립트 하나로 모아 둔다(에이전트도 같은 것을 돌린다).
      - name: 스켈레톤 계약 검사
        run: bash scripts/check-skeleton.sh

      # **사람 게이트를 기계 검사로 바꾼 그 검사**가 실제로 잡는지 본다. 이게 없으면
      # "경로를 건드리면 사람"을 "약해지면 사람"으로 바꾼 게 아니라 그냥 없앤 것이 된다.
      # 스크립트를 워크플로우 원문에서 떼어내 돌리므로 복사본이 낡을 일이 없다.
      - name: 게이트 약화 검사 회귀 테스트
        run: bash scripts/gate-check.test.sh
