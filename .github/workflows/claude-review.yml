name: Claude Review (reusable)

# 2차 AI 리뷰 게이트 (docs/adr/0008-agent-operating-model.md, docs/adr/0010-merge-gates.md).
# develop 대상 PR마다 code-review 스킬을 돌려 findings를 인라인 코멘트로 남기고,
# **고위험 finding이 있으면 do-not-merge 라벨을 붙여 자동 머지를 막는다.**
# 차단하지 않은 지적은 `review-followup` 이슈로 남긴다 — 안 그러면 PR이 머지되면서
# 닫힌 PR의 코멘트가 되어 아무도 안 읽는다(2026-09-05, PR #151에서 실제로 확인).
#
# 2026-09-05 이전에는 순수 자문(코멘트만)이었는데, 실측(PR #133)에서 `check`가 58초에
# 끝나 8초 뒤 머지되고 리뷰는 그로부터 8분 뒤에 끝났다 — 리뷰가 머지된 PR에 코멘트를
# 다는 셈이라 게이트로 전혀 기능하지 않았다. 그래서 두 가지를 함께 고쳤다:
#   (1) 여기서 고위험 findings에 do-not-merge 라벨을 붙인다(차단 수단)
#   (2) 당시엔 auto-merge.yml이 이 `review` job의 완료를 기다렸다(순서 보장)
# (2)는 `enable-auto-merge.yml`로 옮기며 사라졌다 — 네이티브 auto-merge는 같은
# `pull_request` 이벤트로 이 job과 나란히 돈다. 그래서 (1)의 `--disable-auto`가
# 유일한 차단 수단이다: 순서를 보장하지 않고, 늦게 붙는 라벨이 이미 켜진 auto-merge를
# 도로 끄는 방식으로 막는다.
#
# 2026-09-07: 후속 이슈에 `agent` 라벨을 같이 붙여 **사람 없이 착수**되게 했다. 그 전에는
# 사람이 라벨을 붙여야 시작돼서, ADR 0007이 "운영 반영만 사람"이라고 정한 것과 어긋난
# 게이트가 하나 더 있는 셈이었다(실제로 #168·#171이 며칠 방치됨). 연쇄를 막던 게 그
# 사람 손이었으므로, 대신 아래 "깊이 제한"으로 막는다 — 후속 PR(`followup-pr` 라벨)의
# 리뷰는 새 이슈를 만들지 않는다. 따라서 계보 하나당 이슈는 최대 1개다.
#
# 2026-09-14(#55): `notify-handle` 담당자 지정을 여기로 옮겼다. 예전엔
# `enable-auto-merge.yml`이 위험 경로를 감지한 그 순간(리뷰가 아직 도는 중)에 담당자를
# 붙여서, 알림이 "버튼이 활성화되기 전"에 도착했다(실측: PR 열림 직후 담당자 지정 →
# `review`는 2분 29초를 더 돎). `do-not-merge` 라벨은 상태("사람이 머지한다")이고
# 담당자 지정은 실행 가능 시점("지금 눌러도 된다")이어야 한다 — 이 job이 이 저장소에서
# 보통 가장 긴 체크라 마지막 스텝 시점엔 나머지가 대개 이미 초록이고, 이미 과금되는
# job이라 추가 job 비용이 0이다. `mergeStateStatus`가 아직 `CLEAN`이 아니면 같은 스텝
# 안에서 짧게 재확인한다(비동기 계산 — GitHub이 아직 판정 중일 수 있다).
# CI가 리뷰보다 늦게 끝나는 PR을 위해 `notify-ready` job을 폴백으로 둔다(아래).
#
# 2026-09-14(#60): #55가 "CLEAN이면 담당자"만 만들고 "실패하면 담당자"를 없앴다 —
# 체크가 실패한 PR은 영원히 CLEAN이 되지 않으므로 담당자도 알림도 영영 안 왔다
# (실측: 이 저장소 PR #59에서 `review / review`가 startup_failure로 죽었는데도
# 아무도 불려오지 않았다). 그래서 판정을 세 갈래로 나눈다:
#   - CLEAN(초록 + 머지 가능)                              → 담당자 지정 (#55 그대로)
#   - 필수 체크가 failure/cancelled/startup_failure/
#     timed_out/action_required로 끝남                     → 담당자 지정 + 원인 코멘트
#   - 아직 pending/in_progress                              → 아무것도 하지 않는다 (#55 그대로)
# `mergeStateStatus`만으로는 "미완"과 "실패"를 구분할 수 없다(둘 다 `BLOCKED`) — 그래서
# `commits/{sha}/check-runs`의 결론을 **PR에 보고된 체크 목록**(`statusCheckRollup`)과
# 교차해서 판정한다.
#
# 브랜치 보호(`branches/{branch}/protection/required_status_checks`)를 쓰지 않는다:
# 그 조회는 GitHub App **Administration(read)** 권한을 요구하는데 에이전트 App엔 없어서
# 404가 돌아온다. 2026-09-14 PR #63에서 이 호출이 스텝의 첫 실패였고, `bash -e` 때문에
# 스텝이 출력 없이 죽어 `review / review`가 빨간불이 되며 **멀쩡한 PR이 머지 불가로
# 굳었다.** `statusCheckRollup`은 추가 권한이 필요 없다 — 대신 "필수"와 "자문용"을
# 구분하지 않으므로, 비필수 체크를 추가하게 되면 이 가정을 다시 검토한다. `claude-fix.yml`이 붙어 있는
# 저장소라면 자동 수정이 먼저 시도되게 양보한다 — `<!-- claude-fix:attempt -->` 마커가
# 있고 아직 `<!-- claude-fix:gave-up -->`이 없으면(= 아직 재시도 중) 판정을 건너뛴다.
# 중복 알림 방지는 SHA별 마커(`<!-- gate:checks-red:$SHA -->`)로 한다 — 같은 커밋에는
# 한 번만, 새 커밋이 오면 다시 판정한다.

on:
  workflow_call:
    inputs:
      base-branch:
        description: 이 base를 향한 PR만 리뷰한다. 통합 브랜치가 없으면 "main"
        type: string
        default: "develop"
      review-level:
        description: |
          `/code-review`의 effort level (low / medium / high / max).
          **반드시 명시한다** — 안 넘기면 그 스킬이 "직전에 쓴 레벨을 재사용"하는데, CI는 매번
          새 세션이라 무엇이 쓰일지 예측할 수 없다. 게이트가 비결정적이면 게이트가 아니다.
          코드 저장소는 `medium`, YAML만 있는 워크플로우 저장소는 `low`가 적정선이다.
        type: string
        default: "medium"
      skip-paths-regex:
        description: |
          변경 파일이 **전부** 이 정규식에 걸리면 리뷰를 건너뛴다(job은 돌고 step만 스킵 →
          check-run은 `success`로 생성되므로 필수 체크와 호환된다. 워크플로우 수준 `paths:`
          필터를 쓰면 check-run이 아예 안 생겨 **영구 Pending**이 되므로 절대 쓰지 않는다).
          기본값은 **마크다운만**이다. `^docs/`로 잡지 않는 이유: `docs/deploy/setup-ec2.sh`처럼
          문서 디렉터리 밑에도 실행되는 스크립트가 있다. 확장자로 좁히면 그런 게 안 새어나간다.
        type: string
        default: '\.md$'
      notify-handle:
        description: |
          `do-not-merge`가 붙어 사람 머지가 필요한 PR이 초록(mergeStateStatus == CLEAN)이
          되거나, 필수 체크가 실패로 끝나서 자동으로는 영영 초록이 되지 않을 때 담당자로
          지정할 GitHub 핸들(예: "octocat"). 빈 문자열(기본값)이면 지정하지 않는다 —
          기존 호출부는 무변화. (이슈 #46·#55·#60)

          담당자 지정(assignee)이 주 수단이다: watch 설정으로 끌 수 없는 유일한 알림
          경로라서다. 리뷰어 지정도 함께 요청한다 — 실패해도 무시한다.

          `enable-auto-merge.yml`에도 같은 이름의 입력이 있지만 거기서는 더 이상 담당자를
          "붙이지" 않는다(#55) — 여기서 초록이거나 빨간불일 때 붙인다. 두 호출부에 같은
          값을 넘긴다.
        type: string
        default: ""

# 같은 PR에 새 커밋이 오면 앞선 리뷰를 취소한다(공식 권장형). 낡은 커밋을 대상으로 한
# 리뷰는 끝나봐야 쓸모가 없고, 이 워크플로우는 run당 4분대로 가장 비싼 축이다
# (2026-09-07 실측: 월 78 run / 321분).
concurrency:
  group: claude-review-${{ github.repository }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  review:
    # 통합 브랜치 대상 PR만 (릴리스 PR은 사람이 직접 보므로 제외)
    #
    # **Dependabot PR은 제외한다 — 안 그러면 그 PR이 영원히 머지 불가가 된다.**
    # Dependabot이 트리거한 실행에는 저장소 시크릿이 전달되지 않는다(GitHub이 Dependabot
    # secrets를 별도 저장소에 둔다). 그래서 `create-github-app-token`부터 실패하고,
    # `review / review`가 **필수 체크**인 저장소에서는 그 PR이 BLOCKED로 굳는다.
    # 그러면 `base=<통합 브랜치>` 열린 PR이 사라지지 않아 **WIP 제한 1이 영구히 걸리고
    # claude-agent가 통째로 멈춘다** — 2026-09-13 devDepth에서 실제로 그렇게 됐다
    # (Dependabot PR 4건이 동시에 막히면서 `agent-queued` 이슈가 깨어날 수 없게 됐다).
    #
    # job 수준 `if:`로 거르면 check-run이 `skipped`로 **생성되고**, 필수 체크는 그걸
    # success로 취급한다. 워크플로우 수준 필터와 다르다 — 그건 check-run 자체가 안 생겨
    # 영구 Pending이 된다.
    #
    # 리뷰를 잃는 대가는 받아들일 만하다: 의존성 PR은 거의 전부 위험 경로(공급망)라
    # 어차피 사람이 diff를 보고 머지한다. 대안은 Dependabot secrets에 같은 값을 복제하는
    # 것인데, **에이전트 App 토큰(write)을 Dependabot 컨텍스트까지 넓히는** 일이라
    # 이 저장소가 토큰 범위에 대해 내려온 다른 결정들과 어긋난다.
    if: >-
      github.event.pull_request.base.ref == inputs.base-branch &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    # 폭주 상한. `--max-turns`가 아니라 job 타임아웃으로 잡는다 — max-turns는 도중에
    # **성공으로** 끝나서, 2번(고위험 차단)에 닿기 전에 잘리면 위험한 PR이 그대로 머지된다.
    # 타임아웃은 job을 실패시키므로 `review` 체크가 빨개져 머지가 막힌다(fail-closed).
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write   # 인라인 코멘트 + do-not-merge 라벨/코멘트
      issues: write          # 라벨은 issues API를 탄다
      id-token: write
    steps:
      # ── 자격증명: PAT가 아니라 GitHub App 설치 토큰 ──────────────────────────
      # App은 private key라 **만료가 없고**, 설치를 "All repositories"로 두면 새 저장소가
      # 자동으로 포함돼 저장소 목록을 갱신할 일이 없다. fine-grained PAT가 강제하던 1년
      # 교체와 저장소별 접근 목록 관리가 둘 다 사라진다.
      #
      # **자동 GITHUB_TOKEN과 달리 App 토큰으로 만든 이벤트는 다른 워크플로우를 트리거한다.**
      # 이 루프가 PAT를 쓰던 이유가 정확히 그거였고(라벨·머지·push가 다음 워크플로우를 깨워야
      # 한다), App은 그 성질을 그대로 갖는다.
      #
      # `app-id`(숫자)가 아니라 `client-id`를 쓴다. v3의 권장이기도 하지만, 실질적인 이유는
      # **App ID와 Installation ID가 둘 다 숫자라 구별이 안 된다**는 것이다. 설치 화면 URL의
      # 숫자를 App ID로 착각해 넣으면 JWT의 iss가 앱을 가리키지 않아
      # `A JSON web token could not be decoded`로 죽는다(2026-09-11 실제로 겪었다).
      # Client ID는 `Iv23…` 형태라 그 착각이 성립하지 않는다.
      #
      # App에 줘야 하는 권한: Contents / Pull requests / Issues / **Workflows** = write.
      # Workflows가 없으면 `.github/workflows/*` 커밋이 거부된다 — Claude GitHub App 설치
      # 토큰을 못 쓰고 PAT로 갔던 원래 이유가 이것이다(ADR 0007 "알려진 제약").
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.AGENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 변경 파일이 전부 skip-paths-regex에 걸리면 리뷰를 건너뛴다.
      # 판정을 여기서 하는 이유: 이 파일은 **다른 저장소에서 호출되는** 재사용 워크플로우라
      # `uses: ./.github/actions/...`(로컬 composite action)이 호출부 저장소를 가리켜 깨진다.
      # 그래서 공유 액션으로 빼지 않고 각 워크플로우에 인라인으로 둔다.
      - name: 리뷰 대상인지 판정
        id: scope
        env:
          # job 레벨이 아니라 스텝마다 준다 — job 레벨 env는 step 출력(app-token)을
          # 참조할 수 없다. GITHUB_TOKEN을 쓰면 안 되는 이유는 그대로다: 그 토큰으로
          # `agent` 라벨을 붙이면 claude-agent.yml이 깨어나지 않아 후속 이슈가 방치된다.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SKIP_RE: ${{ inputs.skip-paths-regex }}
        run: |
          set -uo pipefail
          files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename' || true)

          # 파일 목록을 못 받으면 **리뷰한다** — 판정 실패로 게이트가 조용히 사라지면 안 된다
          if [ -z "$files" ]; then
            echo "::warning title=변경 파일 조회 실패::리뷰를 그대로 진행합니다."
            echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # `grep -q`를 쓰지 않는다 — 일치하는 순간 파이프를 닫아 printf가 SIGPIPE로 죽고,
          # `pipefail` 때문에 파이프라인이 141로 끝나 판정이 뒤집힌다(preview-smoke.yml이
          # 같은 함정을 `head`에서 겪었다). 전부 읽는 `grep -v`로 목록을 받아 비었는지만 본다.
          non_md=$(printf '%s\n' "$files" | grep -vE "$SKIP_RE" || true)

          if [ -n "$non_md" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            printf '문서 전용 PR — 리뷰를 건너뜁니다:\n%s\n' "$files" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - uses: anthropics/claude-code-action@v1
        if: steps.scope.outputs.skip != 'true'
        # 액션 안에서 도는 Bash의 `gh` 호출이 이 토큰을 쓴다. 예전엔 job 레벨 env로
        # 전체 스텝에 깔려 있었는데, app-token이 step 출력이라 스텝 단위로 내렸다.
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 에이전트(claude-agent.yml)가 만든 PR은 봇(app/claude)이 작성자라, 이게 없으면
          # "Workflow initiated by non-human actor" 로 거부된다. 리뷰 대상이 바로 그 PR들이므로 허용.
          allowed_bots: "claude,superokok-agent-ops"
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: |
            1. `/code-review:code-review ${{ inputs.review-level }} --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}` 를 실행해
               findings를 인라인 코멘트로 남긴다. 레벨을 **반드시 넘긴다** — 생략하면 그 스킬이
               "직전에 쓴 레벨 재사용"으로 동작하는데 CI는 매번 새 세션이라 비결정적이 된다.

            2. 그 findings 중 **고위험**이 하나라도 있으면 자동 머지를 막는다.
               고위험 = verdict가 CONFIRMED이고 다음 중 하나:
                 - 정확성 버그(잘못된 결과·크래시·회귀)
                 - 인증/인가 우회, 시크릿 노출
                 - 데이터 손실·손상 (삭제·덮어쓰기·마이그레이션)
               단순화·중복 제거·성능 개선·스타일·테스트 부족 같은 품질 지적은 고위험이 아니다.

               고위험이 있으면:
                 gh pr edit ${{ github.event.pull_request.number }} --add-label do-not-merge
                 gh pr merge ${{ github.event.pull_request.number }} --disable-auto || true
                 gh pr comment ${{ github.event.pull_request.number }} --body "<요약>"
               `--disable-auto`가 없으면 `enable-auto-merge.yml`이 이미 켜둔 네이티브
               auto-merge가 라벨과 무관하게 그대로 진행돼, 남은 체크가 뒤늦게 초록이 되는
               순간 사람 확인 없이 머지된다(PR #191 실측: 라벨 부착 74초 뒤 merge). 이미
               꺼져 있거나 auto-merge가 아예 꺼진 상태면 이 명령은 실패하는데 무해하므로
               `|| true`로 무시한다.
               코멘트엔 막은 이유를 finding별 1줄씩(파일:줄 — 무엇이 왜 위험한지) 적고,
               맨 끝에 "고쳐서 push하면 라벨을 떼고 다시 자동 머지됩니다"를 덧붙인다.

               고위험이 없으면 **아무 라벨도 붙이지 않고 그대로 끝낸다** (`enable-auto-merge.yml`이 머지).

               **이 단계(차단)엔 깊이 제한이 없다.** 후속 PR이든 아니든 고위험이면 막는다.

            3. 라벨을 붙일지 말지 애매하면 붙이지 않는다 — staging(develop) 단계이고 되돌릴 수
               있다. 대신 그 판단 근거를 인라인 코멘트로 남긴다.

            4. **차단하지 않은 finding 중 "나중에 고칠 값어치가 있는 것"이 하나라도 있으면**
               아래 4-a / 4-b 중 하나를 한다. 어느 쪽이든 **PR당 하나**만 만든다
               (finding마다 만들지 않는다).

               왜 남기나: 고위험이 아니면 PR이 그대로 머지되는데, 그러면 인라인 코멘트는 닫힌
               PR에 남아 아무도 안 읽는다. 실제로 PR #151에서 성능·SSR 경고 2건이 여기
               해당했고 고위험 2건 덕에 우연히 같이 고쳐졌을 뿐이다.

               대상: 정확성에 영향이 없더라도 고칠 값어치가 있는 것(성능, 불필요한 재계산,
               SSR 경고, 죽은 코드, 빠진 테스트 등). **단순 스타일·취향 지적은 제외** —
               이슈가 노이즈가 되면 아무도 안 본다. 남길 게 없으면 아무것도 만들지 않는다.

               먼저 이 PR이 **후속 PR인지** 확인한다:
                 gh pr view ${{ github.event.pull_request.number }} --json labels --jq '.labels[].name'
               출력에 `followup-pr`이 있으면 후속 PR이다.

            4-a. **후속 PR이 아닐 때(일반 PR) — 후속 이슈를 만들고 착수 라벨을 붙인다.**

               먼저 **판이 비었는지** 본다. 리뷰는 PR이 열려 있는 동안 도므로 대개 안 비어 있다:

                 open=$(gh pr list --base ${{ inputs.base-branch }} --state open --json number --jq 'length')

               `open`이 0이 아니면 `agent-queued`를, 0이면 `agent`를 붙인다:

                 gh label create review-followup --color BFD4F2 --description "자동 리뷰가 남긴 후속 정리 거리" --force
                 gh label create agent-queued    --color FEF2C0 --description "앞 PR을 기다리는 대기 큐" --force
                 gh issue create --title "후속: PR #<번호> 리뷰 지적" --label review-followup --label <agent 또는 agent-queued> --body "<본문>"

               본문에는 finding별로 `파일:줄 — 무엇이 왜 문제인지 / 어떻게 고치면 되는지`를
               한 줄씩, 그리고 원 PR 링크를 적는다.

               **왜 나눠 붙이나**(감사 L43c): 무조건 `agent`를 붙이면 `claude-agent.yml`이
               깨어나서 — 그것만으로 job 하나가 청구된다 — WIP 제한 1에 걸린 걸 확인하고
               스스로 `agent-queued`로 되돌린다. 결과는 같은데 **에이전트 run 하나가 통째로
               낭비된다.** 처음부터 큐에 넣으면 그 왕복이 사라지고, 원 PR이 닫히는 순간
               `after-merge`의 `drain-queue`가 알아서 깨운다. 어느 쪽이든 **사람 개입은 0**이다.

               `agent`로 착수된 뒤에도 사람은 개입하지 않는다 — 그 PR도 이 리뷰 게이트를
               그대로 통과해야 하고, 위험 경로면 `enable-auto-merge.yml`이 따로 사람을 부른다.

            4-b. **후속 PR일 때(`followup-pr` 라벨) — 새 이슈를 만들지 않는다. 깊이 제한.**

               후속 PR의 리뷰가 또 이슈를 만들고 그게 또 착수되면 연쇄가 끝나지 않는다.
               계보 하나당 이슈는 최대 1개로 고정한다.

               대신 **원래 이슈에 코멘트로 덧붙인다**. 원래 이슈 번호는 이 PR 본문의
               `Closes #N`에서 읽는다:
                 gh pr view ${{ github.event.pull_request.number }} --json body --jq '.body'
               닫혀 있으면 `gh issue reopen <N>` 후 코멘트한다. 그리고 **이미 붙어 있는 `agent`
               라벨이 있으면 뗀다** (`gh issue edit <N> --remove-label agent`). 안 떼면 사용자가
               이 지적을 보고 "해라"고 하고 싶어도 라벨이 그대로라 `issues: labeled` 이벤트가
               안 나고 재개시킬 방법이 없다. 코멘트 끝에 재개 방법을 적는다 — **`@claude` 쪽을
               먼저** 안내한다: "이걸 처리하려면 `@claude 해줘`라고 코멘트해주세요
               (또는 `agent` 라벨을 붙이셔도 됩니다)." 라벨을 자동으로 다시 붙이지는 **않는다**
               — 여기서 자동 착수를 한 번 끊어야 깊이 제한이 성립한다. 사람이 보고 판단한다.
                 gh issue comment <N> --body "<본문 — 후속 PR #<번호>의 리뷰에서 추가로 나온 지적>"

               원래 이슈 번호를 못 찾으면(본문에 `Closes #N`이 없음) 이슈를 만들지 말고
               PR에 코멘트만 남긴다.
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr edit:*),Bash(gh pr merge:*),Bash(gh pr comment:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh issue create:*),Bash(gh issue comment:*),Bash(gh issue reopen:*),Bash(gh issue edit:*),Bash(gh issue view:*),Bash(gh label create:*)"

      # ── 체크 결과에 따라 담당자 지정 (#55·#60) ──────────────────────────────
      # 세 갈래 판정(CLEAN / 필수 체크 실패 / 아직 진행 중)은 파일 상단 "2026-09-14(#60)"
      # 주석 참고. CLEAN 갈래는 `do-not-merge`가 붙어 있는 PR만 대상이다 — 그게
      # "사람이 머지한다"는 상태 표시라서다. 빨간불 갈래는 `do-not-merge` 여부와
      # 무관하게 대상이다 — 체크가 실패하면 애초에 auto-merge가 되지 않으므로 항상
      # 사람이 판단해야 한다(없으면 이 스텝이 직접 `do-not-merge`를 붙인다).
      #
      # 이 스텝은 **절대로 job을 실패시키면 안 된다** — `review`는 필수 체크라, 여기서
      # 실패하면 순수 알림 기능 하나 때문에 멀쩡한 PR의 머지가 막힌다.
      #
      # **`set -e`를 "쓰지 않는" 것으로는 부족하다.** GitHub은 `run:`의 기본 셸을
      # `bash -e {0}`로 호출하므로 errexit이 **이미 켜진 채로** 시작한다 — `set +e`로
      # 명시적으로 꺼야 한다. 2026-09-14 PR #63에서 이걸 놓쳐, 첫 파이프라인이 실패하자
      # 출력 한 줄 없이 exit 1이 나고 `review / review`가 빨간불이 되어 **멀쩡한 PR이
      # 머지 불가로 굳었다** — 알림 기능이 게이트를 망가뜨렸다.
      # `-u`도 걸지 않는다: unbound 변수는 errexit과 무관하게 셸을 죽여 fail-open과 어긋난다.
      - name: 체크 결과에 따라 담당자 지정
        if: inputs.notify-handle != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          NOTIFY_HANDLE: ${{ inputs.notify-handle }}
        run: |
          set +e
          set -o pipefail

          # 판정 대상 체크 목록. **브랜치 보호 API를 쓰지 않는다** —
          # `repos/{r}/branches/{b}/protection/...`는 admin 권한을 요구하는데 에이전트 App
          # 토큰엔 그게 없어 404가 돌아온다(2026-09-14 PR #63에서 이 호출이 첫 실패였다).
          # 대신 PR에 **보고된 체크 전체**를 본다 — 권한이 필요 없고, 이 저장소들에는
          # 자문용 체크가 없어서 "실패한 체크가 있으면 사람이 봐야 한다"가 그대로 성립한다.
          # 비필수 체크를 추가하게 되면 이 가정을 다시 검토한다.
          required=$(gh pr view "$PR" --repo "$REPO" --json statusCheckRollup \
                       --jq '.statusCheckRollup[]? | (.name // .context) // empty' 2>/dev/null \
                       | sort -u)

          # 아직 결론이 안 난 체크가 이만큼 오래 멈춰 있으면 "영영 안 끝난다"로 보고 기다리지 않는다.
          # 이 탈출구가 없으면 영구 Pending 체크 하나가 빨간불 알림을 영원히 묻는다(호출부가 겪은
          # 실제 사례: `deployment_status` 트리거를 놓친 smoke가 Pending으로 굳는 경우).
          STALE_PENDING_MIN=30

          # 이름별 최신 check-run 결론 중 필수 체크가 실패류로 끝난 게 있는지 본다.
          # 재시도로 같은 이름의 check-run이 여러 개 있을 수 있어 started_at 기준 최신만 본다.
          #
          # **하나가 깨졌다고 바로 부르지 않는다 — 나머지가 다 끝난 뒤에 부른다(#66).**
          # 예전엔 실패한 체크를 발견하는 즉시 담당자를 붙였는데, 체크는 동시에 돌고 길이가
          # 제각각이라(실측 kitchen-tempo: check 1분 22초 / smoke 2분 14초 / review 4분 19초)
          # 짧은 게 먼저 깨지면 **나머지가 도는 중에 메일이 갔다**. 사람이 열어보면 체크가
          # 아직 돌고 있어 뭘 판단하라는 건지 알 수 없고, 더 나쁘게는 뒤늦게 다른 체크가 더
          # 깨져도 SHA 마커(`gate:checks-red:$SHA`)가 이미 찍혀 **두 번째 알림이 안 나가**
          # 실패 목록이 반쪽짜리로 남았다. 이건 #55가 초록 쪽에서 고친 문제("머지 버튼이
          # 아직 비활성인 시점에 알림 도착")와 같은 병이고, 빨간 쪽만 안 고쳐져 있었다.
          detect_red() {
            [ -z "$required" ] && return 1
            runs=$(gh api "repos/$REPO/commits/$SHA/check-runs" --paginate 2>/dev/null \
                     | jq -s '[.[].check_runs[]]' 2>/dev/null \
                     | jq -r 'sort_by(.started_at) | reverse | group_by(.name) | .[] | .[0] |
                              "\(.name)\t\(.conclusion // "")\t\(.started_at // "")"' 2>/dev/null)
            [ -z "$runs" ] && return 1

            local now_ts; now_ts=$(date -u +%s)
            detail=""; pending=""
            while IFS=$'\t' read -r name conclusion started; do
              [ -z "$name" ] && continue
              printf '%s\n' "$required" | grep -qxF "$name" || continue
              case "$conclusion" in
                failure|cancelled|startup_failure|timed_out|action_required)
                  detail="${detail}- \`$name\`: $conclusion"$'\n' ;;
                "")
                  # 결론이 비어 있으면 queued/in_progress. 시작 시각을 못 읽으면 기다리지 않는다
                  # — 알림이 늦는 것보다 조용히 사라지는 쪽이 나쁘다(이 워크플로우의 fail-open 방침).
                  local started_ts; started_ts=$(date -u -d "$started" +%s 2>/dev/null)
                  if [ -n "$started_ts" ] && [ "$(( (now_ts - started_ts) / 60 ))" -lt "$STALE_PENDING_MIN" ]; then
                    pending="${pending}${name}, "
                  fi
                  ;;
              esac
            done <<< "$runs"

            if [ -n "$pending" ]; then
              echo "아직 도는 체크가 있어 빨간불 판정을 미룬다: ${pending%, }"
              return 1
            fi

            [ -z "$detail" ] && return 1
            RED_DETAIL="$detail"
          }

          # 담당자·리뷰어 지정. **실패해도 job을 세우지 않지만 흔적은 반드시 남긴다**(#51).
          # 담당자 지정은 watch 설정으로 끌 수 없는 유일한 알림 경로라서 고른 수단인데, 예전엔
          # `2>/dev/null || true`가 에러 메시지까지 버려서 잘못된 핸들·권한 부족으로 지정이 실패해도
          # 로그에 아무 흔적이 없었다 — #46이 고치려던 "알림이 사람에게 안 닿음"이 같은 증상으로
          # 조용히 재발한다. 실패를 job 실패로 만들지는 않는다: 권한 없는 핸들처럼 정상적인 실패
          # 경로가 있고, 여기서 죽으면 뒤따르는 빨간불 코멘트(남은 유일한 알림)까지 함께 사라진다.
          assign_notify() {
            local pr="$1" err=""
            if ! err=$(gh pr edit "$pr" --repo "$REPO" --add-assignee "$NOTIFY_HANDLE" 2>&1); then
              echo "::warning title=담당자 지정 실패::PR #${pr}에 @${NOTIFY_HANDLE} 담당자 지정 실패 — 이 PR의 알림이 사람에게 닿지 않았을 수 있다: ${err}"
              if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
                printf '⚠️ PR #%s 담당자 지정 실패(`@%s`): %s\n' "$pr" "$NOTIFY_HANDLE" "$err" >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
            # 리뷰어는 보조 수단이다. PR 작성자 본인은 리뷰어가 될 수 없어 **정상적으로도** 실패하므로
            # warning으로 올리지 않는다 — 매 실행 경고가 뜨면 진짜 경고가 그 속에 묻힌다.
            if ! err=$(gh pr edit "$pr" --repo "$REPO" --add-reviewer "$NOTIFY_HANDLE" 2>&1); then
              echo "::notice title=리뷰어 지정 건너뜀::PR #${pr} 리뷰어 지정 실패(보조 경로): ${err}"
            fi
          }

          # claude-fix.yml이 아직 재시도 중이면 양보한다 — 자동 복구가 사람 호출보다 먼저다.
          comments=$(gh pr view "$PR" --repo "$REPO" --json comments --jq '.comments[].body' 2>/dev/null)
          fix_busy=false
          if printf '%s\n' "$comments" | grep -qF '<!-- claude-fix:attempt -->' \
             && ! printf '%s\n' "$comments" | grep -qF '<!-- claude-fix:gave-up -->'; then
            fix_busy=true
          fi

          # mergeStateStatus는 비동기라 방금 끝난 체크가 아직 반영 안 됐을 수 있다(UNKNOWN).
          # RETRY_COUNT회 시도하며 그 사이 RETRY_INTERVAL_SEC초씩 대기한다(마지막 시도
          # 뒤에는 대기하지 않으므로 실제 총 대기 시간은 (RETRY_COUNT-1)*RETRY_INTERVAL_SEC).
          # 숫자를 주석에 직접 적으면 값을 바꿀 때 주석과 실제 동작이 따로 논다 — #61이
          # 바로 그 사례였다(주석은 "90초"인데 반복 6회·간격 15초라 실제로는 75초만 돎).
          # 이 job은 리뷰로 이미 과금됐으므로 여기서 기다리는 건 추가 비용이 없다.
          RETRY_COUNT=7
          RETRY_INTERVAL_SEC=15
          for i in $(seq 1 "$RETRY_COUNT"); do
            info=$(gh pr view "$PR" --repo "$REPO" --json mergeable,mergeStateStatus,labels,assignees 2>/dev/null)
            mergeable=$(printf '%s' "$info" | jq -r '.mergeable // ""' 2>/dev/null)
            status=$(printf '%s' "$info" | jq -r '.mergeStateStatus // ""' 2>/dev/null)
            has_dnm=$(printf '%s' "$info" | jq -r '[.labels[].name] | any(. == "do-not-merge")' 2>/dev/null)
            already_assigned=$(printf '%s' "$info" | jq -r --arg h "$NOTIFY_HANDLE" '[.assignees[].login] | any(. == $h)' 2>/dev/null)

            if [ "$mergeable" = "MERGEABLE" ] && [ "$status" = "CLEAN" ]; then
              if [ "$has_dnm" != "true" ]; then
                echo "do-not-merge 아님 — auto-merge 대상이라 담당자 알림이 필요 없다"; exit 0
              fi
              if [ "$already_assigned" = "true" ]; then
                echo "이미 담당자 — 중복 알림 방지, 스킵"; exit 0
              fi
              assign_notify "$PR"
              echo "담당자 지정함 (mergeable=$mergeable, status=$status)"
              exit 0
            fi

            if [ "$fix_busy" = "false" ]; then
              RED_DETAIL=""
              if detect_red; then
                marker="<!-- gate:checks-red:$SHA -->"
                if printf '%s\n' "$comments" | grep -qF "$marker"; then
                  echo "이 커밋($SHA)은 이미 빨간불 알림을 보냈다 — 스킵"; exit 0
                fi

                gh pr edit "$PR" --repo "$REPO" --add-label do-not-merge 2>/dev/null || true
                assign_notify "$PR"
                {
                  printf '@%s\n\n' "$NOTIFY_HANDLE"
                  printf '%s\n\n' '🔴 **필수 체크 실패** `[AGENT-ACTION-REQUIRED]` — 자동으로는 초록이 되지 않습니다. 고칠지 닫을지 판단해주세요.'
                  printf '%s\n' "$RED_DETAIL"
                  printf '%s\n' "$marker"
                } | gh pr comment "$PR" --repo "$REPO" --body-file -
                echo "빨간불 담당자 지정함 (sha=$SHA)"
                exit 0
              fi
            fi

            echo "아직 판정 불가 (mergeable=$mergeable, status=$status, 시도 $i/$RETRY_COUNT)"
            [ "$i" -lt "$RETRY_COUNT" ] && sleep "$RETRY_INTERVAL_SEC"
          done

          TOTAL_WAIT_SEC=$(( (RETRY_COUNT - 1) * RETRY_INTERVAL_SEC ))
          echo "${TOTAL_WAIT_SEC}초 내 CLEAN도 빨간불도 확정되지 않음 — notify-ready(폴백)가 다시 판정한다"
          exit 0

  # ── 폴백: CI가 리뷰보다 늦게 끝나거나 review 자신이 죽은 PR을 위한 판정 job (#55·#60) ──
  # 위 `review` job의 마지막 스텝은 리뷰가 끝나는 시점에 한 번만 판정한다.
  # CI(또는 다른 필수 체크)가 리뷰보다 늦게 끝나면 그 스텝은 CLEAN을 못 보고 지나가고,
  # **`review` job 자신이 startup_failure 등으로 죽으면 그 스텝 자체가 실행되지 않는다**
  # (job이 시작도 못 했으니 스텝이 돌 수가 없다 — 2026-09-14 PR #59가 정확히 이 경우였다).
  # 폴백이 없으면 두 경우 다 담당자가 영영 붙지 않는다. 이 job은 `workflow_run`으로
  # 깨어나 같은 세 갈래 판정(CLEAN / 필수 체크 실패 / 진행 중)을 한 번 더 한다 — 흔한
  # 경우엔(위 job이 이미 처리했음) 초반 체크에서 바로 종료하므로 멱등하고 비용도 거의 0이다.
  #
  # 호출부가 이 폴백을 쓰려면 `on:`에 `workflow_run: {workflows: [...], types:
  # [completed]}`를 추가해야 한다(README "호출부" 참고). **`review` job 자신의 죽음까지
  # 잡으려면 그 목록에 이 워크플로우 자신의 `name`(예: "Claude Review")도 넣어야 한다** —
  # 안 넣으면 CI 실패는 잡아도 리뷰 자신의 startup_failure는 아무도 감지하지 못한다.
  # 그 파일은 **default 브랜치에 있는 버전이 돈다** — 새로 추가한 직후에는 release 전까지
  # 효력이 없다.
  #
  # **이 job에는 `github.actor != 'dependabot[bot]'`를 걸지 않는다.** `review` job의 그 필터는
  # 기술적 제약이다 — Dependabot이 낸 `pull_request` 실행에는 Dependabot secrets만 들어와
  # `create-github-app-token`부터 실패한다. 이 job은 **`workflow_run` 트리거**라 default
  # 브랜치 컨텍스트에서 **저장소의 정상 시크릿**을 들고 돈다(GitHub이 Dependabot PR을 다루라고
  # 안내하는 바로 그 경로다). 같은 필터를 여기에도 복사해 두면 얻는 것 없이 알림만 사라진다:
  # 2026-09-15 devDepth #36·#38이 빨간불인 채로, #37이 초록인 채로 담당자 없이 서 있었고
  # `Claude Review | workflow_run`은 매번 skipped로 끝났다. 의존성 PR은 거의 전부 공급망
  # 위험 경로라 **사람이 반드시 봐야 하는데**, 그 사람을 부르는 경로가 이것 하나뿐이다.
  notify-ready:
    if: >-
      inputs.notify-handle != '' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.AGENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}

      - name: 대상 PR 찾아 체크 결과에 따라 담당자 지정
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          BASE: ${{ inputs.base-branch }}
          NOTIFY_HANDLE: ${{ inputs.notify-handle }}
        run: |
          set +e
          set -o pipefail

          num=$(gh api "repos/$REPO/commits/$SHA/pulls" --paginate 2>/dev/null \
                  | jq -r --arg base "$BASE" \
                      '[.[] | select(.base.ref == $base and .state == "open")] | (.[0].number // empty)')
          if [ -z "$num" ]; then echo "$BASE 대상 열린 PR 없음 — 스킵"; exit 0; fi

          # `review` job의 같은 이름 함수와 내용이 같다. 재사용 워크플로우는 소비 저장소
          # 워크스페이스에서 돌아 로컬 composite action을 해석할 수 없고(PR #59·#62,
          # scripts/lint-workflows.sh가 막는다), job이 다르면 셸 함수도 공유할 수 없다.
          # 셸 중복을 감수한다 — 고칠 때는 두 곳을 같이 고친다(#58).
          assign_notify() {
            local pr="$1" err=""
            if ! err=$(gh pr edit "$pr" --repo "$REPO" --add-assignee "$NOTIFY_HANDLE" 2>&1); then
              echo "::warning title=담당자 지정 실패::PR #${pr}에 @${NOTIFY_HANDLE} 담당자 지정 실패 — 이 PR의 알림이 사람에게 닿지 않았을 수 있다: ${err}"
              if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
                printf '⚠️ PR #%s 담당자 지정 실패(`@%s`): %s\n' "$pr" "$NOTIFY_HANDLE" "$err" >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
            # 리뷰어는 보조 수단이다. PR 작성자 본인은 리뷰어가 될 수 없어 **정상적으로도** 실패하므로
            # warning으로 올리지 않는다 — 매 실행 경고가 뜨면 진짜 경고가 그 속에 묻힌다.
            if ! err=$(gh pr edit "$pr" --repo "$REPO" --add-reviewer "$NOTIFY_HANDLE" 2>&1); then
              echo "::notice title=리뷰어 지정 건너뜀::PR #${pr} 리뷰어 지정 실패(보조 경로): ${err}"
            fi
          }

          info=$(gh pr view "$num" --repo "$REPO" --json mergeable,mergeStateStatus,labels,assignees,author 2>/dev/null)
          mergeable=$(printf '%s' "$info" | jq -r '.mergeable // ""' 2>/dev/null)
          status=$(printf '%s' "$info" | jq -r '.mergeStateStatus // ""' 2>/dev/null)
          has_dnm=$(printf '%s' "$info" | jq -r '[.labels[].name] | any(. == "do-not-merge")' 2>/dev/null)
          already_assigned=$(printf '%s' "$info" | jq -r --arg h "$NOTIFY_HANDLE" '[.assignees[].login] | any(. == $h)' 2>/dev/null)
          is_dependabot=$(printf '%s' "$info" | jq -r '.author.login == "dependabot[bot]"' 2>/dev/null)

          if [ "$mergeable" = "MERGEABLE" ] && [ "$status" = "CLEAN" ]; then
            # 보통은 `do-not-merge`가 "사람이 봐야 한다"는 표식이다. Dependabot PR에는 그게
            # 안 붙는다 — `enable-auto-merge`의 `decide`가 같은 시크릿 제약으로 스킵되기
            # 때문이다. 그렇다고 알림을 건너뛰면 **초록인 채 아무도 모르게 열려만 있는다**
            # (devDepth #37 실측). 의존성 PR은 정의상 공급망 위험 경로이고 auto-merge도
            # 안 켜져 있으므로, 표식이 없어도 사람 머지가 확정이다.
            if [ "$has_dnm" != "true" ] && [ "$is_dependabot" != "true" ]; then
              echo "do-not-merge 아님 — 스킵"; exit 0
            fi
            if [ "$already_assigned" = "true" ]; then
              echo "이미 담당자 — 스킵(멱등, 주 경로가 이미 처리한 흔한 경우)"; exit 0
            fi
            assign_notify "$num"
            echo "담당자 지정함 (폴백 경로, mergeable=$mergeable, status=$status)"
            exit 0
          fi

          # 판정 대상 체크 목록. 브랜치 보호 API를 쓰지 않는 이유는 `review` job의 같은
          # 부분 주석 참고(admin 권한 필요 → App 토큰으로 404, PR #63).
          required=$(gh pr view "$num" --repo "$REPO" --json statusCheckRollup \
                       --jq '.statusCheckRollup[]? | (.name // .context) // empty' 2>/dev/null \
                       | sort -u)
          if [ -z "$required" ]; then echo "체크 목록이 비어 있음 — 빨간불 판정 보류"; exit 0; fi

          # claude-fix.yml이 아직 재시도 중이면 양보한다 — 자동 복구가 사람 호출보다 먼저다.
          comments=$(gh pr view "$num" --repo "$REPO" --json comments --jq '.comments[].body' 2>/dev/null)
          if printf '%s\n' "$comments" | grep -qF '<!-- claude-fix:attempt -->' \
             && ! printf '%s\n' "$comments" | grep -qF '<!-- claude-fix:gave-up -->'; then
            echo "claude-fix가 아직 재시도 중 — 양보"; exit 0
          fi

          # 이름별 최신 check-run 결론 중 필수 체크가 실패류로 끝난 게 있는지 본다.
          # **아직 도는 체크가 있으면 판정을 미룬다 — `review` job의 detect_red와 같은 규칙(#66).**
          # 이 폴백은 워크플로우가 끝날 때마다 깨어나므로, 미뤄도 마지막 하나가 끝나는 실행에서
          # 판정된다. 영구 Pending만 STALE_PENDING_MIN분으로 빠져나간다(같은 함수 주석 참고).
          STALE_PENDING_MIN=30
          runs=$(gh api "repos/$REPO/commits/$SHA/check-runs" --paginate 2>/dev/null \
                   | jq -s '[.[].check_runs[]]' 2>/dev/null \
                   | jq -r 'sort_by(.started_at) | reverse | group_by(.name) | .[] | .[0] |
                            "\(.name)\t\(.conclusion // "")\t\(.started_at // "")"' 2>/dev/null)

          now_ts=$(date -u +%s)
          detail=""; pending=""
          while IFS=$'\t' read -r name conclusion started; do
            [ -z "$name" ] && continue
            printf '%s\n' "$required" | grep -qxF "$name" || continue
            case "$conclusion" in
              failure|cancelled|startup_failure|timed_out|action_required)
                detail="${detail}- \`$name\`: $conclusion"$'\n' ;;
              "")
                started_ts=$(date -u -d "$started" +%s 2>/dev/null)
                if [ -n "$started_ts" ] && [ "$(( (now_ts - started_ts) / 60 ))" -lt "$STALE_PENDING_MIN" ]; then
                  pending="${pending}${name}, "
                fi
                ;;
            esac
          done <<< "$runs"

          if [ -n "$pending" ]; then
            echo "아직 도는 체크가 있어 빨간불 판정을 미룬다(다음 워크플로우 완료 때 다시 본다): ${pending%, }"
            exit 0
          fi

          if [ -z "$detail" ]; then echo "아직 CLEAN도 빨간불도 아님 — 스킵"; exit 0; fi

          marker="<!-- gate:checks-red:$SHA -->"
          if printf '%s\n' "$comments" | grep -qF "$marker"; then
            echo "이 커밋($SHA)은 이미 빨간불 알림을 보냈다 — 스킵"; exit 0
          fi

          gh pr edit "$num" --repo "$REPO" --add-label do-not-merge 2>/dev/null || true
          assign_notify "$num"
          {
            printf '@%s\n\n' "$NOTIFY_HANDLE"
            printf '%s\n\n' '🔴 **필수 체크 실패** `[AGENT-ACTION-REQUIRED]` — 자동으로는 초록이 되지 않습니다. 고칠지 닫을지 판단해주세요.'
            printf '%s\n' "$detail"
            printf '%s\n' "$marker"
          } | gh pr comment "$num" --repo "$REPO" --body-file -
          echo "빨간불 담당자 지정함 (폴백 경로, sha=$SHA)"
