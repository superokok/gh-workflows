name: Claude Review

# 이 저장소 자신의 2차 AI 리뷰. 소비 프로젝트와 같은 게이트를 여기에도 건다 —
# 워크플로우 변경은 blast radius가 가장 큰데 리뷰가 없던 건 앞뒤가 안 맞는다.
#
# 로컬 경로(`./`)로 부른다: 여기가 원본이라 `@main`으로 부르면 PR 브랜치의 변경이
# 아니라 이미 머지된 버전이 돌아버린다.
#
# 고위험이면 `do-not-merge`가 붙는다. 이 저장소엔 auto-merge가 없어서 라벨이 없어도
# 사람이 머지하지만, 라벨은 "그냥 보지 말고 이건 특히 봐라"는 신호로 남는다.
#
# 2026-09-14(#60): `notify-handle`을 넘겨서 체크 결과(초록/빨간불)에 따라 담당자를
# 지정하게 했다 — 안 그러면 이 저장소 PR의 빨간불은 아무도 모른다(claude-review.yml
# 상단 "2026-09-14(#60)" 주석 참고, 실측: PR #59). `Lint`(이 저장소의 CI)가 리뷰보다
# 늦게 끝나는 경우를 위해 `workflow_run: {workflows: ["Lint"]}`로 `notify-ready`
# 폴백을 켠다.
#
# **이 목록에 이 워크플로우 자신의 이름("Claude Review")을 넣지 않는다.** 처음엔
# "`review` job이 startup_failure로 죽으면 담당자 지정 스텝도 못 도니 자기 자신도
# 감시해야 한다"고 넣었는데, **그 자기 참조가 파일을 무효로 만들어 GitHub 파서가
# 거부했다** — run이 아예 생성되지 않아 필수 체크 `review / review`가 "Expected —
# Waiting for status to be reported"로 영구 Pending이 되고 PR이 머지 불가로 굳었다
# (2026-09-14 PR #63 실측. `scripts/lint-workflows.sh`의 actionlint는 통과시켰다 —
# GitHub 자체 검증만 잡는 종류다).
#
# 애초에 논리도 성립하지 않았다: 파일이 무효면 run이 없으므로 자기를 감시할 수 없고,
# `workflow_run`은 **default 브랜치에서만** 발동하므로 PR 브랜치의 startup_failure는
# 어차피 잡지 못한다.
#
# 그 커버리지는 **다른 워크플로우**가 맡는다 — `self-fix.yml`이 `workflows:`에
# "Claude Review"를 넣어 이 워크플로우의 실패를 감시한다(그쪽은 자기 참조가 아니라 유효하다).

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  workflow_run:
    workflows: ["Lint"]
    types: [completed]

jobs:
  review:
    # **fork PR에서는 돌지 않는다.** public 저장소라 누구나 PR을 열 수 있는데, fork에서 온
    # `pull_request`에는 시크릿이 넘어가지 않는다(GitHub 플랫폼 규칙). 그러면
    # `create-github-app-token`부터 빈 값으로 실패해 **외부 PR마다 빨간불**이 나고 분도
    # 나간다 — 리뷰는 한 줄도 못 하면서. 누출이 아니라 잡음이라 조용히 건너뛴다.
    # 외부 PR도 `self-lint`(시크릿 불필요)는 그대로 돌아 actionlint 피드백은 받는다.
    #
    # `workflow_run` 이벤트에는 `pull_request` 컨텍스트가 없다 — 이 조건을 그대로 두면
    # (`github.event.pull_request`가 없어 좌변이 빈 값이 되므로) `notify-ready` 폴백
    # job까지 통째로 스킵된다. `workflow_run`은 애초에 fork에서 오지 않으므로(base
    # 저장소 컨텍스트에서만 발생) 그때는 이 가드를 걸 필요가 없다.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # 호출부가 권한을 명시해야 한다 — 안 그러면 repo 기본 토큰 권한(id-token 없음)으로
    # 시작해서, id-token: write를 요구하는 불린 워크플로우가 startup_failure로 죽는다.
    # (2026-09-07 kitchen-tempo에서 실제로 겪음 — Claude Review가 전부 죽어 자동 머지가
    #  통째로 멈췄고, check-run이 안 생기니 auto-merge는 "대기"로만 보여 알림도 없었다.)
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    uses: ./.github/workflows/claude-review.yml
    secrets: inherit
    with:
      base-branch: main
      # 이 저장소의 PR은 워크플로우 YAML 몇 줄이다. `medium`은 과하고, 실측에서 이 저장소
      # 리뷰가 22 job / 131분(전체의 18%)을 먹었다. `low`는 "적지만 확신도 높은 findings"라
      # 작은 diff에 맞는다 — 고위험 차단 판정은 레벨과 무관하게 그대로 동작한다.
      review-level: low
      notify-handle: superokok
