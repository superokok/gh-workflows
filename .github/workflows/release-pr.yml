name: Release PR (develop → main) (reusable)

# ⚠️ **평소 경로는 여기가 아니다.** 같은 로직이 `after-merge.yml`의 스텝으로 들어갔다
# (`release-target` input). 통합 브랜치로의 PR 머지는 어차피 그 워크플로우를 깨우므로
# 같은 사건에 잡을 둘 쓸 이유가 없다 — Actions 분은 **잡 단위로 올림 과금**된다.
# 호출부에서는 `push:` 트리거를 떼고 `workflow_dispatch:`만 남긴다.
#
# 지우지 않고 남겨두는 이유는 **수동 재생성 창구**다. after-merge의 릴리스 스텝이 실패했거나
# (App 토큰 문제 등) 릴리스 PR을 실수로 닫았을 때, 머지 이벤트를 억지로 만들지 않고 여기서
# 한 번 돌리면 복구된다. 안 돌리면 분도 안 든다.
#
# `develop`이 `main`보다 앞서면 운영 반영 PR을 **항상 열어두고** 최신으로 유지한다.
#
# 패턴: release-please / changesets와 같은 "항상 열린 릴리스 PR". PR은 잔소리가 아니라
# **대시보드**다 — 지금 배포하면 뭐가 나가는지 항상 볼 수 있고, 머지하는 순간이 곧 릴리스다.
#
# 왜 자동화하는가 (2026-09-05): CLAUDE.md 루프 7번은 "Claude는 준비되면 develop→main PR을
# 만들고"인데, "준비되면"을 판단하는 주체가 Claude고 **Claude는 세션이 돌 때만 존재한다.**
# 그래서 develop에 변경이 쌓여도 사용자가 세션에서 먼저 말하기 전까지 아무 일도 안 일어났다.
#
# 이 워크플로우는 **PR을 열기만 한다.** 머지는 여전히 사람이 한다(ADR 0003·0008의 사람 게이트).
#
# ── 알림 (2026-09-06 무음 → App 전환으로 일부 변경) ──────────────────────────
# **갱신은 여전히 무음이다** — GitHub은 PR 본문·제목 수정이나 커밋 추가에 알림을 보내지
# 않는다. 이 워크플로우는 PR 하나를 열어두고 갱신하는 구조라 대부분의 시간이 여기 해당한다.
#
# **바뀐 것: 새 릴리스 PR이 "열릴 때"는 알림이 간다.** 예전엔 사용자 계정 PAT로 만들어
# "자기 자신의 행동"이라 알림이 안 갔는데, App 봇이 작성자가 되면서 그렇지 않게 됐다.
# 빈도는 머지마다가 아니라 **릴리스 주기마다 한 번**(직전 릴리스를 머지한 직후)이다.
# 이 정도는 "찌르지 않는다"는 원래 의도에서 크게 벗어나지 않는다고 보고 받아들였다 —
# 거슬리면 저장소 watch를 "Participating and @mentions"로 낮추면 된다.
#
# 정기 리마인더(주간 cron)를 넣었다가 뺐다. 아무 사건도 없는데 도착하는 알림은 무시당한다 —
# 사용자 본인이 "받아도 무시할 것 같다"고 했고 그 판단이 맞다. **"지금 배포할 때인가"는
# 시스템이 계산할 수 없다**(배치가 완결됐는지, 지켜볼 시간이 있는지, 위험한지 — 전부 사람
# 판단이다). 그래서 찌르지 않고, 판단하고 싶어질 때 한 클릭 거리에 최신 상태로 놓아둔다.
# release-please/changesets의 원래 동작이 이것이다.
#
# 누적 신호는 **이미 읽고 있는 [AGENT-MERGED] 메일**이 준다 — 그 코멘트에 "운영에 안 나간
# 변경 N건"이 들어간다(auto-merge.yml / after-merge.yml). 새 알림 채널을 만들지 않고
# 이미 열어보는 메일에 정보를 얹는 쪽이 무시당하지 않는다.
#
# PR 생성에 PAT를 쓰는 이유는 따로 있다: secrets.GITHUB_TOKEN으로 만든 PR에는 GitHub이
# 워크플로우를 트리거하지 않아 `check`가 안 돌고, ADR 0010의 "develop→main은 check 초록 +
# 사람" 게이트가 빈 껍데기가 된다(ADR 0007의 알려진 제약과 같은 이유).

on:
  workflow_call:
    inputs:
      pre-merge-note:
        description: |
          릴리스 PR 본문에 "포함된 변경" 목록 앞에 그대로 넣을 마크다운(예: staging 확인 링크,
          머지 방식 안내). 프로젝트마다 다르므로 여기서 강제하지 않는다. 생략 가능.
        type: string
        default: ""

concurrency:
  group: release-pr
  cancel-in-progress: false

jobs:
  release-pr:
    runs-on: ubuntu-latest
    steps:
      # ── 자격증명: PAT가 아니라 GitHub App 설치 토큰 ──────────────────────────
      # App은 private key라 **만료가 없고**, 설치를 "All repositories"로 두면 새 저장소가
      # 자동으로 포함돼 저장소 목록을 갱신할 일이 없다. fine-grained PAT가 강제하던 1년
      # 교체와 저장소별 접근 목록 관리가 둘 다 사라진다.
      #
      # **자동 GITHUB_TOKEN과 달리 App 토큰으로 만든 이벤트는 다른 워크플로우를 트리거한다.**
      # 이 루프가 PAT를 쓰던 이유가 정확히 그거였고(라벨·머지·push가 다음 워크플로우를 깨워야
      # 한다), App은 그 성질을 그대로 갖는다.
      #
      # `app-id`(숫자)가 아니라 `client-id`를 쓴다. v3의 권장이기도 하지만, 실질적인 이유는
      # **App ID와 Installation ID가 둘 다 숫자라 구별이 안 된다**는 것이다. 설치 화면 URL의
      # 숫자를 App ID로 착각해 넣으면 JWT의 iss가 앱을 가리키지 않아
      # `A JSON web token could not be decoded`로 죽는다(2026-09-11 실제로 겪었다).
      # Client ID는 `Iv23…` 형태라 그 착각이 성립하지 않는다.
      #
      # App에 줘야 하는 권한: Contents / Pull requests / Issues / **Workflows** = write.
      # Workflows가 없으면 `.github/workflows/*` 커밋이 거부된다 — Claude GitHub App 설치
      # 토큰을 못 쓰고 PAT로 갔던 원래 이유가 이것이다(ADR 0007 "알려진 제약").
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.AGENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: 릴리스 PR 생성/갱신 (알림 없음)
        id: upsert
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PRE_MERGE_NOTE: ${{ inputs.pre-merge-note }}
        run: |
          set -euo pipefail

          git fetch origin main develop --quiet

          ahead=$(git rev-list --count origin/main..origin/develop)
          echo "ahead=$ahead" >> "$GITHUB_OUTPUT"

          if [ "$ahead" -eq 0 ]; then
            echo "develop이 main과 같음 — 릴리스할 것 없음"
            echo "pr=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "develop이 main보다 $ahead 커밋 앞섬"

          # 본문은 파일로 만든다 - 커밋 제목에 백틱/따옴표가 섞여도 셸이 해석하지 않게.
          # 본문에 [AGENT-ACTION-REQUIRED] 태그를 넣지 않는다 - 이 PR은 알림을 유발하지
          # 않으므로(위 참고) 태그를 넣어봐야 메일은 안 오고 Gmail 필터만 헷갈린다.
          {
            printf '%s\n\n' '`develop` → `main` 운영 반영입니다. **머지하면 즉시 운영 배포 + DB 마이그레이션이 돕니다.**'
            if [ -n "$PRE_MERGE_NOTE" ]; then printf '%s\n\n' "$PRE_MERGE_NOTE"; fi
            printf '## 포함된 변경 (%s건)\n\n' "$ahead"
            git log --format='- %s' origin/main..origin/develop
            printf '\n---\n\n%s\n' '이 PR은 `release-pr.yml`이 자동으로 열고 갱신합니다(갱신에는 알림이 가지 않습니다). 머지는 사람이 합니다.'
          } > /tmp/release-body.md

          title="release: develop → main (${ahead}건)"

          existing=$(gh pr list --repo "$REPO" --base main --head develop --state open \
                       --json number --jq '(.[0].number // empty)')

          if [ -n "$existing" ]; then
            gh pr edit "$existing" --repo "$REPO" --title "$title" --body-file /tmp/release-body.md
            echo "기존 릴리스 PR #$existing 갱신"
            echo "pr=$existing" >> "$GITHUB_OUTPUT"
          else
            gh pr create --repo "$REPO" --base main --head develop \
              --title "$title" --body-file /tmp/release-body.md
            num=$(gh pr list --repo "$REPO" --base main --head develop --state open \
                    --json number --jq '(.[0].number // empty)')
            echo "릴리스 PR #$num 생성"
            echo "pr=$num" >> "$GITHUB_OUTPUT"
          fi
