name: After merge (issue close · branch cleanup) (reusable)

# develop 대상 PR이 머지된 뒤의 뒷정리. **머지 주체(auto-merge / 사람)와 무관하게** 돈다.
#
# 왜 별도 워크플로우인가 (2026-09-05):
# 두 뒷정리가 원래 auto-merge.yml 안에만 있었다(이슈 close, --delete-branch). 그래서
# **자동 머지된 PR만** 정리되고, 사람이 UI에서 머지한 PR은 이슈가 열린 채로, 브랜치가
# 남은 채로 방치됐다 — 그런데 사람이 머지하는 건 정확히 위험 경로 PR(auth·api/admin·
# scripts·워크플로우)이라, 가장 중요한 작업일수록 뒷정리가 안 되는 구조였다.
# 실측: 이슈 #110·#116이 PR #141·#142 머지 후에도 OPEN, 브랜치 3개가 잔류.
#
# repo 설정 `delete_branch_on_merge`를 켜는 방법도 있으나 **쓰면 안 된다** — 그 설정은
# 머지된 PR의 head 브랜치를 무조건 지워서, `develop`→`main` 릴리스 PR을 머지하는 순간
# **`develop` 자체가 삭제된다**(2026-09-05 실제로 겪고 복구함). 여기서 base=develop인
# PR만, 그리고 develop/main은 이름으로도 한 번 더 막고 지운다.
#
# GitHub이 이슈를 알아서 안 닫아주는 이유: close 키워드 자동 처리는 **default 브랜치(main)로
# 머지될 때만** 동작한다. 이 저장소의 작업 머지 대상은 develop이라 해당되지 않는다.
#
# auto-merge.yml에도 같은 두 로직이 남아 있는데 의도적이다 — 이미 닫힌 이슈를 닫거나
# 이미 없는 브랜치를 지우는 건 무해하고(no-op), 어느 한쪽이 안 돌아도 방치되지 않는다.

on:
  workflow_call:
    inputs:
      base-branch:
        description: 뒷정리 대상 PR의 base. 통합 브랜치가 없으면 "main"
        type: string
        default: "develop"
      release-target:
        description: |
          비어 있지 않으면 뒷정리와 **같은 잡에서** 릴리스 PR(`base-branch` → 이 값)을
          생성/갱신한다. 통합 브랜치가 없는 저장소는 비워 둔다(릴리스 흐름 자체가 없다).

          왜 여기로 옮겼나: `release-pr.yml`은 `push: <통합 브랜치>`로 도는 별도 워크플로우였는데,
          **그 push는 거의 항상 이 워크플로우를 깨우는 PR 머지와 같은 사건**이다. 같은 사건에
          잡이 둘이면 **Actions 분이 잡 단위로 올림 과금**되므로 10초짜리 일이 2분으로 청구된다
          (실측: 11시간 표본에서 Release PR 11 run이 실제 2분 작업에 11분 청구). 이 파일이
          이미 잡 4개를 스텝으로 합친 것과 같은 이유다.

          커버리지는 오히려 늘어난다 — 릴리스 PR이 머지되면 `<통합 브랜치>`는 안 바뀌어서
          예전 `push:` 트리거는 안 돌았지만, 이 워크플로우는 그때도 깨어난다.
        type: string
        default: ""
      notify-handle:
        description: |
          충돌하게 된 PR에 담당자로 지정할 GitHub 핸들. 비어 있으면 충돌 알림을 건너뛴다.
          다른 워크플로우(`enable-auto-merge`·`claude-review`·`claude-fix`)의 같은 이름
          입력과 **같은 값을 넘긴다** — 한 곳만 빠지면 그 경로의 알림만 조용히 사라진다.
        type: string
        default: ""
      pre-merge-note:
        description: |
          릴리스 PR 본문의 "포함된 변경" 목록 앞에 그대로 넣을 마크다운(staging 링크, 머지 방식
          안내 등). 프로젝트마다 다르므로 강제하지 않는다. `release-target`이 비어 있으면 무시된다.
        type: string
        default: ""

jobs:
  # **네 가지 뒷정리를 한 잡에서 스텝으로 한다.** 예전엔 잡 4개였는데, GitHub Actions는
  # **잡마다 분 단위로 올림 과금**해서 각 스텝이 3초여도 4분이 나갔다(2026-09-09 실측:
  # 이 워크플로우 11회 실행에 34분 — 실제 작업 시간은 그 몇 분의 일이다).
  # 전부 `gh` API를 몇 번 부르는 게 전부라 병렬로 얻을 게 없다.
  #
  # 순서: 알림 → 이슈 닫기 → 브랜치 삭제 → 큐 구동. drain-queue는 마지막이어야
  # PR 상태가 정리된 뒤 "판이 비었는지"를 본다.
  #
  # **각 스텝은 `!cancelled()`로 서로 독립이다.** 잡이 넷일 땐 하나가 실패해도 나머지가
  # 돌았는데, 스텝으로 합치면 기본값(`success()`)이라 앞이 실패하면 뒤가 통째로 스킵된다.
  # 뒷정리끼리는 의존이 없다 — 알림이 실패해도 브랜치는 지워지고 큐는 돌아야 한다.
  #
  # **잡 조건에 `merged == true`를 걸지 않는다**(2026-09-10). 앞의 세 스텝(알림·이슈 닫기·
  # 브랜치 삭제)은 머지됐을 때만 의미가 있어서 각자 판정하지만, **마지막 `drain-queue`는
  # 머지 없이 닫힌 PR 뒤에도 돌아야 한다.** 잡 단위로 막아두면 PR을 그냥 닫거나 취소했을 때
  # 큐가 **조용히 멈춘다** — `agent-queued` 이슈들이 아무도 깨우지 않는 채 남고, 그게 정상과
  # 구별되지 않는다(감사 L08). 판이 비었는지는 스텝 안에서 어차피 다시 확인한다.
  after-merge:
    # 닫힌 PR에서만. 두 호출부 모두 `pull_request: types: [closed]`로 부르지만, 다른 트리거로
    # 잘못 연결됐을 때 뒷정리가 엉뚱한 시점에 도는 걸 여기서 한 번 더 막는다.
    if: github.event.pull_request.state == 'closed'
    runs-on: ubuntu-latest
    # GitHub Actions는 permissions를 job(워크플로우) 단위로만 선언할 수 있어 스텝별로
    # 좁힐 수 없다 — 예: 코멘트만 게시하면 되는 스텝도 실행 중엔 이슈 닫기·브랜치 삭제
    # 권한까지 쥔 GITHUB_TOKEN을 받는다(PR #24 리뷰 지적, #26). 스텝마다 job을 새로
    # 쪼개면 이 파일을 한 잡으로 합친 이유(잡 단위 올림 과금, 4잡→1잡으로 34분→~11분)가
    # 그대로 되살아나므로, 재검토 후 이 job에 실제로 필요한 최소 합집합만 유지하기로
    # 했다 — 세 권한 모두 이 job의 어느 한 스텝에는 실제로 필요하다.
    permissions:
      contents: write        # 브랜치 삭제
      issues: write          # 이슈 닫기 · 큐 라벨
      pull-requests: write   # 머지 알림 코멘트
    steps:
      # ── 자격증명: PAT가 아니라 GitHub App 설치 토큰 ──────────────────────────
      # App은 private key라 **만료가 없고**, 설치를 "All repositories"로 두면 새 저장소가
      # 자동으로 포함돼 저장소 목록을 갱신할 일이 없다. fine-grained PAT가 강제하던 1년
      # 교체와 저장소별 접근 목록 관리가 둘 다 사라진다.
      #
      # **자동 GITHUB_TOKEN과 달리 App 토큰으로 만든 이벤트는 다른 워크플로우를 트리거한다.**
      # 이 루프가 PAT를 쓰던 이유가 정확히 그거였고(라벨·머지·push가 다음 워크플로우를 깨워야
      # 한다), App은 그 성질을 그대로 갖는다.
      #
      # `app-id`(숫자)가 아니라 `client-id`를 쓴다. v3의 권장이기도 하지만, 실질적인 이유는
      # **App ID와 Installation ID가 둘 다 숫자라 구별이 안 된다**는 것이다. 설치 화면 URL의
      # 숫자를 App ID로 착각해 넣으면 JWT의 iss가 앱을 가리키지 않아
      # `A JSON web token could not be decoded`로 죽는다(2026-09-11 실제로 겪었다).
      # Client ID는 `Iv23…` 형태라 그 착각이 성립하지 않는다.
      #
      # App에 줘야 하는 권한: Contents / Pull requests / Issues / **Workflows** = write.
      # Workflows가 없으면 `.github/workflows/*` 커밋이 거부된다 — Claude GitHub App 설치
      # 토큰을 못 쓰고 PAT로 갔던 원래 이유가 이것이다(ADR 0007 "알려진 제약").
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.AGENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}

      - name: 머지 완료 코멘트(Gmail 알림용 태그 포함)
        id: notify
        if: ${{ !cancelled() && github.event.pull_request.merged == true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          # 이 잡 자체가 같은 PR에 대해 여러 이벤트로 다시 돌 수 있으니(재실행 등) 방어적으로
          # 중복 방지는 남겨둔다 — 더 이상 다른 워크플로우와 경합하기 위한 것은 아니다.
          if gh pr view "$PR" --repo "$REPO" --json comments --jq '.comments[].body' \
               | grep -qF '[AGENT-MERGED]'; then
            echo "이미 [AGENT-MERGED] 코멘트가 있음 — 스킵"
            exit 0
          fi

          if [ "$BASE" = "main" ]; then
            detail="운영(main)에 반영됐습니다. 배포와 DB 마이그레이션이 이어서 돕니다."
          else
            # 운영에 안 나간 누적 건수를 이 메일에 얹는다(auto-merge.yml과 동일한 이유):
            # 릴리스 PR은 알림을 보내지 않으므로, "쌓이고 있다"는 신호는 사용자가 이미
            # 열어보는 이 메일이 유일하게 전달한다.
            # `2>/dev/null`을 쓰지 않는다 — 예전엔 이게 stderr만 버려서, 권한 부족으로 온
            # **에러 JSON이 그대로 값이 됐다.** 실제 코멘트 본문이
            # `운영에 안 나간 변경 **{"message":"Resource not accessible by integration",...}건**`
            # 이었고, 도입(2026-09-05) 이래 정상 분기가 한 번도 실행된 적이 없었다.
            # 잡은 초록으로 끝나 `gh run list` 브리핑으로도 안 잡혔다(감사 L51).
            # 이제 실패는 잡 로그에 보이고, **숫자 검증**이 어떤 실패 경로에서도 본문 오염을 막는다.
            unreleased=$(gh api "repos/$REPO/compare/main...$BASE" --jq '.ahead_by') || unreleased=""
            case "$unreleased" in ''|*[!0-9]*) unreleased="" ;; esac

            if [ -n "$unreleased" ] && [ "$unreleased" != "0" ]; then
              detail="\`$BASE\`에 반영됐습니다. 운영에 안 나간 변경 **${unreleased}건** — 배포는 develop→main 릴리스 PR에서."
            else
              detail="\`$BASE\`에 반영됐습니다. 운영 반영은 develop→main 릴리스에서 따로 진행합니다."
            fi
          fi

          printf '%s\n\n%s\n\n%s\n' \
            "✅ **머지 완료** \`[AGENT-MERGED]\`" \
            "\`$HEAD_REF\` → \`$BASE\`" \
            "$detail" \
            | gh pr comment "$PR" --repo "$REPO" --body-file -

      - name: 본문의 close 키워드로 연결된 이슈 닫기
        id: close-issues
        if: ${{ !cancelled() && github.event.pull_request.merged == true && github.event.pull_request.base.ref == inputs.base-branch }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          issues=$(printf '%s' "$BODY" \
                     | grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?) +#[0-9]+' \
                     | grep -oE '[0-9]+' | sort -u || true)
          if [ -z "$issues" ]; then echo "PR #$PR 본문에 연결된 이슈 없음 — 스킵"; exit 0; fi

          for i in $issues; do
            state=$(gh issue view "$i" --repo "$REPO" --json state --jq .state 2>/dev/null || echo MISSING)
            case "$state" in
              OPEN)
                echo "closing #$i"
                gh issue close "$i" --repo "$REPO" \
                  --comment "develop에 반영됨 (PR #$PR). 운영 반영은 develop→main 릴리스에서." || true ;;
              CLOSED)  echo "#$i 이미 닫힘 — 스킵" ;;
              *)       echo "#$i 조회 실패($state) — 스킵" ;;
            esac
          done

      - name: 머지된 작업 브랜치 삭제
        id: delete-branch
        if: ${{ !cancelled() && github.event.pull_request.merged == true && github.event.pull_request.base.ref == inputs.base-branch && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref != inputs.base-branch && github.event.pull_request.head.ref != 'main' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          # 스택 PR을 옮길 곳 — 방금 머지된 PR의 base(보통 통합 브랜치)
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail

          # if 조건에서 이미 걸렀지만, 이 스텝만 재사용/복사될 경우를 대비한 마지막 방어선.
          # 장수 브랜치를 지우는 사고는 복구가 번거롭다(2026-09-05 develop 삭제 사례).
          case "$BRANCH" in
            develop|main) echo "장수 브랜치($BRANCH) — 절대 삭제하지 않는다"; exit 0 ;;
          esac

          if ! gh api "repos/$REPO/git/refs/heads/$BRANCH" >/dev/null 2>&1; then
            echo "$BRANCH 이미 없음(auto-merge가 --delete-branch로 지움) — 스킵"; exit 0
          fi

          # **스택 PR을 먼저 옮기고 나서 지운다.**
          #
          # GitHub은 자기가 브랜치를 지울 때, 그 브랜치를 base로 하던 PR을 **상위 base로 자동
          # 재지정**해 준다. 이 워크플로우처럼 API로 직접 지우면 그 보정이 걸리지 않아서,
          # 스택 PR이 머지되지 않은 채 CLOSED로 사라진다(2026-09-16 #85 실측: base가 사라진
          # 10초 뒤 닫혔다).
          #
          # 처음엔 "열린 PR이 base면 지우지 않는다"로 막았는데, 그러면 반대쪽이 깨진다 —
          # 브랜치가 살아 있으니 재지정도 안 되고, 스택 PR이 **이미 머지된 낡은 브랜치로**
          # 머지된다. 그 내용은 main에 영영 안 온다(2026-09-16 #88 실측: `self-release.yml`이
          # main에 없어 릴리스 워크플로우를 부를 수 없었다).
          #
          # 그래서 GitHub이 하는 그대로 한다: **재지정 → 삭제**. 재지정 대상은 방금 머지된
          # PR의 base다(보통 통합 브랜치).
          stacked=$(gh pr list --repo "$REPO" --base "$BRANCH" --state open \
                      --json number --jq '.[].number' 2>/dev/null || true)
          if [ -n "$stacked" ]; then
            for n in $stacked; do
              if gh pr edit "$n" --repo "$REPO" --base "$BASE_REF"; then
                echo "#$n 의 base를 $BRANCH → $BASE_REF 로 옮겼다(스택 PR)"
                gh pr comment "$n" --repo "$REPO" --body "이 PR의 base였던 \`$BRANCH\`가 머지돼 **base를 \`$BASE_REF\`로 옮겼습니다.** 충돌이 나면 \`$BASE_REF\`를 머지해 주세요." >/dev/null 2>&1 || true
              else
                echo "::warning title=스택 PR 재지정 실패::#$n 의 base를 옮기지 못했다 — $BRANCH 를 지우지 않는다(지우면 PR이 닫힌다)"
                echo "재지정에 실패했으므로 삭제를 건너뛴다"
                exit 0
              fi
            done
          fi

          gh api -X DELETE "repos/$REPO/git/refs/heads/$BRANCH"
          echo "삭제됨: $BRANCH"

      # ── WIP 제한 1의 큐 구동기 ────────────────────────────────────────────
      # 에이전트도 리뷰도 열린 PR이 있으면 착수하지 않고 `agent-queued`로 대기시킨다
      # (claude-agent.yml · claude-review.yml). 그 대기를 푸는 게 이 스텝이다 — PR이
      # 닫혀 판이 비면 가장 오래 기다린 이슈 하나를 `agent`로 돌린다.
      #
      # **머지된 PR뿐 아니라 그냥 닫힌 PR 뒤에도 돈다**(감사 L08). 머지만 조건으로 걸면
      # PR을 취소했을 때 큐가 조용히 멈추고, 멈춘 건 정상과 구별되지 않는다.
  #
  # 이게 없으면 사용자가 다시 스케줄러가 된다. 대기시키는 것까지만 자동화하고
  # 깨우는 걸 사람에게 넘기면, 2026-09-07에 고친 문제(`agent` 라벨을 사람이
  # 붙여야만 시작되던 것)를 형태만 바꿔 되살리는 셈이다.
  #
  # 하나만 깨운다. 여러 개를 한꺼번에 풀면 WIP 제한이 무의미해진다.
      - name: 판이 비었으면 대기 중인 이슈 하나를 깨운다
        id: drain-queue
        if: ${{ !cancelled() }}
        env:
          # PAT를 쓴다 — GITHUB_TOKEN이 붙인 라벨은 `issues: labeled` 이벤트로
          # 다른 워크플로우를 깨우지 않아(GitHub 플랫폼 제약), claude-agent가 안 돈다.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ inputs.base-branch }}
        run: |
          set -euo pipefail

          # remove-label → add-label 사이는 원자적이지 않다. 그 사이 gh API 호출이
          # 일시적으로 실패하면 이슈가 양쪽 라벨 다 없는 채로 큐에서 영구히 빠진다.
          # 그래서 add든 remove든 똑같이 재시도한다 — add가 그래도 다 실패하면 직전
          # 라벨로 되돌리며 시끄럽게 알린다(remove는 되돌릴 "직전 상태"가 모호해서
          # 그 처리까지는 하지 않는다).
          #
          # claude-agent.yml의 wake-if-idle에도 같은 로직이 있다(PR #53 리뷰 지적 #54).
          # 한때 .github/actions/label-with-retry composite action으로 공유했으나(PR
          # #56), 재사용 워크플로우가 소비 저장소 워크스페이스에서 도는 문제로
          # startup_failure 함정이었다(#61, lint가 이제 로컬 액션 참조를 막는다) — 셸
          # 중복으로 되돌렸다. 이 스텝은 애초에 composite action을 쓰지 않았다: 여러
          # 단계를 하나로 합쳐 `id: drain-queue`의 outcome 하나로 노출하고 있어서(아래
          # "정리 결과 요약" 스텝, PR #24 리뷰 지적 #26) action을 쓰려면 다시 여러
          # 스텝으로 쪼개야 했다. 로직이 갈라지지 않도록 고칠 때 양쪽 다 같이 본다.
          label_with_retry() {
            local mode="$1" issue="$2" label="$3" attempts=5 delay=3 n=1
            local flag
            case "$mode" in
              add) flag="--add-label" ;;
              remove) flag="--remove-label" ;;
              *) echo "::error::알 수 없는 mode: $mode"; return 1 ;;
            esac
            until gh issue edit "$issue" --repo "$REPO" "$flag" "$label"; do
              if [ "$n" -ge "$attempts" ]; then return 1; fi
              echo "라벨 $mode 실패 (#$issue → $label), ${delay}초 후 재시도 ($n/$attempts)"
              sleep "$delay"
              n=$((n + 1))
              delay=$((delay * 2))
            done
          }

          # 릴리스 PR(base=main)은 항상 열려 있으므로 세지 않는다 — 세면 큐가 영원히 안 풀린다.
          #
          # Dependabot PR도 세지 않는다(#47). 리뷰·자동머지가 안 도는 채로 사람이 처리할
          # 때까지 계속 열려 있어서(README "알아둘 것" 참고), 그대로 세면 큐가 사람 개입
          # 없이는 영원히 안 풀린다 — 898d09b가 못 막은 나머지 절반이 이 스텝이었다
          # (2026-09-13~14 devDepth 실측: Dependabot PR 4건이 닫힐 때까지 24시간 정지).
          #
          # 여기서는 파일 겹침을 보지 않는다 — 이 스크립트는 다음에 깨어날 이슈가 뭘 고칠지
          # 모른다(그건 그 이슈를 실제로 맡을 claude-agent만 안다). 대신 **깨우기만 하고
          # 판단은 미룬다**: claude-agent.yml의 스텝 0이 깨어난 직후 같은 Dependabot PR을
          # 다시 보고, 이번 이슈가 락파일 등을 건드릴 것 같으면 그 자리에서 다시 큐로
          # 돌려보낸다. 그래서 여기서 author만 걸러도 안전하다.
          open=$(gh pr list --repo "$REPO" --base "$BASE" --state open --json number,author \
                   --jq '[.[] | select(.author.login != "dependabot[bot]")] | length')
          if [ "$open" != "0" ]; then
            echo "아직 열린 $BASE PR $open건(Dependabot 제외) — 큐를 풀지 않는다"; exit 0
          fi

          next=$(gh issue list --repo "$REPO" --state open --label agent-queued                    --json number,createdAt --jq 'sort_by(.createdAt) | (.[0].number // empty)')

          if [ -n "$next" ]; then
            echo "큐에서 #$next 를 깨운다"
            if ! label_with_retry remove "$next" agent-queued; then
              echo "::error::#$next 에서 agent-queued 라벨을 떼지 못했다"
              exit 1
            fi
            # 댓글은 부가 정보일 뿐이니 실패해도 라벨 복구를 막지 않는다.
            gh issue comment "$next" --repo "$REPO"               --body "앞 PR이 닫혀 판이 비었습니다 — 이어서 착수합니다." || echo "댓글 실패 — 계속 진행"
            # 라벨 부착이 claude-agent.yml을 깨운다. 마지막에 붙인다.
            if ! label_with_retry add "$next" agent; then
              echo "::error::#$next 에 agent 라벨을 붙이지 못했다 — agent-queued로 되돌린다"
              gh issue edit "$next" --repo "$REPO" --add-label agent-queued || true
              gh issue comment "$next" --repo "$REPO"                 --body "⚠️ 큐 재개 중 agent 라벨 부착에 실패해 agent-queued로 되돌렸습니다. 다음 판이 빌 때 다시 시도됩니다." || true
              exit 1
            fi
            exit 0
          fi

          # 큐가 비었으면 **정지한 `agent` 이슈**를 되살린다.
          # claude-agent는 저장소당 하나만 도는데 GitHub의 대기 슬롯은 하나뿐이라, 세 번째
          # 실행이 오면 두 번째 대기 실행이 취소된다. 그 이슈는 `agent` 라벨만 남고 아무 일도
          # 일어나지 않는다 — 라벨이 이미 붙어 있어 `issues: labeled`가 다시 나지도 않는다.
          # 에이전트가 턴 상한·타임아웃으로 끊긴 경우도 같은 모양이다.
          #
          # 라벨을 뗐다 붙여 이벤트를 다시 낸다. 열린 PR이 있으면 위에서 이미 빠져나갔으므로,
          # 여기 오는 건 "판이 비었는데 착수가 안 된" 이슈뿐이다.
          stalled=$(gh issue list --repo "$REPO" --state open --label agent                       --json number,createdAt --jq 'sort_by(.createdAt) | (.[0].number // empty)')
          if [ -z "$stalled" ]; then echo "대기 중인 이슈 없음"; exit 0; fi

          echo "정지한 것으로 보이는 #$stalled 를 되살린다"
          if ! label_with_retry remove "$stalled" agent; then
            echo "::error::#$stalled 에서 agent 라벨을 떼지 못했다 — 정지 복구를 포기한다"
            exit 1
          fi
          sleep 2
          if ! label_with_retry add "$stalled" agent; then
            echo "::error::#$stalled 에 agent 라벨을 다시 붙이지 못했다 — 라벨이 빠진 채로 남았다"
            gh issue comment "$stalled" --repo "$REPO"               --body "⚠️ 정지 복구 중 agent 라벨 재부착에 실패했습니다. 라벨이 빠진 채로 남아있으니 수동 확인이 필요합니다." || true
            exit 1
          fi

      # ── 릴리스 PR (통합 브랜치 → 운영 브랜치) ────────────────────────────────
      # `release-pr.yml`에 있던 로직을 이 잡의 스텝으로 옮긴 것이다. 배경은 `release-target`
      # input 설명 참고.
      #
      # **체크아웃을 하지 않는다.** 원본은 `git rev-list`/`git log`를 쓰려고 `fetch-depth: 0`으로
      # 전체 히스토리를 받았는데, 이 잡은 원래 체크아웃이 없다. compare API가 같은 정보
      # (ahead_by + 커밋 목록)를 주므로 clone 시간까지 같이 없어진다. 대신 커밋 목록은
      # 250건이 상한인데, 릴리스 주기가 그보다 길어질 일은 없다.
      #
      # **App 토큰으로 만든다.** `GITHUB_TOKEN`으로 만든 PR에는 GitHub이 워크플로우를
      # 트리거하지 않아 CI가 안 돌고, "릴리스는 초록 + 사람" 게이트가 빈 껍데기가 된다.
      - name: 릴리스 PR 생성/갱신 (갱신은 알림 없음)
        id: release-pr
        if: ${{ !cancelled() && inputs.release-target != '' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == inputs.base-branch }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ inputs.base-branch }}
          TARGET: ${{ inputs.release-target }}
          PRE_MERGE_NOTE: ${{ inputs.pre-merge-note }}
        run: |
          set -euo pipefail

          # 릴리스 PR 자신이 머지된 직후에도 이 스텝이 깨어나지만 그때는 ahead=0이라
          # 아무 일도 하지 않는다.
          #
          # ahead_by와 커밋 목록을 같은 compare 응답에서 뽑는다 — 따로 두 번 호출하면
          # 그 사이 BASE가 앞서 나가는 레이스로 헤더 건수와 실제 목록이 어긋날 수 있다.
          gh api "repos/$REPO/compare/$TARGET...$BASE" > "$RUNNER_TEMP/compare.json"
          ahead=$(jq '.ahead_by' "$RUNNER_TEMP/compare.json")
          if [ "$ahead" -eq 0 ]; then
            echo "$BASE가 $TARGET과 같음 — 릴리스할 것 없음"; exit 0
          fi
          echo "$BASE가 $TARGET보다 $ahead 커밋 앞섬"

          # 본문은 파일로 만든다 — 커밋 제목에 백틱/따옴표가 섞여도 셸이 해석하지 않게.
          {
            printf '%s\n\n' "\`$BASE\` → \`$TARGET\` 운영 반영입니다. **머지하면 즉시 운영 배포 + DB 마이그레이션이 돕니다.**"
            if [ -n "$PRE_MERGE_NOTE" ]; then printf '%s\n\n' "$PRE_MERGE_NOTE"; fi
            printf '## 포함된 변경 (%s건)\n\n' "$ahead"
            jq -r '.commits[] | "- \(.commit.message | split("\n")[0])"' "$RUNNER_TEMP/compare.json"
            printf '\n---\n\n%s\n' '이 PR은 `after-merge.yml`이 자동으로 열고 갱신합니다(갱신에는 알림이 가지 않습니다). 머지는 사람이 합니다.'
          } > "$RUNNER_TEMP/release-body.md"

          title="release: $BASE → $TARGET (${ahead}건)"

          existing=$(gh pr list --repo "$REPO" --base "$TARGET" --head "$BASE" --state open \
                       --json number --jq '(.[0].number // empty)')

          if [ -n "$existing" ]; then
            gh pr edit "$existing" --repo "$REPO" --title "$title" --body-file "$RUNNER_TEMP/release-body.md"
            echo "기존 릴리스 PR #$existing 갱신"
            exit 0
          fi

          # `release-pr.yml`에는 `concurrency: release-pr`가 있었지만 이 잡에는 없다
          # (여기 concurrency를 걸면 뒷정리·큐 구동까지 같이 취소될 수 있어 넣지 않는다).
          # 그래서 check-then-act 경합이 원리적으로 가능하다 — 둘 다 "열린 PR 없음"을 보고
          # 둘 다 create하는 것. GitHub이 중복 PR을 거부하므로 **"이미 존재함" 에러에 한해
          # 갱신으로 받아넘긴다.** 권한·레이트리밋 등 다른 이유의 실패는 그대로 실패시켜
          # 누군가 수동으로 열어둔 무관한 dev→main PR을 덮어쓰지 않게 한다.
          if ! gh pr create --repo "$REPO" --base "$TARGET" --head "$BASE" \
                 --title "$title" --body-file "$RUNNER_TEMP/release-body.md" 2>"$RUNNER_TEMP/pr-err"; then
            cat "$RUNNER_TEMP/pr-err"
            if ! grep -qi "already exists" "$RUNNER_TEMP/pr-err"; then
              echo "::error::릴리스 PR 생성 실패 — '이미 존재함'이 아닌 에러라 경합으로 보지 않는다"
              exit 1
            fi
            raced=$(gh pr list --repo "$REPO" --base "$TARGET" --head "$BASE" --state open \
                      --json number --jq '(.[0].number // empty)')
            if [ -z "$raced" ]; then
              echo "::error::릴리스 PR 생성 실패 — 열린 PR도 없다"; exit 1
            fi
            gh pr edit "$raced" --repo "$REPO" --title "$title" --body-file "$RUNNER_TEMP/release-body.md"
            echo "경합 감지 — 이미 열린 #$raced 을 갱신했다"
          else
            echo "릴리스 PR 생성"
          fi

      # ── 이 머지로 충돌하게 된 PR 부르기 ──────────────────────────────────────
      # **머지는 다른 PR을 깨뜨리는 사건이다.** 그런데 충돌은 실패 체크를 만들지 않는다 —
      # `mergeable`이 CONFLICTING이 될 뿐이고 auto-merge는 그냥 안 켜진다. 빨간불도,
      # 담당자도, 라벨도 없어서 **PR 목록을 직접 열어보기 전엔 아무도 모른다**
      # (2026-09-16 확인: 이 저장소 어디에도 CONFLICTING을 보는 코드가 없었다).
      #
      # WIP 제한 1이 애초에 이 상황을 막지만 그 게이트는 `claude-agent`에만 있다. 사람이
      # 직접 연 PR은 밖이라 실제로 뚫렸다 — #72(에이전트)가 열려 있는 채 #73(사람)이 같은
      # 파일을 건드려 충돌했고, 하루 동안 아무 신호도 없었다.
      #
      # **자동 리베이스는 하지 않는다.** 리뷰 중인 브랜치를 기계가 다시 쓰면 사람이 고친
      # 커밋이 조용히 사라질 수 있다. 여기서는 부르기만 한다 — 어느 쪽을 살릴지는 diff를
      # 본 사람이 정한다.
      - name: 이 머지로 충돌하게 된 PR에 사람을 부른다
        id: conflicts
        if: ${{ !cancelled() && github.event.pull_request.merged == true && inputs.notify-handle != '' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.ref }}
          MERGED_PR: ${{ github.event.pull_request.number }}
          NOTIFY_HANDLE: ${{ inputs.notify-handle }}
        run: |
          set +e
          set -o pipefail

          # GitHub은 `mergeable`을 **비동기로** 계산한다. 머지 직후에는 거의 항상 UNKNOWN이고,
          # 그때 판정하면 충돌을 통째로 놓친다. UNKNOWN이 남아 있는 동안만 다시 물어본다.
          RETRY_COUNT=6
          RETRY_INTERVAL_SEC=10
          for i in $(seq 1 "$RETRY_COUNT"); do
            list=$(gh pr list --repo "$REPO" --base "$BASE" --state open \
                     --json number,mergeable,labels 2>/dev/null)
            [ -z "$list" ] && list="[]"
            unknown=$(printf '%s' "$list" | jq '[.[] | select(.mergeable == "UNKNOWN")] | length' 2>/dev/null)
            [ "$unknown" = "0" ] && break
            echo "mergeable 계산 대기 중 (UNKNOWN ${unknown}건, 시도 $i/$RETRY_COUNT)"
            [ "$i" -lt "$RETRY_COUNT" ] && sleep "$RETRY_INTERVAL_SEC"
          done

          # 충돌이 풀린 PR에서는 라벨을 뗀다. 안 떼면 낡은 라벨이 남아 다음 충돌 때
          # "이미 알렸다"로 판정돼 **진짜 충돌이 조용해진다**.
          printf '%s' "$list" \
            | jq -r '.[] | select(.mergeable == "MERGEABLE")
                         | select([.labels[].name] | any(. == "needs-rebase"))
                         | .number' 2>/dev/null \
            | while read -r n; do
                [ -z "$n" ] && continue
                gh pr edit "$n" --repo "$REPO" --remove-label needs-rebase >/dev/null 2>&1 \
                  && echo "#$n 충돌 해소됨 — needs-rebase 제거"
              done

          # 라벨이 곧 멱등 표식이다. 코멘트 마커를 쓰지 않는 이유: 충돌은 머지마다 다시
          # 판정되므로 마커를 커밋 SHA에 묶으면 같은 충돌로 매번 다시 부르게 된다.
          targets=$(printf '%s' "$list" \
            | jq -r '.[] | select(.mergeable == "CONFLICTING")
                         | select([.labels[].name] | any(. == "needs-rebase") | not)
                         | .number' 2>/dev/null)

          if [ -z "$targets" ]; then
            echo "새로 충돌한 PR 없음"
            exit 0
          fi

          for n in $targets; do
            # 라벨이 없는 저장소도 있다(`scripts/bootstrap-repo.sh`가 만든다). 실패해도
            # 멈추지 않되 흔적은 남긴다 — 라벨이 없으면 멱등성만 잃고 알림은 그대로 간다.
            if ! err=$(gh pr edit "$n" --repo "$REPO" --add-label needs-rebase 2>&1); then
              echo "::warning title=needs-rebase 라벨 부착 실패::PR #${n}: ${err}"
            fi
            if ! err=$(gh pr edit "$n" --repo "$REPO" --add-assignee "$NOTIFY_HANDLE" 2>&1); then
              echo "::warning title=담당자 지정 실패::PR #${n}에 @${NOTIFY_HANDLE} 지정 실패 — 충돌 알림이 사람에게 닿지 않았을 수 있다: ${err}"
            fi
            {
              printf '@%s\n\n' "$NOTIFY_HANDLE"
              printf '%s\n\n' "⚠️ **머지 충돌** \`[AGENT-ACTION-REQUIRED]\` — #${MERGED_PR}이 \`${BASE}\`에 머지되면서 이 PR이 충돌 상태가 됐습니다."
              printf '%s\n\n' "충돌은 체크를 빨갛게 만들지 않아서 auto-merge가 **조용히** 멈춥니다. 자동 리베이스는 하지 않습니다 — 리뷰 중인 커밋을 기계가 다시 쓰면 고친 것이 사라질 수 있어, 어느 쪽을 살릴지는 diff를 본 사람이 정해야 합니다."
              printf '%s\n' "해소하면 다음 머지 때 \`needs-rebase\` 라벨이 자동으로 떨어집니다."
            } | gh pr comment "$n" --repo "$REPO" --body-file -
            echo "#$n 충돌 — 라벨·담당자·코멘트 완료"
          done

      # 스텝을 합치며 잡 단위 성공/실패 가시성을 잃었다(PR #24 리뷰 지적, #26) — 스텝
      # 하나만 실패해도 잡 전체가 빨간 X가 되어, 로그를 열기 전엔 어느 정리가 실패했는지
      # 알 수 없다. 여기서 스텝별 outcome을 모아 요약에 남긴다.
      - name: 정리 결과 요약 (실패한 스텝 표시)
        if: always()
        env:
          NOTIFY: ${{ steps.notify.outcome }}
          CLOSE_ISSUES: ${{ steps.close-issues.outcome }}
          DELETE_BRANCH: ${{ steps.delete-branch.outcome }}
          DRAIN_QUEUE: ${{ steps.drain-queue.outcome }}
          RELEASE_PR: ${{ steps.release-pr.outcome }}
          CONFLICTS: ${{ steps.conflicts.outcome }}
        run: |
          set -euo pipefail

          failed=""
          for pair in "머지 알림:$NOTIFY" "이슈 닫기:$CLOSE_ISSUES" "브랜치 삭제:$DELETE_BRANCH" "큐 구동:$DRAIN_QUEUE" "릴리스 PR:$RELEASE_PR" "충돌 알림:$CONFLICTS"; do
            name="${pair%%:*}"
            outcome="${pair#*:}"
            if [ "$outcome" = "failure" ]; then
              failed="${failed}${failed:+, }$name"
            fi
          done

          if [ -n "$failed" ]; then
            echo "::error::뒷정리 중 실패: $failed (나머지 스텝은 서로 독립이라 그대로 진행됨)"
            echo "### ⚠️ 뒷정리 일부 실패: $failed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ✅ 뒷정리 전부 성공(또는 조건 미충족으로 스킵)" >> "$GITHUB_STEP_SUMMARY"
          fi
