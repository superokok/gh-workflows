name: After merge (issue close · branch cleanup) (reusable)

# develop 대상 PR이 머지된 뒤의 뒷정리. **머지 주체(auto-merge / 사람)와 무관하게** 돈다.
#
# 왜 별도 워크플로우인가 (2026-09-05):
# 두 뒷정리가 원래 auto-merge.yml 안에만 있었다(이슈 close, --delete-branch). 그래서
# **자동 머지된 PR만** 정리되고, 사람이 UI에서 머지한 PR은 이슈가 열린 채로, 브랜치가
# 남은 채로 방치됐다 — 그런데 사람이 머지하는 건 정확히 위험 경로 PR(auth·api/admin·
# scripts·워크플로우)이라, 가장 중요한 작업일수록 뒷정리가 안 되는 구조였다.
# 실측: 이슈 #110·#116이 PR #141·#142 머지 후에도 OPEN, 브랜치 3개가 잔류.
#
# repo 설정 `delete_branch_on_merge`를 켜는 방법도 있으나 **쓰면 안 된다** — 그 설정은
# 머지된 PR의 head 브랜치를 무조건 지워서, `develop`→`main` 릴리스 PR을 머지하는 순간
# **`develop` 자체가 삭제된다**(2026-09-05 실제로 겪고 복구함). 여기서 base=develop인
# PR만, 그리고 develop/main은 이름으로도 한 번 더 막고 지운다.
#
# GitHub이 이슈를 알아서 안 닫아주는 이유: close 키워드 자동 처리는 **default 브랜치(main)로
# 머지될 때만** 동작한다. 이 저장소의 작업 머지 대상은 develop이라 해당되지 않는다.
#
# auto-merge.yml에도 같은 두 로직이 남아 있는데 의도적이다 — 이미 닫힌 이슈를 닫거나
# 이미 없는 브랜치를 지우는 건 무해하고(no-op), 어느 한쪽이 안 돌아도 방치되지 않는다.

on:
  workflow_call:
    inputs:
      base-branch:
        description: 뒷정리 대상 PR의 base. 통합 브랜치가 없으면 "main"
        type: string
        default: "develop"

jobs:
  # **네 가지 뒷정리를 한 잡에서 스텝으로 한다.** 예전엔 잡 4개였는데, GitHub Actions는
  # **잡마다 분 단위로 올림 과금**해서 각 스텝이 3초여도 4분이 나갔다(2026-09-09 실측:
  # 이 워크플로우 11회 실행에 34분 — 실제 작업 시간은 그 몇 분의 일이다).
  # 전부 `gh` API를 몇 번 부르는 게 전부라 병렬로 얻을 게 없다.
  #
  # 순서: 알림 → 이슈 닫기 → 브랜치 삭제 → 큐 구동. drain-queue는 마지막이어야
  # PR 상태가 정리된 뒤 "판이 비었는지"를 본다.
  #
  # **각 스텝은 `!cancelled()`로 서로 독립이다.** 잡이 넷일 땐 하나가 실패해도 나머지가
  # 돌았는데, 스텝으로 합치면 기본값(`success()`)이라 앞이 실패하면 뒤가 통째로 스킵된다.
  # 뒷정리끼리는 의존이 없다 — 알림이 실패해도 브랜치는 지워지고 큐는 돌아야 한다.
  #
  # **잡 조건에 `merged == true`를 걸지 않는다**(2026-09-10). 앞의 세 스텝(알림·이슈 닫기·
  # 브랜치 삭제)은 머지됐을 때만 의미가 있어서 각자 판정하지만, **마지막 `drain-queue`는
  # 머지 없이 닫힌 PR 뒤에도 돌아야 한다.** 잡 단위로 막아두면 PR을 그냥 닫거나 취소했을 때
  # 큐가 **조용히 멈춘다** — `agent-queued` 이슈들이 아무도 깨우지 않는 채 남고, 그게 정상과
  # 구별되지 않는다(감사 L08). 판이 비었는지는 스텝 안에서 어차피 다시 확인한다.
  after-merge:
    # 닫힌 PR에서만. 두 호출부 모두 `pull_request: types: [closed]`로 부르지만, 다른 트리거로
    # 잘못 연결됐을 때 뒷정리가 엉뚱한 시점에 도는 걸 여기서 한 번 더 막는다.
    if: github.event.pull_request.state == 'closed'
    runs-on: ubuntu-latest
    # GitHub Actions는 permissions를 job(워크플로우) 단위로만 선언할 수 있어 스텝별로
    # 좁힐 수 없다 — 예: 코멘트만 게시하면 되는 스텝도 실행 중엔 이슈 닫기·브랜치 삭제
    # 권한까지 쥔 GITHUB_TOKEN을 받는다(PR #24 리뷰 지적, #26). 스텝마다 job을 새로
    # 쪼개면 이 파일을 한 잡으로 합친 이유(잡 단위 올림 과금, 4잡→1잡으로 34분→~11분)가
    # 그대로 되살아나므로, 재검토 후 이 job에 실제로 필요한 최소 합집합만 유지하기로
    # 했다 — 세 권한 모두 이 job의 어느 한 스텝에는 실제로 필요하다.
    permissions:
      contents: write        # 브랜치 삭제
      issues: write          # 이슈 닫기 · 큐 라벨
      pull-requests: write   # 머지 알림 코멘트
    steps:
      # ── 자격증명: PAT가 아니라 GitHub App 설치 토큰 ──────────────────────────
      # App은 private key라 **만료가 없고**, 설치를 "All repositories"로 두면 새 저장소가
      # 자동으로 포함돼 저장소 목록을 갱신할 일이 없다. fine-grained PAT가 강제하던 1년
      # 교체와 저장소별 접근 목록 관리가 둘 다 사라진다.
      #
      # **자동 GITHUB_TOKEN과 달리 App 토큰으로 만든 이벤트는 다른 워크플로우를 트리거한다.**
      # 이 루프가 PAT를 쓰던 이유가 정확히 그거였고(라벨·머지·push가 다음 워크플로우를 깨워야
      # 한다), App은 그 성질을 그대로 갖는다.
      #
      # App에 줘야 하는 권한: Contents / Pull requests / Issues / **Workflows** = write.
      # Workflows가 없으면 `.github/workflows/*` 커밋이 거부된다 — Claude GitHub App 설치
      # 토큰을 못 쓰고 PAT로 갔던 원래 이유가 이것이다(ADR 0007 "알려진 제약").
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}

      - name: 머지 완료 코멘트(Gmail 알림용 태그 포함)
        id: notify
        if: ${{ !cancelled() && github.event.pull_request.merged == true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          # 이 잡 자체가 같은 PR에 대해 여러 이벤트로 다시 돌 수 있으니(재실행 등) 방어적으로
          # 중복 방지는 남겨둔다 — 더 이상 다른 워크플로우와 경합하기 위한 것은 아니다.
          if gh pr view "$PR" --repo "$REPO" --json comments --jq '.comments[].body' \
               | grep -qF '[AGENT-MERGED]'; then
            echo "이미 [AGENT-MERGED] 코멘트가 있음 — 스킵"
            exit 0
          fi

          if [ "$BASE" = "main" ]; then
            detail="운영(main)에 반영됐습니다. 배포와 DB 마이그레이션이 이어서 돕니다."
          else
            # 운영에 안 나간 누적 건수를 이 메일에 얹는다(auto-merge.yml과 동일한 이유):
            # 릴리스 PR은 알림을 보내지 않으므로, "쌓이고 있다"는 신호는 사용자가 이미
            # 열어보는 이 메일이 유일하게 전달한다.
            # `2>/dev/null`을 쓰지 않는다 — 예전엔 이게 stderr만 버려서, 권한 부족으로 온
            # **에러 JSON이 그대로 값이 됐다.** 실제 코멘트 본문이
            # `운영에 안 나간 변경 **{"message":"Resource not accessible by integration",...}건**`
            # 이었고, 도입(2026-09-05) 이래 정상 분기가 한 번도 실행된 적이 없었다.
            # 잡은 초록으로 끝나 `gh run list` 브리핑으로도 안 잡혔다(감사 L51).
            # 이제 실패는 잡 로그에 보이고, **숫자 검증**이 어떤 실패 경로에서도 본문 오염을 막는다.
            unreleased=$(gh api "repos/$REPO/compare/main...$BASE" --jq '.ahead_by') || unreleased=""
            case "$unreleased" in ''|*[!0-9]*) unreleased="" ;; esac

            if [ -n "$unreleased" ] && [ "$unreleased" != "0" ]; then
              detail="\`$BASE\`에 반영됐습니다. 운영에 안 나간 변경 **${unreleased}건** — 배포는 develop→main 릴리스 PR에서."
            else
              detail="\`$BASE\`에 반영됐습니다. 운영 반영은 develop→main 릴리스에서 따로 진행합니다."
            fi
          fi

          printf '%s\n\n%s\n\n%s\n' \
            "✅ **머지 완료** \`[AGENT-MERGED]\`" \
            "\`$HEAD_REF\` → \`$BASE\`" \
            "$detail" \
            | gh pr comment "$PR" --repo "$REPO" --body-file -

      - name: 본문의 close 키워드로 연결된 이슈 닫기
        id: close-issues
        if: ${{ !cancelled() && github.event.pull_request.merged == true && github.event.pull_request.base.ref == inputs.base-branch }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          issues=$(printf '%s' "$BODY" \
                     | grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?) +#[0-9]+' \
                     | grep -oE '[0-9]+' | sort -u || true)
          if [ -z "$issues" ]; then echo "PR #$PR 본문에 연결된 이슈 없음 — 스킵"; exit 0; fi

          for i in $issues; do
            state=$(gh issue view "$i" --repo "$REPO" --json state --jq .state 2>/dev/null || echo MISSING)
            case "$state" in
              OPEN)
                echo "closing #$i"
                gh issue close "$i" --repo "$REPO" \
                  --comment "develop에 반영됨 (PR #$PR). 운영 반영은 develop→main 릴리스에서." || true ;;
              CLOSED)  echo "#$i 이미 닫힘 — 스킵" ;;
              *)       echo "#$i 조회 실패($state) — 스킵" ;;
            esac
          done

      - name: 머지된 작업 브랜치 삭제
        id: delete-branch
        if: ${{ !cancelled() && github.event.pull_request.merged == true && github.event.pull_request.base.ref == inputs.base-branch && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref != inputs.base-branch && github.event.pull_request.head.ref != 'main' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          # if 조건에서 이미 걸렀지만, 이 스텝만 재사용/복사될 경우를 대비한 마지막 방어선.
          # 장수 브랜치를 지우는 사고는 복구가 번거롭다(2026-09-05 develop 삭제 사례).
          case "$BRANCH" in
            develop|main) echo "장수 브랜치($BRANCH) — 절대 삭제하지 않는다"; exit 0 ;;
          esac

          if ! gh api "repos/$REPO/git/refs/heads/$BRANCH" >/dev/null 2>&1; then
            echo "$BRANCH 이미 없음(auto-merge가 --delete-branch로 지움) — 스킵"; exit 0
          fi

          gh api -X DELETE "repos/$REPO/git/refs/heads/$BRANCH"
          echo "삭제됨: $BRANCH"

      # ── WIP 제한 1의 큐 구동기 ────────────────────────────────────────────
      # 에이전트도 리뷰도 열린 PR이 있으면 착수하지 않고 `agent-queued`로 대기시킨다
      # (claude-agent.yml · claude-review.yml). 그 대기를 푸는 게 이 스텝이다 — PR이
      # 닫혀 판이 비면 가장 오래 기다린 이슈 하나를 `agent`로 돌린다.
      #
      # **머지된 PR뿐 아니라 그냥 닫힌 PR 뒤에도 돈다**(감사 L08). 머지만 조건으로 걸면
      # PR을 취소했을 때 큐가 조용히 멈추고, 멈춘 건 정상과 구별되지 않는다.
  #
  # 이게 없으면 사용자가 다시 스케줄러가 된다. 대기시키는 것까지만 자동화하고
  # 깨우는 걸 사람에게 넘기면, 2026-09-07에 고친 문제(`agent` 라벨을 사람이
  # 붙여야만 시작되던 것)를 형태만 바꿔 되살리는 셈이다.
  #
  # 하나만 깨운다. 여러 개를 한꺼번에 풀면 WIP 제한이 무의미해진다.
      - name: 판이 비었으면 대기 중인 이슈 하나를 깨운다
        id: drain-queue
        if: ${{ !cancelled() }}
        env:
          # PAT를 쓴다 — GITHUB_TOKEN이 붙인 라벨은 `issues: labeled` 이벤트로
          # 다른 워크플로우를 깨우지 않아(GitHub 플랫폼 제약), claude-agent가 안 돈다.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ inputs.base-branch }}
        run: |
          set -euo pipefail

          # remove-label → add-label 사이는 원자적이지 않다. 그 사이 gh API 호출이
          # 일시적으로 실패하면 이슈가 양쪽 라벨 다 없는 채로 큐에서 영구히 빠진다.
          # add-label은 재시도하고, 그래도 실패하면 직전 라벨로 되돌리며 시끄럽게 알린다.
          add_label_with_retry() {
            local issue="$1" label="$2" attempts=5 delay=3 n=1
            until gh issue edit "$issue" --repo "$REPO" --add-label "$label"; do
              if [ "$n" -ge "$attempts" ]; then return 1; fi
              echo "라벨 부착 실패 (#$issue → $label), ${delay}초 후 재시도 ($n/$attempts)"
              sleep "$delay"
              n=$((n + 1))
              delay=$((delay * 2))
            done
          }

          # 릴리스 PR(base=main)은 항상 열려 있으므로 세지 않는다 — 세면 큐가 영원히 안 풀린다.
          open=$(gh pr list --repo "$REPO" --base "$BASE" --state open --json number --jq 'length')
          if [ "$open" != "0" ]; then
            echo "아직 열린 $BASE PR $open건 — 큐를 풀지 않는다"; exit 0
          fi

          next=$(gh issue list --repo "$REPO" --state open --label agent-queued                    --json number,createdAt --jq 'sort_by(.createdAt) | (.[0].number // empty)')

          if [ -n "$next" ]; then
            echo "큐에서 #$next 를 깨운다"
            gh issue edit "$next" --repo "$REPO" --remove-label agent-queued
            # 댓글은 부가 정보일 뿐이니 실패해도 라벨 복구를 막지 않는다.
            gh issue comment "$next" --repo "$REPO"               --body "앞 PR이 닫혀 판이 비었습니다 — 이어서 착수합니다." || echo "댓글 실패 — 계속 진행"
            # 라벨 부착이 claude-agent.yml을 깨운다. 마지막에 붙인다.
            if ! add_label_with_retry "$next" agent; then
              echo "::error::#$next 에 agent 라벨을 붙이지 못했다 — agent-queued로 되돌린다"
              gh issue edit "$next" --repo "$REPO" --add-label agent-queued || true
              gh issue comment "$next" --repo "$REPO"                 --body "⚠️ 큐 재개 중 agent 라벨 부착에 실패해 agent-queued로 되돌렸습니다. 다음 판이 빌 때 다시 시도됩니다." || true
              exit 1
            fi
            exit 0
          fi

          # 큐가 비었으면 **정지한 `agent` 이슈**를 되살린다.
          # claude-agent는 저장소당 하나만 도는데 GitHub의 대기 슬롯은 하나뿐이라, 세 번째
          # 실행이 오면 두 번째 대기 실행이 취소된다. 그 이슈는 `agent` 라벨만 남고 아무 일도
          # 일어나지 않는다 — 라벨이 이미 붙어 있어 `issues: labeled`가 다시 나지도 않는다.
          # 에이전트가 턴 상한·타임아웃으로 끊긴 경우도 같은 모양이다.
          #
          # 라벨을 뗐다 붙여 이벤트를 다시 낸다. 열린 PR이 있으면 위에서 이미 빠져나갔으므로,
          # 여기 오는 건 "판이 비었는데 착수가 안 된" 이슈뿐이다.
          stalled=$(gh issue list --repo "$REPO" --state open --label agent                       --json number,createdAt --jq 'sort_by(.createdAt) | (.[0].number // empty)')
          if [ -z "$stalled" ]; then echo "대기 중인 이슈 없음"; exit 0; fi

          echo "정지한 것으로 보이는 #$stalled 를 되살린다"
          gh issue edit "$stalled" --repo "$REPO" --remove-label agent
          sleep 2
          if ! add_label_with_retry "$stalled" agent; then
            echo "::error::#$stalled 에 agent 라벨을 다시 붙이지 못했다 — 라벨이 빠진 채로 남았다"
            gh issue comment "$stalled" --repo "$REPO"               --body "⚠️ 정지 복구 중 agent 라벨 재부착에 실패했습니다. 라벨이 빠진 채로 남아있으니 수동 확인이 필요합니다." || true
            exit 1
          fi

      # 스텝을 합치며 잡 단위 성공/실패 가시성을 잃었다(PR #24 리뷰 지적, #26) — 스텝
      # 하나만 실패해도 잡 전체가 빨간 X가 되어, 로그를 열기 전엔 어느 정리가 실패했는지
      # 알 수 없다. 여기서 스텝별 outcome을 모아 요약에 남긴다.
      - name: 정리 결과 요약 (실패한 스텝 표시)
        if: always()
        env:
          NOTIFY: ${{ steps.notify.outcome }}
          CLOSE_ISSUES: ${{ steps.close-issues.outcome }}
          DELETE_BRANCH: ${{ steps.delete-branch.outcome }}
          DRAIN_QUEUE: ${{ steps.drain-queue.outcome }}
        run: |
          set -euo pipefail

          failed=""
          for pair in "머지 알림:$NOTIFY" "이슈 닫기:$CLOSE_ISSUES" "브랜치 삭제:$DELETE_BRANCH" "큐 구동:$DRAIN_QUEUE"; do
            name="${pair%%:*}"
            outcome="${pair#*:}"
            if [ "$outcome" = "failure" ]; then
              failed="${failed}${failed:+, }$name"
            fi
          done

          if [ -n "$failed" ]; then
            echo "::error::뒷정리 중 실패: $failed (나머지 스텝은 서로 독립이라 그대로 진행됨)"
            echo "### ⚠️ 뒷정리 일부 실패: $failed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ✅ 뒷정리 전부 성공(또는 조건 미충족으로 스킵)" >> "$GITHUB_STEP_SUMMARY"
          fi
