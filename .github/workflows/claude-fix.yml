name: Claude Fix (red build → 수정 커밋) (reusable)

# 자가 치유 게이트 (docs/adr/0010-merge-gates.md).
# develop 대상 PR의 기계적 게이트(`check` / `Vercel` 빌드 / `smoke`)가 빨간불이면
# 사람에게 넘기지 않고 **작성자인 에이전트가 직접 고친다** — PR 작성자가 자기 빨간불을
# 고친다는 원칙 그대로다(여기선 작성자가 에이전트).
#
# 자동 수정하지 않는 것:
#   - 리뷰 고위험 finding → 판단이 필요하다. claude-review.yml이 do-not-merge를 붙이고 사람이 본다
#   - 시도 2회를 넘긴 실패 → 무한 재시도는 표준이 아니다. do-not-merge를 붙이고 [AGENT-ACTION-REQUIRED] 태그로 사람에게 인계
#     (여기가 "Claude 몴 → 사람 몴"으로 넘어가는 지점이다)
#   - lint 실패 → CI에서 비차단(continue-on-error)이라 워크플로우가 빨간불이 안 된다
#
# 라벨(do-not-merge)이 붙어 있어도 수정은 한다 — 라벨은 "머지를 막는" 신호지 "고치지 말라"가
# 아니다. 위험 경로 PR도 빨간불은 고쳐두는 편이 사람이 리뷰하기 좋다.

on:
  workflow_call:
    inputs:
      base-branch:
        description: |
          고칠 PR의 base. 통합 브랜치가 없으면 "main". (#60) 이 값이 없이 "develop"으로
          하드코딩돼 있던 시절엔, 통합 브랜치가 없는 저장소(`base=main`)에서는 대상 PR을
          영원히 못 찾아 self-fix가 조용히 아무 일도 안 했다.
        type: string
        default: "develop"
      node-version:
        type: string
        default: "22"
      java-version:
        description: JVM 빌드가 있는 프로젝트만 넘긴다 (예 "21"). 빈 문자열이면 건너뜀
        type: string
        default: ""
      java-distribution:
        description: setup-java의 distribution. java-version이 빈 문자열이면 무시된다
        type: string
        default: "temurin"
      # claude-agent.yml·check.yml과 같은 규칙: **커맨드 문자열 입력이고, 빈 문자열이면
      # 그 단계를 건너뛴다.** 여기만 하드코딩으로 남아 있었다 — Node + Prisma가 아닌
      # 저장소에서는 에이전트가 시작조차 못 하고 죽는다(한 소비 저장소에서 claude-agent가
      # 정확히 그렇게 죽었다: prisma가 없으니 `npx`가 최신 rc를 받아왔고 거기엔
      # `generate`가 없어 exit 2). 기본값은 지금 동작 그대로라 기존 호출부는 무변화다.
      # setup-node는 (claude-agent.yml과 같은 이유로) `node-version`이 아니라 `install`로
      # 껐다 켠다 — install → prepare → verify가 순차 파이프라인이라 Node 셋업만 따로
      # 끊으면 어중간한 상태가 남는다. setup-java는 그 파이프라인과 무관하게 독립적이다.
      install:
        description: 의존성 설치. 빈 문자열이면 Node 셋업까지 통째로 건너뜀 (YAML만 있는 저장소)
        type: string
        default: "npm ci"
      prepare:
        description: 설치 직후 준비 단계 (코드 생성 등). 빈 문자열이면 건너뜀
        type: string
        default: "npx prisma generate"
      verify:
        description: 수정 후 통과를 확인할 커맨드. 빈 문자열이면 자동 검증 없음
        type: string
        default: "npm run check"
      build:
        description: |
          Vercel 빌드 실패를 러너에서 재현할 커맨드. 빈 문자열이면 그 안내를 넣지 않는다
          (Vercel 프리뷰가 없는 저장소는 `status` 트리거 자체가 오지 않는다)
        type: string
        default: "npm run build"
      notify-handle:
        description: |
          자동 수정을 포기하고 사람에게 넘길 때 담당자로 지정할 GitHub 핸들(예: "octocat").
          빈 문자열(기본값)이면 지정하지 않는다 — 기존 호출부는 무변화. (이슈 #46)
        type: string
        default: ""

concurrency:
  group: claude-fix-${{ github.event.workflow_run.head_sha || github.event.sha }}
  cancel-in-progress: false

jobs:
  fix:
    # `github.actor != 'dependabot[bot]'`가 바깥에 한 번 더 걸린다 — Dependabot이 트리거한
    # 실행에는 시크릿이 안 와서 App 토큰 발급부터 죽는다(`claude-review.yml`의 같은 조건
    # 주석 참고). 고칠 수도 없으면서 빨간불만 남기는 실행을 아예 깨우지 않는다.
    # 의존성 PR의 빨간불은 사람이 본다 — 버전을 내리든 닫든 판단이 필요한 종류다.
    if: >-
      github.actor != 'dependabot[bot]' &&
      ((github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'status' && github.event.context == 'Vercel' &&
       (github.event.state == 'failure' || github.event.state == 'error')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read      # 실패한 run의 로그를 읽는다
    env:
      DOTENV_PRIVATE_KEY: ${{ secrets.DOTENV_PRIVATE_KEY }}
    steps:
      # ── 자격증명: PAT가 아니라 GitHub App 설치 토큰 ──────────────────────────
      # App은 private key라 **만료가 없고**, 설치를 "All repositories"로 두면 새 저장소가
      # 자동으로 포함돼 저장소 목록을 갱신할 일이 없다. fine-grained PAT가 강제하던 1년
      # 교체와 저장소별 접근 목록 관리가 둘 다 사라진다.
      #
      # **자동 GITHUB_TOKEN과 달리 App 토큰으로 만든 이벤트는 다른 워크플로우를 트리거한다.**
      # 이 루프가 PAT를 쓰던 이유가 정확히 그거였고(라벨·머지·push가 다음 워크플로우를 깨워야
      # 한다), App은 그 성질을 그대로 갖는다.
      #
      # `app-id`(숫자)가 아니라 `client-id`를 쓴다. v3의 권장이기도 하지만, 실질적인 이유는
      # **App ID와 Installation ID가 둘 다 숫자라 구별이 안 된다**는 것이다. 설치 화면 URL의
      # 숫자를 App ID로 착각해 넣으면 JWT의 iss가 앱을 가리키지 않아
      # `A JSON web token could not be decoded`로 죽는다(2026-09-11 실제로 겪었다).
      # Client ID는 `Iv23…` 형태라 그 착각이 성립하지 않는다.
      #
      # App에 줘야 하는 권한: Contents / Pull requests / Issues / **Workflows** = write.
      # Workflows가 없으면 `.github/workflows/*` 커밋이 거부된다 — Claude GitHub App 설치
      # 토큰을 못 쓰고 PAT로 갔던 원래 이유가 이것이다(ADR 0007 "알려진 제약").
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.AGENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}

      # ── 고칠 대상인지 판정 (PR 찾기 + 시도 횟수 상한) ────────────────────────
      - name: 대상 판정
        id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha || github.event.sha }}
          BASE: ${{ inputs.base-branch }}
          NOTIFY_HANDLE: ${{ inputs.notify-handle }}
        run: |
          set -euo pipefail
          echo "run=false" >> "$GITHUB_OUTPUT"

          num=$(gh api "repos/$REPO/commits/$SHA/pulls" \
                  | jq -r --arg base "$BASE" \
                      '[.[] | select(.base.ref==$base and .state=="open")] | (.[0].number // empty)')
          if [ -z "$num" ]; then echo "$BASE 대상 열린 PR 없음 — 스킵"; exit 0; fi

          info=$(gh pr view "$num" --repo "$REPO" --json headRefName,headRefOid,isDraft)
          head=$(jq -r .headRefOid  <<<"$info")
          ref=$(jq -r .headRefName  <<<"$info")
          draft=$(jq -r .isDraft    <<<"$info")
          if [ "$head" != "$SHA" ]; then echo "더 새 커밋이 있음 — 낡은 이벤트, 스킵"; exit 0; fi
          if [ "$draft" = "true" ]; then echo "draft — 스킵"; exit 0; fi

          # 시도 상한 2회. 코멘트 마커로 센다(PR 단위 누적)
          tries=$(gh pr view "$num" --repo "$REPO" --json comments --jq '.comments[].body' \
                    | grep -cF '<!-- claude-fix:attempt -->' || true)
          echo "지금까지 자동 수정 시도: $tries"

          if [ "$tries" -ge 2 ]; then
            gh pr edit "$num" --repo "$REPO" --add-label do-not-merge || true
            # 지정 실패를 삼키되 흔적은 남긴다(#51). 담당자 지정은 watch 설정으로 끌 수 없는
            # 유일한 알림 경로라, 조용히 실패하면 자동 수정을 포기한 PR이 아무도 모르는 채
            # 방치된다. job을 세우지는 않는다 — 바로 뒤의 "포기" 코멘트가 남은 알림이다.
            if [ -n "$NOTIFY_HANDLE" ]; then
              if ! assign_err=$(gh pr edit "$num" --repo "$REPO" --add-assignee "$NOTIFY_HANDLE" 2>&1); then
                echo "::warning title=담당자 지정 실패::PR #${num}에 @${NOTIFY_HANDLE} 담당자 지정 실패 — 자동 수정 포기 알림이 사람에게 닿지 않았을 수 있다: ${assign_err}"
                if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
                  printf '⚠️ PR #%s 담당자 지정 실패(`@%s`): %s\n' "$num" "$NOTIFY_HANDLE" "$assign_err" >> "$GITHUB_STEP_SUMMARY"
                fi
              fi
            fi
            if ! gh pr view "$num" --repo "$REPO" --json comments --jq '.comments[].body' \
                 | grep -qF '<!-- claude-fix:gave-up -->'; then
              {
                if [ -n "$NOTIFY_HANDLE" ]; then
                  printf '@%s\n\n' "$NOTIFY_HANDLE"
                fi
                printf '%s\n\n%s\n' \
                  '🛑 **자동 수정 2회 실패** `[AGENT-ACTION-REQUIRED]` — 사람이 봐야 합니다. 실패한 워크플로우 로그를 확인해주세요.' \
                  '<!-- claude-fix:gave-up -->'
              } | gh pr comment "$num" --repo "$REPO" --body-file -
            fi
            echo "상한 초과 — 사람에게 인계"; exit 0
          fi

          printf '%s\n\n%s\n' \
            "🔧 빨간불을 감지해 자동 수정을 시작합니다 ($((tries+1))/2)." \
            '<!-- claude-fix:attempt -->' \
            | gh pr comment "$num" --repo "$REPO" --body-file -

          {
            echo "run=true"
            echo "pr=$num"
            echo "ref=$ref"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.target.outputs.run == 'true'
        with:
          fetch-depth: 0
          ref: ${{ steps.target.outputs.ref }}
          # 수정 커밋을 PR 브랜치에 push한다. .github/workflows/*도 고칠 수 있어야 하므로
          # workflow 스코프 PAT (docs/adr/0007 "알려진 제약").
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup JDK
        if: steps.target.outputs.run == 'true' && inputs.java-version != ''
        uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: ${{ inputs.java-distribution }}
          cache: gradle
      - uses: actions/setup-node@v4
        if: steps.target.outputs.run == 'true' && inputs.install != ''
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - run: ${{ inputs.install }}
        if: steps.target.outputs.run == 'true' && inputs.install != ''
      - run: ${{ inputs.prepare }}
        if: steps.target.outputs.run == 'true' && inputs.install != '' && inputs.prepare != ''

      - uses: anthropics/claude-code-action@v1
        if: steps.target.outputs.run == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app-token.outputs.token }}
          # 봇이 push한 커밋(claude-agent가 연 PR 등)에서 도는 CI/Vercel이 workflow_run/status로
          # 이 job을 깨우면 그 이벤트의 actor도 봇이라 "Workflow initiated by non-human actor"로
          # 거부된다. 배경은 README.md "알아둘 것" 참고.
          allowed_bots: "claude,superokok-agent-ops"
          prompt: |
            PR #${{ steps.target.outputs.pr }} 의 게이트가 실패했다. 원인을 찾아 고친다.
            PR 브랜치(`${{ steps.target.outputs.ref }}`)가 ${{ inputs.install != '' && format('이미 체크아웃돼 있고 `{0}`도 끝났다', inputs.install) || '이미 체크아웃돼 있다 (의존성 설치 단계는 이 저장소에 없다)' }}.

            실패 신호: ${{ github.event_name == 'status' && 'Vercel 빌드 실패' || format('워크플로우 "{0}" 실패 (run id {1})', github.event.workflow_run.name, github.event.workflow_run.id) }}

            1. **원인부터 읽는다. 추측하지 않는다.**
               - 워크플로우 실패면: `gh run view ${{ github.event.workflow_run.id }} --log-failed`
               - Vercel 빌드 실패면: ${{ inputs.build != '' && format('러너에서 `{0}`로 직접 재현한다 (타입체크만으로는 `next build`를 대신하지 못한다 — RSC 경계, 동적 라우트 타입 등은 빌드에서만 터진다)', inputs.build) || '이 저장소엔 Vercel이 없다 — 이 항목은 무시한다' }}
               - Preview Smoke 실패면: 하이드레이션 실패나 pageerror다. 실패한 run의 로그에 남은
                 JSON에서 어떤 에러인지 보고, 그 화면을 렌더하는 컴포넌트를 고친다

            2. **이 PR이 만든 회귀만 최소 범위로 고친다.** 원인과 무관한 리팩터링·정리를 끼워
               넣지 않는다. 기존 부채라 이 PR 소관이 아니면 고치지 말고 3번으로 간다.

            3. **고칠 수 없으면 억지로 고치지 않는다.** 원인이 코드 밖(시크릿 누락, 외부 서비스
               장애, 인프라)이거나 판단이 필요하면:
                 gh pr edit ${{ steps.target.outputs.pr }} --add-label do-not-merge
                 gh pr comment ${{ steps.target.outputs.pr }} --body "<원인과 필요한 조치>"
               ${{ inputs.notify-handle != '' && format('담당자를 지정한다(watch 설정과 무관하게 알림이 간다): `gh pr edit {0} --add-assignee {1} || true`. 위 코멘트 본문 맨 앞줄에 `@{1}`을 넣는다.', steps.target.outputs.pr, inputs.notify-handle) || '' }}
               테스트를 지우거나 `skip` 처리하거나, 타입을 `any`로 덮거나, 게이트 자체를
               느슨하게 만드는 방식으로 초록불을 만드는 건 **금지**다.

            4. 고쳤으면 ${{ inputs.verify != '' && format('`{0}` 통과를 확인하고', inputs.verify) || '바꾼 파일이 형식적으로 유효한지 직접 확인하고(이 저장소엔 자동 검증 커맨드가 없다)' }} **같은 브랜치에 커밋해서 push**한다
               (`git switch`/`checkout`은 하지 않는다 — 이미 올바른 브랜치다). 커밋 메시지는
               `fix: <무엇을 왜>` 한 줄 + 무엇이 실패했는지. push하면 게이트가 다시 돌고,
               초록이면 `enable-auto-merge.yml`이 머지한다. `gh pr merge`는 부르지 않는다.

            5. 무엇을 고쳤는지 PR에 코멘트로 1~3줄 남긴다.
          claude_args: >-
            --max-turns 40
            --model claude-sonnet-5
            --allowedTools "Edit,Write,Read,Bash,Glob,Grep"
