name: Check (reusable)

# 빠른 검증 게이트. DB 없이 수초 안에 끝나는 것만 본다 —
# 빌드/프리뷰는 Vercel이 PR마다 이미 돌리므로 여기서 중복하지 않는다.
#
# 각 단계는 커맨드 문자열 입력이다. 빈 문자열("")을 넘기면 그 단계를 건너뛴다
# (예: Prisma를 안 쓰는 프로젝트는 prepare/schema-validate를 "").

on:
  workflow_call:
    inputs:
      # ── 툴체인 ──────────────────────────────────────────────────────────────
      # 명령 입력과 **같은 규칙**이다: 빈 문자열이면 그 설치 단계를 건너뛴다.
      # Node에 특권을 두지 않는다 — 예전엔 setup-node와 install이 무조건 돌아서,
      # `package.json`이 없는 프로젝트는 이 워크플로우를 아예 쓸 수 없었다.
      # 기본값이 예전 동작 그대로라(node "22" / java "") 기존 호출부는 바뀌지 않는다.
      node-version:
        description: 빈 문자열이면 setup-node를 건너뛴다 (JVM 전용 프로젝트)
        type: string
        default: "22"
      java-version:
        description: JVM 빌드가 있는 프로젝트만 넘긴다 (예 "21"). 빈 문자열이면 건너뜀
        type: string
        default: ""
      java-distribution:
        description: setup-java의 distribution. java-version이 빈 문자열이면 무시된다
        type: string
        default: "temurin"
      install:
        type: string
        default: "npm ci"
      prepare:
        description: 설치 직후 준비 단계 (코드 생성 등). 빈 문자열이면 건너뜀
        type: string
        default: "npx prisma generate"
      typecheck:
        type: string
        default: "npm run typecheck"
      test:
        type: string
        default: "npm run test"
      schema-validate:
        type: string
        default: "npx prisma validate"
      lint:
        description: |
          `check` job의 마지막 step으로 돈다(2026-09-10까지는 별도 job이었다).
          job을 나누면 `npm ci`가 두 번 돌고 **job마다 분 단위로 올림 과금**돼서, 실제 6초짜리
          lint가 매번 1분+@로 청구됐다(실측: 42 job / 실제 4.3분 / 청구 42분).
          같은 job에 붙이면 checkout·setup-node·install을 재사용하고 청구도 0에 가깝다.
          부수 효과로 이미 필수 체크인 `check / check`에 lint가 포함된다 — 예전엔
          `check / lint`가 필수가 아니라 빨개져도 아무것도 막지 못했다.
        type: string
        default: "npm run lint"
    secrets:
      DOTENV_PRIVATE_KEY:
        description: 커밋된 암호화 .env를 복호화(dotenvx). 안 쓰면 생략
        required: false

# 같은 PR에 새 커밋이 오면 앞선 실행을 취소한다 — 공식 권장형이다
# (docs: actions/…/control-workflow-concurrency). `head_ref`는 pull_request 이벤트에만
# 있으므로, push(develop/main)에서는 유일한 `run_id`로 떨어져 **서로 취소되지 않는다**.
# 호출부가 여럿이라(재사용 워크플로우) 그룹에 저장소 이름을 넣어 프로젝트끼리 섞이지 않게 한다.
#
# 왜 넣나(2026-09-07): GitHub Actions는 job마다 분 단위로 올림 과금한다. 이 워크플로우는
# 한 달에 156 run / 524분으로 최대 소모원이었는데, 연속 push하면 이미 낡은 커밋의 실행이
# 끝까지 돌고 있었다. 취소된 run의 `check` 결론은 `cancelled`가 되지만 auto-merge는 항상
# **head SHA**로 게이트를 보므로(낡은 SHA면 아예 스킵) 머지 판정에는 영향이 없다.
concurrency:
  group: check-${{ github.repository }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DOTENV_PRIVATE_KEY: ${{ secrets.DOTENV_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        if: inputs.node-version != ''
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      # 폴리글랏 저장소(예: Next.js 웹 + Gradle 백엔드)를 **한 job**에서 검사하려고 둔다.
      # 스택마다 워크플로우를 쪼개면 job이 늘고, Actions는 job 단위로 분을 올림 과금한다 —
      # `lint`를 별도 job에서 이 job의 step으로 내린 것과 같은 이유다.
      # setup-java의 gradle 캐시는 `**/*.gradle*`을 재귀로 해싱하므로 빌드가 하위
      # 디렉터리에 있어도(`backend/`) 잡힌다.
      - name: Setup JDK
        if: inputs.java-version != ''
        uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: ${{ inputs.java-distribution }}
          cache: gradle
      # `if`가 없으면 `install: ""`가 빈 `run:`이 되어 **스킵이 아니라 에러**로 떨어진다.
      # README는 처음부터 "빈 문자열이면 건너뜀"이라고 적고 있었지만 이 단계만 빠져 있었다.
      - name: Install
        if: inputs.install != ''
        run: ${{ inputs.install }}
      - name: Prepare
        if: inputs.prepare != ''
        run: ${{ inputs.prepare }}
      - name: Typecheck
        if: inputs.typecheck != ''
        run: ${{ inputs.typecheck }}
      - name: Unit tests
        if: inputs.test != ''
        run: ${{ inputs.test }}
      - name: Schema validate
        if: inputs.schema-validate != ''
        run: ${{ inputs.schema-validate }}
      # 마지막에 둔다 — typecheck·테스트가 먼저 빨개지는 게 진단에 더 유용하다.
      - name: Lint
        if: inputs.lint != ''
        run: ${{ inputs.lint }}
