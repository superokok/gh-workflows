name: Stale sweep (멈춘 PR·이슈 감지) (reusable)

# 이벤트 기반 자동화의 구조적 사각지대를 메운다.
#
# 이 시스템의 모든 게이트는 **이벤트로 깨어난다**(workflow_run / status / labeled).
# 그래서 "일어나야 할 이벤트가 영영 안 오는" 경우엔 아무 일도 안 일어나고, 아무도 모른다.
# auto-merge는 게이트가 `missing`이면 "아직 안 끝났나 보다"로 조용히 대기할 뿐이다.
#
# 실제 사고 (2026-09-07): 재사용 워크플로우 전환 후 Claude Review가 startup_failure로
# 죽어 `review` check-run이 아예 생기지 않았다 → auto-merge가 `review=missing`으로 영구
# 대기 → **3시간 동안 아무 PR도 머지되지 않았는데 알림이 하나도 안 갔다.** 자가치유
# (claude-fix)는 CI/Smoke만 감시해서 못 봤고, 자기도 같은 버그로 죽어 있었다.
#
# 여기서 보는 것 두 가지:
#   1. 멈춘 PR   — 마지막 push 후 N시간이 지났는데 아직 안 머지됨. 어느 게이트에서
#                  막혔는지 이름을 찍어준다
#   2. 좀비 이슈 — `agent` 라벨이 붙었는데 N시간째 PR이 안 생김 (에이전트가 턴 상한·
#                  타임아웃으로 죽었거나, 라벨 이벤트 자체가 유실된 경우)
#
# 알림은 [AGENT-ACTION-REQUIRED] 태그를 단다 — 여기까지 왔으면 자동화가 못 푸는 상황이다.
# 같은 상태로 반복해서 찌르지 않는다(마커로 1회만).

on:
  workflow_call:
    inputs:
      base-branch:
        description: 이 base를 향한 열린 PR만 본다
        type: string
        default: "develop"
      pr-stale-hours:
        description: 마지막 갱신 후 이 시간이 지나도 안 머지됐으면 멈춘 것으로 본다
        type: number
        default: 3
      issue-stale-hours:
        description: agent 라벨이 붙은 뒤 이 시간이 지나도 PR이 없으면 멈춘 것으로 본다
        type: number
        default: 6

jobs:
  sweep:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
      checks: read
      statuses: read
    steps:
      - name: 멈춘 PR·이슈 찾아 알리기
        env:
          # PAT를 쓴다 — GITHUB_TOKEN이 만든 코멘트는 사용자에게 메일이 안 갈 수 있고,
          # 이 워크플로우의 존재 이유가 정확히 "사람에게 도달하는 것"이다.
          GH_TOKEN: ${{ secrets.AGENT_WORKFLOW_TOKEN }}
          REPO: ${{ github.repository }}
          BASE: ${{ inputs.base-branch }}
          PR_STALE_H: ${{ inputs.pr-stale-hours }}
          ISSUE_STALE_H: ${{ inputs.issue-stale-hours }}
        run: |
          set -euo pipefail

          now=$(date -u +%s)

          # 같은 마커의 코멘트가 이미 있으면 다시 달지 않는다.
          # PR 마커에는 head SHA를 넣는다 — 새 커밋을 push하면 상태가 달라지므로 다시 알린다.
          comment_once() {  # $1=kind(pr|issue) $2=번호 $3=마커 $4=본문
            local kind="$1" num="$2" marker="$3" text="$4"
            if gh "$kind" view "$num" --repo "$REPO" --json comments --jq '.comments[].body' \
                 | grep -qF "$marker"; then
              echo "  #$num 이미 알림 있음 — 스킵"; return 0
            fi
            printf '%s\n\n%s\n' "$text" "$marker" | gh "$kind" comment "$num" --repo "$REPO" --body-file -
            echo "  #$num 알림 남김"
          }

          conclusion_of() {  # $1=SHA $2=check-run 이름 (재사용 워크플로우는 "잡 / 잡"이 된다)
            gh api "repos/$REPO/commits/$1/check-runs" --paginate \
              --jq "[.check_runs[] | select(.name==\"$2\" or (.name | endswith(\"/ $2\")))] | sort_by(.started_at) | (last // {}) | (.conclusion // (if (.status // \"\") == \"\" then \"missing\" else \"pending\" end))"
          }

          # ── 1. 멈춘 PR ────────────────────────────────────────────────────────
          echo "== 멈춘 PR 확인 (기준 ${PR_STALE_H}시간) =="
          prs=$(gh pr list --repo "$REPO" --base "$BASE" --state open \
                  --json number,updatedAt,isDraft,headRefOid,labels --limit 50)

          echo "$prs" | jq -c '.[]' | while read -r pr; do
            num=$(jq -r .number      <<<"$pr")
            upd=$(jq -r .updatedAt   <<<"$pr")
            draft=$(jq -r .isDraft   <<<"$pr")
            sha=$(jq -r .headRefOid  <<<"$pr")
            labels=$(jq -r '[.labels[].name] | join(",")' <<<"$pr")

            [ "$draft" = "true" ] && { echo "PR #$num draft — 스킵"; continue; }

            # do-not-merge는 이미 "사람이 봐야 함"으로 태그된 코멘트가 달려 있다. 중복으로 안 찌른다.
            case ",$labels," in
              *,do-not-merge,*) echo "PR #$num do-not-merge — 이미 사람 몫, 스킵"; continue ;;
            esac

            age=$(( (now - $(date -u -d "$upd" +%s)) / 3600 ))
            if [ "$age" -lt "$PR_STALE_H" ]; then echo "PR #$num ${age}시간 — 아직 이름"; continue; fi

            check=$(conclusion_of  "$sha" check)
            review=$(conclusion_of "$sha" review)
            smoke=$(conclusion_of  "$sha" smoke)
            vercel=$(gh api "repos/$REPO/commits/$sha/status" \
                       --jq '[.statuses[] | select(.context=="Vercel")] | sort_by(.updated_at) | (last // {}) | (.state // "missing")')

            echo "PR #$num ${age}시간 정지 — check=$check review=$review Vercel=$vercel smoke=$smoke"

            # 무엇이 막고 있는지 이름을 적는다. 알림이 행동으로 이어지려면 이게 있어야 한다.
            blockers=""
            for pair in "check:$check" "review:$review" "Vercel:$vercel" "smoke:$smoke"; do
              name="${pair%%:*}"; val="${pair#*:}"
              case "$val" in
                success|skipped|neutral) ;;
                *) blockers="${blockers}- \`${name}\` = **${val}**"$'\n' ;;
              esac
            done

            if [ -z "$blockers" ]; then
              detail=$'게이트는 **전부 초록인데 머지가 안 됐습니다.** `auto-merge`를 깨우는 이벤트가 유실됐을 수 있습니다 — Actions에서 `CI`를 재실행하면 다시 이어집니다.'
            else
              detail=$'막고 있는 게이트:\n\n'"$blockers"$'\n해당 워크플로우가 실패했거나 아예 실행되지 않았는지 Actions에서 확인해주세요. `missing`은 "실행 자체가 안 됨"이라 재실행이 필요합니다.'
            fi

            comment_once pr "$num" "<!-- stale-sweep:$sha -->" \
              "⏳ **${age}시간째 멈춰 있습니다** \`[AGENT-ACTION-REQUIRED]\`

          $detail"
          done

          # ── 2. 좀비 이슈 (agent 라벨인데 PR이 안 생김) ──────────────────────────
          echo "== 좀비 이슈 확인 (기준 ${ISSUE_STALE_H}시간) =="
          issues=$(gh issue list --repo "$REPO" --state open --label agent \
                     --json number,updatedAt,title --limit 50)

          echo "$issues" | jq -c '.[]' | while read -r is; do
            num=$(jq -r .number    <<<"$is")
            upd=$(jq -r .updatedAt <<<"$is")

            age=$(( (now - $(date -u -d "$upd" +%s)) / 3600 ))
            if [ "$age" -lt "$ISSUE_STALE_H" ]; then echo "이슈 #$num ${age}시간 — 아직 이름"; continue; fi

            # 이 이슈를 닫겠다고 선언한 열린 PR이 있으면 진행 중이다.
            linked=$(gh pr list --repo "$REPO" --state open --json number,body \
                       --jq "[.[] | select(.body | test(\"(?i)(close[sd]?|fix(e[sd])?|resolve[sd]?) +#$num\\\\b\"))] | length")
            if [ "$linked" != "0" ]; then echo "이슈 #$num 열린 PR 있음 — 진행 중"; continue; fi

            echo "이슈 #$num ${age}시간째 PR 없음 — 알림"
            comment_once issue "$num" "<!-- stale-sweep:no-pr -->" \
              "⏳ **\`agent\` 라벨이 붙은 뒤 ${age}시간째 PR이 없습니다** \`[AGENT-ACTION-REQUIRED]\`

          에이전트가 턴 상한·타임아웃으로 중간에 끊겼거나, 라벨 이벤트가 유실됐을 수 있습니다.
          Actions의 \`Claude Agent\` 실행 기록을 확인해주세요. 다시 돌리려면 이 이슈에 **\`@claude 이어서 해줘\`라고
          코멘트**하시면 됩니다 — \`agent\` 라벨은 이미 붙어 있어 다시 붙일 수 없습니다(같은 라벨은 이벤트가
          발생하지 않습니다). 라벨로 하시려면 뗐다가 다시 붙여야 합니다."
          done

          echo "sweep 완료"
