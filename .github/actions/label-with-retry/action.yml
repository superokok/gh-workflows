name: 라벨 부착/제거 재시도
description: >
  gh issue edit --add-label/--remove-label을 지수 백오프로 재시도한다.
  claude-agent.yml(wake-if-idle)과 after-merge.yml(drain-queue)이 각자 들고 있던
  동일한 재시도 함수를 한 곳으로 모은 것 — 실패 시 롤백 여부는 호출자가 결정한다
  (이 action은 재시도만 하고, 그래도 실패하면 그대로 실패로 끝난다).

inputs:
  github-token:
    description: gh CLI가 쓸 토큰 (GH_TOKEN)
    required: true
  repo:
    description: "owner/repo"
    required: true
  issue:
    description: 이슈 번호
    required: true
  label:
    description: 부착/제거할 라벨 이름
    required: true
  mode:
    description: "add 또는 remove"
    required: false
    default: add
  attempts:
    description: 최대 시도 횟수
    required: false
    default: "5"
  initial-delay-seconds:
    description: 첫 재시도 대기 초 (이후 매번 2배)
    required: false
    default: "3"

runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ inputs.repo }}
        ISSUE: ${{ inputs.issue }}
        LABEL: ${{ inputs.label }}
        MODE: ${{ inputs.mode }}
        ATTEMPTS: ${{ inputs.attempts }}
        DELAY: ${{ inputs.initial-delay-seconds }}
      run: |
        set -euo pipefail

        case "$MODE" in
          add) FLAG="--add-label" ;;
          remove) FLAG="--remove-label" ;;
          *) echo "::error::알 수 없는 mode: $MODE (add 또는 remove만 허용)"; exit 1 ;;
        esac

        n=1
        delay="$DELAY"
        until gh issue edit "$ISSUE" --repo "$REPO" "$FLAG" "$LABEL"; do
          if [ "$n" -ge "$ATTEMPTS" ]; then
            echo "::error::#$ISSUE 라벨 $MODE 실패 ($LABEL), ${ATTEMPTS}회 모두 소진"
            exit 1
          fi
          echo "라벨 $MODE 실패 (#$ISSUE → $LABEL), ${delay}초 후 재시도 ($n/$ATTEMPTS)"
          sleep "$delay"
          n=$((n + 1))
          delay=$((delay * 2))
        done
