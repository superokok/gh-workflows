name: Enable auto-merge

# 머지 게이트. 로직은 superokok/gh-workflows의 enable-auto-merge.yml에 있다 —
# 이 프로젝트는 트리거와 이 저장소 고유의 위험 경로만 소유한다.
#
# 머지 판정은 GitHub이 한다. 이 워크플로우가 하는 일은 "이 PR에 auto-merge를 켤까 말까"를
# 한 번 정하는 것뿐이고, 게이트 구성은 브랜치 보호의 required checks로 표현한다.
#
# 전제(저장소 설정 — 코드 아님):
#  - 브랜치 보호 `{{INTEGRATION_BRANCH}}`: required checks = {{REQUIRED_CHECKS}}
#    **check-run 이름 규칙이 두 가지라 섞이기 쉽다.** 재사용 워크플로우를 부르면
#    `<호출 잡> / <불린 잡>`이 되고(`review / review`), **job을 인라인으로 정의하면 job
#    이름 그대로**다(`backend` — 워크플로우 이름은 안 붙는다). `CI / backend`로 잡았다가
#    PR이 영구 Pending으로 막힌 적이 있다(2026-09-11 실측). 실제 이름은 PR의 체크
#    목록이나 `repos/{r}/commits/{sha}/check-runs`로 확인한다.
#  - required로는 **`pull_request`로 도는 것만** 넣는다. 안 도는 워크플로우를 넣으면 그
#    체크가 영구 Pending으로 남아 머지를 영영 막는다(job이 `skip`되는 건 `success` 취급이라
#    무해하다 — 둘은 다르다).
#  - Settings → General → Allow auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  decide:
    # 호출부가 권한을 명시한다 — 없으면 startup_failure로 조용히 죽는다.
    permissions:
      contents: write
      pull-requests: write
      issues: write
    uses: superokok/gh-workflows/.github/workflows/enable-auto-merge.yml@main
    secrets: inherit
    with:
      # 담당자 지정 — 코멘트·리뷰 알림은 설정에서 끌 수 있고(gh-workflows #46 실측)
      # 실제로 닿지 않았다. 담당자 지정은 끌 수 없는 유일한 경로다.
      # **명시적으로 넘긴다.** 재사용 워크플로우의 기본값은 `develop`이라, 통합 브랜치가
      # 다른 저장소에서 이걸 빼면 모든 게이트 job의 `if`가 거짓이 되어 **전부 skipped**로
      # 조용히 죽는다 — PR은 CLEAN으로 보이지만 게이트가 통과한 게 아니라 안 돈 것이다
      # (2026-09-16 project-template #5 실측).
      base-branch: {{INTEGRATION_BRANCH}}
      notify-handle: {{NOTIFY_HANDLE}}
      # ── 사람을 부르는 기준: **경로가 아니라 "게이트가 약해졌는가"** ────────────
      #
      # 예전엔 게이트 파일(`.github/workflows/`·`.claude/`)을 건드리기만 해도 사람 머지로
      # 넘겼다. 그런데 그 게이트는 주석 한 줄을 고쳐도 울린다 — **매번 울리는 게이트는
      # 결국 안 읽고 통과시키게 되고**, 그러면 남는 건 지연뿐이고 검출은 0이다.
      # 게이트가 있는 척하는 상태가 게이트가 없는 상태보다 나쁘다.
      #
      # 그래서 "무엇을 했는지"를 본다. 게이트가 약해지는 방식은 몇 가지로 정해져 있고
      # 대부분 diff에 **삭제된 줄**로 나타난다 — 권한 블록, 훅 등록, 테스트 호출, 트리거.
      # 재사용 워크플로우의 `gate-weakening-markers`가 그걸 찾고, 걸리면 그때만 사람을
      # 부른다(기본값이 이미 들어 있어 여기서 넘길 게 없다).
      #
      # `risk-paths`에 남는 건 **약해지는 게 아니라 되돌릴 수 없는 것**뿐이다:
      #   - 환경변수·시크릿 파일 — 한번 커밋되면 키를 갈아야 한다. 훅(`guard-env.sh`)이
      #     이미 막아서 실제 빈도는 0에 가깝다(비용 없는 보험).
      #
      # 나머지는 전부 자동 머지다. 통합 브랜치에 들어간 게 틀리면 CI가 빨개지거나
      # 스테이징에서 드러나고 `claude-fix`가 먼저 손을 댄다. 운영으로 나가는 자리엔
      # 릴리스 PR이라는 사람 게이트가 따로 있고, 마이그레이션은 거기서 경고가 뜬다
      # (`after-merge.yml`의 `migration-paths`).
      risk-paths: '{{RISK_PATHS}}'
