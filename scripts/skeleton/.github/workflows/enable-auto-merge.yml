name: Enable auto-merge

# 머지 게이트. 로직은 superokok/gh-workflows의 enable-auto-merge.yml에 있다 —
# 이 프로젝트는 트리거와 이 저장소 고유의 위험 경로만 소유한다.
#
# 머지 판정은 GitHub이 한다. 이 워크플로우가 하는 일은 "이 PR에 auto-merge를 켤까 말까"를
# 한 번 정하는 것뿐이고, 게이트 구성은 브랜치 보호의 required checks로 표현한다.
#
# 전제(저장소 설정 — 코드 아님):
#  - 브랜치 보호 develop: required checks = `review / review`, `backend`, `web-and-app`
#    (`check / check`가 아니다 — 이 저장소는 `ci.yml`을 직접 소유해 job을 인라인으로 정의하고,
#     그러면 check-run 이름이 워크플로우 이름 없이 **job 이름 그대로** 붙는다. 재사용
#     워크플로우를 부르는 `review`만 `<호출 잡> / <불린 잡>` 꼴이다. 처음에 `CI / backend`로
#     잡았다가 PR이 영구 Pending으로 막혔다(2026-09-11) — 실제 이름은 PR 체크 목록이나
#     `repos/{r}/commits/{sha}/check-runs`로 확인한다.)
#    (kitchen-tempo에 있는 `Vercel`은 여기 없다 — 이 저장소엔 프리뷰 배포가 없다)
#  - Settings → General → Allow auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  decide:
    # 호출부가 권한을 명시한다 — 없으면 startup_failure로 조용히 죽는다.
    permissions:
      contents: write
      pull-requests: write
      issues: write
    uses: superokok/gh-workflows/.github/workflows/enable-auto-merge.yml@main
    secrets: inherit
    with:
      # 담당자 지정 — 코멘트·리뷰 알림은 설정에서 끌 수 있고(gh-workflows #46 실측)
      # 실제로 닿지 않았다. 담당자 지정은 끌 수 없는 유일한 경로다.
      # **명시적으로 넘긴다.** 재사용 워크플로우의 기본값은 `develop`이라, 통합 브랜치가
      # 다른 저장소에서 이걸 빼면 모든 게이트 job의 `if`가 거짓이 되어 **전부 skipped**로
      # 조용히 죽는다 — PR은 CLEAN으로 보이지만 게이트가 통과한 게 아니라 안 돈 것이다
      # (2026-09-16 project-template #5 실측).
      base-branch: {{INTEGRATION_BRANCH}}
      notify-handle: {{NOTIFY_HANDLE}}
      # ── 기준: "기계가 원리적으로 못 잡는 곳에만 사람을 부른다" ──────────────────
      #
      # 남긴 것과 근거:
      #   - `db/migration/` — Flyway 마이그레이션은 되돌릴 수 없고, 기계는 diff에서
      #     데이터 손실을 보지 못한다. kitchen-tempo의 `prisma/`에 해당한다.
      #   - `application*.yml`·`.env` — 데이터소스·JWT 시크릿 등 런타임 설정과 시크릿.
      #   - `build.gradle`·`settings.gradle`·`gradle/`·`package*.json` — 공급망.
      #     `gradle/wrapper/gradle-wrapper.jar`가 여기 들어간다(바이너리라 리뷰가 못 본다).
      #   - **인증·권한** — `config/security/`(SecurityConfig·JwtService·필터),
      #     `AuthService`, `Auth`/`DevAuth`/`Admin` 컨트롤러, 클라이언트의 토큰 저장
      #     (`app/src/lib/authToken.ts` 등). 정적 검사는 "가드가 있는지"는 보지만
      #     "가드가 옳은지"는 못 본다.
      #   - **`.github/workflows/`·`.claude/settings.json`·`.claude/hooks/`·`.devcontainer/`
      #     — 게이트와 실행 환경 자신을 바꾸는 경로다.** 자기 자신을 검사하는 순환이 되므로
      #     기계에 맡길 수 없다.
      #     `.claude/hooks/`는 kitchen-tempo에서는 **빼는** 경로다 — 거기엔 `hooks.test.ts`가
      #     CI에서 126케이스를 돌려서 "훅을 약화시키면 사람이 아니라 CI가 빨간불을 낸다".
      #     **이 저장소에도 2026-09-14에 그 테스트가 생겼다**(#24 — `scripts/hooks/`에 71케이스,
      #     CI `web-and-app` 잡의 `npm run test:hooks`). **그래도 남긴다.** 그때 적어둔
      #     "테스트가 생기면 뺀다"는 필요조건이었지 충분조건이 아니었다: 훅과 테스트 중 하나는
      #     게이트 밖이어야 하는데(둘 다 넣으면 사람 게이트만 늘고 안전은 안 는다), 훅을 밖에
      #     두면 **아무 테스트도 안 건드린 새 우회로**가 71케이스 전부 초록인 채로 통과한다.
      #     테스트를 밖에 두면 테스트가 약해져도 훅은 여전히 사람이 보므로 혼자서는 구멍이
      #     안 된다. 자유로운 쪽이 혼자 구멍을 낼 수 있느냐가 기준이다(CLAUDE.md "위험 경로").
      #   - `.github/dependabot.yml` — 런타임엔 영향이 없지만 `ignore` 한 줄로 취약한 패키지의
      #     업데이트를 영영 막을 수 있다. CI는 초록이고 diff는 한 줄이라 눈에 안 띈다.
      #     검증 설정과 같은 성격이다 — 느슨하게 만들면 게이트가 통과하는 게 아니라 **사라진다.**
      #   - `Dockerfile`·`docker-compose` — 배포되는 이미지의 정의(DEPLOY.md).
      #   - 검증 설정(`tsconfig`·`next.config`) — 느슨하게 만들면 게이트가 통과하는 게
      #     아니라 게이트가 사라진다.
      #
      # 뺀 것과 근거:
      #   - `CLAUDE.md`·`README.md`·`DEPLOY.md` — 산문이라 런타임 영향이 없다.
      #   - 도메인·서비스·화면 코드 — CI와 AI 리뷰가 보는 범위다.
      risk-paths: '{{RISK_PATHS}}'
