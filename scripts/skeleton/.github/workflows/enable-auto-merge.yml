name: Enable auto-merge

# 머지 게이트. 로직은 superokok/gh-workflows의 enable-auto-merge.yml에 있다 —
# 이 프로젝트는 트리거와 이 저장소 고유의 위험 경로만 소유한다.
#
# 머지 판정은 GitHub이 한다. 이 워크플로우가 하는 일은 "이 PR에 auto-merge를 켤까 말까"를
# 한 번 정하는 것뿐이고, 게이트 구성은 브랜치 보호의 required checks로 표현한다.
#
# 전제(저장소 설정 — 코드 아님):
#  - 브랜치 보호 `{{INTEGRATION_BRANCH}}`: required checks = {{REQUIRED_CHECKS}}
#    **check-run 이름 규칙이 두 가지라 섞이기 쉽다.** 재사용 워크플로우를 부르면
#    `<호출 잡> / <불린 잡>`이 되고(`review / review`), **job을 인라인으로 정의하면 job
#    이름 그대로**다(`backend` — 워크플로우 이름은 안 붙는다). `CI / backend`로 잡았다가
#    PR이 영구 Pending으로 막힌 적이 있다(devDepth, 2026-09-11). 실제 이름은 PR의 체크
#    목록이나 `repos/{r}/commits/{sha}/check-runs`로 확인한다.
#  - required로는 **`pull_request`로 도는 것만** 넣는다. 안 도는 워크플로우를 넣으면 그
#    체크가 영구 Pending으로 남아 머지를 영영 막는다(job이 `skip`되는 건 `success` 취급이라
#    무해하다 — 둘은 다르다).
#  - Settings → General → Allow auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  decide:
    # 호출부가 권한을 명시한다 — 없으면 startup_failure로 조용히 죽는다.
    permissions:
      contents: write
      pull-requests: write
      issues: write
    uses: superokok/gh-workflows/.github/workflows/enable-auto-merge.yml@main
    secrets: inherit
    with:
      # 담당자 지정 — 코멘트·리뷰 알림은 설정에서 끌 수 있고(gh-workflows #46 실측)
      # 실제로 닿지 않았다. 담당자 지정은 끌 수 없는 유일한 경로다.
      # **명시적으로 넘긴다.** 재사용 워크플로우의 기본값은 `develop`이라, 통합 브랜치가
      # 다른 저장소에서 이걸 빼면 모든 게이트 job의 `if`가 거짓이 되어 **전부 skipped**로
      # 조용히 죽는다 — PR은 CLEAN으로 보이지만 게이트가 통과한 게 아니라 안 돈 것이다
      # (2026-09-16 project-template #5 실측).
      base-branch: {{INTEGRATION_BRANCH}}
      notify-handle: {{NOTIFY_HANDLE}}
      # ── 위험 경로 — 기준은 하나다: **틀려도 드러나지 않는 곳에만 사람을 부른다** ──
      #
      # 여기 목록을 길게 두고 싶은 유혹이 있는데, 사람 게이트를 늘려도 안전은 늘지 않는다.
      # 늘어나는 건 대기 시간이고, 대기가 길어지면 diff를 안 읽고 머지하게 된다 —
      # **게이트가 있는 척하는 상태가 게이트가 없는 상태보다 나쁘다.**
      #
      # 통합 브랜치에 머지되는 건 개발용이다. 틀린 코드·설정·의존성은 CI가 빨개지거나
      # 프리뷰/스테이징에서 드러나고 `claude-fix`가 먼저 손을 댄다. 운영으로 나가는 자리엔
      # 릴리스 PR이라는 사람 게이트가 따로 있다. 그래서 **기본값은 자동 머지**다.
      #
      # 그 논리가 성립하지 않는 것만 남긴다 — **게이트 자신**이다:
      #   - `.github/workflows/`·`.claude/settings.json` — 느슨해지면 CI가 통과하는 게
      #     아니라 **검사하지 않게** 된다. 통합 브랜치에서도 스테이징에서도 증상이 없고,
      #     자동 리뷰의 차단 기준(정확성·인증·데이터 손상)에도 안 걸린다.
      #   - `.env` — 시크릿. 훅(`guard-env.sh`)이 이미 막아서 실제 빈도가 0에 가깝다.
      #     비용 없는 보험이라 남긴다.
      #
      # 뺀 것 중 설명이 필요한 둘:
      #   - **마이그레이션** — 통합 브랜치의 DB는 개발용이라 되돌릴 수 있다. 다만 그 파일은
      #     릴리스 때 운영 DB에 그대로 재생되고 Flyway/Prisma는 나중에 고칠 수 없다.
      #     그래서 뺀 게 아니라 **자리를 옮겼다**: `after-merge.yml`의 `migration-paths`가
      #     릴리스 PR에 경고와 `has-migration` 라벨을 붙인다. 매번 뜨는 고정 문구는 안
      #     읽히지만 실제로 들어 있을 때만 뜨면 신호가 된다.
      #   - **`.claude/hooks/`** — 정본은 `project-template`의 `common/`이고 사람 게이트는
      #     **거기** 있다(그 저장소의 `risk-paths`에 `common/`이 들어 있다). 훅은 전
      #     프로젝트로 퍼지는데 퍼져나가는 지점이 한 곳이므로 게이트도 한 곳이면 된다 —
      #     여기서 또 부르면 같은 판단을 프로젝트 수만큼 반복한다.
      #     (여기서 직접 고친 훅은 다음 동기화 PR이 정본으로 되돌린다.)
      #
      # 값은 프로파일이 정한다(`scripts/skeleton/profiles/*.env`의 `RISK_PATHS`).
      # 이 프로젝트 고유의 "드러나지 않는 곳"이 생기면 여기에 더한다.
      risk-paths: '{{RISK_PATHS}}'
