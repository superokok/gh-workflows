name: After merge (issue close · branch cleanup)

# develop 대상 PR이 머지된 뒤의 뒷정리 (머지 주체와 무관하게 돈다 — 사람이 머지한 PR이
# 정확히 위험 경로 PR이라, 여기서 일원화하지 않으면 가장 중요한 작업일수록 정리가 안 된다).
# 로직은 superokok/gh-workflows의 after-merge.yml에 있다 — 이 프로젝트는 트리거만 소유한다.
#
# 뒷정리 외에 대기 큐 배출(drain-queue)도 여기서 돈다 — 앞 PR이 닫히면 `agent-queued`
# 이슈 하나를 다시 `agent`로 돌려 사람이 스케줄러가 되지 않게 한다.
#
# **릴리스 PR 생성도 여기서 한다**(gh-workflows #41). 예전엔 `release-pr.yml`이
# `push: [develop]`로 도는 별도 워크플로우였는데, 그 push는 거의 항상 이 워크플로우를
# 깨우는 PR 머지와 **같은 사건**이다. Actions 분은 잡 단위로 올림 과금되므로 같은 사건에
# 잡이 둘이면 10초짜리 일이 2분으로 청구된다.
#
# 커버리지는 오히려 늘어난다 — **릴리스 PR이 머지되면 `develop`은 안 바뀌어서** 옛
# `push:` 트리거는 그 순간 안 돌았고, 다음 develop push까지 릴리스 PR이 재생성되지
# 않았다. 이 워크플로우는 그때도 깨어난다(base=main인 PR이 닫히는 것도 `closed`다).

on:
  pull_request:
    types: [closed]

jobs:
  after-merge:
    # 호출부가 권한을 명시해야 한다 — 이 저장소의 기본 토큰 권한이 read라, 없으면 불린
    # 워크플로우의 write 요구가 천장을 넘어 startup_failure로 조용히 죽는다.
    # 재사용 워크플로우의 job들이 요구하는 권한의 합집합을 준다.
    permissions:
      contents: write        # delete-branch
      pull-requests: write   # merged-notice 코멘트
      issues: write          # close-issues
    uses: superokok/gh-workflows/.github/workflows/after-merge.yml@main
    secrets: inherit
    with:
      # 운영 브랜치. 비워두면 릴리스 PR 스텝 자체가 안 돈다(통합 브랜치가 없는 저장소용
      # 기본값이다) — 이 저장소는 develop→main이 있으므로 반드시 넘긴다.
      release-target: {{PRODUCTION_BRANCH}}
      # 이 머지로 **충돌하게 된 다른 PR**에 담당자를 지정한다. 충돌은 실패 체크를 만들지
      # 않아서 auto-merge가 조용히 멈추기만 하고 아무도 안 불린다(gh-workflows #74).
      # `enable-auto-merge`·`claude-review`·`claude-fix`와 **같은 값**이어야 한다 —
      # 한 곳만 빠지면 그 경로의 알림만 조용히 사라진다(#31 실측).
      notify-handle: {{NOTIFY_HANDLE}}
      # ⚠️ 이 안내문은 `release-pr.yml`에도 **같은 내용으로** 들어 있다. 그쪽은 수동 재생성
      # 창구라 같은 PR 본문이 나와야 하는데, GitHub Actions에는 파일 간 YAML 앵커가 없어
      # 복제 말고는 방법이 없다. 한쪽을 고치면 다른 쪽도 고친다.
      pre-merge-note: |
        `main` 머지는 **운영 반영**입니다 — 백엔드는 Oracle Cloud VM, 웹은 Vercel입니다(`DEPLOY.md`). 머지 전에 이 릴리스에 Flyway 마이그레이션이 들어 있는지 확인하세요: 들어 있으면 운영 DB 스키마가 같이 바뀝니다.

        **머지 방식: Create a merge commit(병합 머지)** — squash/rebase 아님. `develop`은 이미 PR당 1커밋이라 여기서 또 squash하면 PR 단위 추적이 깨집니다.
