name: Claude Fix (red build → 수정 커밋)

# 자가 치유 게이트. 로직은 superokok/gh-workflows의 claude-fix.yml에 있다 —
# 이 프로젝트는 트리거와 **이 스택 고유의 값**만 갖는다.
#
# kitchen-tempo와 달리 "Preview Smoke"가 없다 — 이 저장소에는 Vercel 프리뷰가 없어서
# preview-smoke.yml을 쓰지 않는다. 여기 없는 워크플로우 이름을 적어두면 영원히 매칭되지
# 않을 뿐이라 해롭진 않지만, 실제로 있는 것만 적는다.
#
# **"Claude Review"를 감시 대상에 넣는다.** 리뷰의 `review` job이 startup_failure로 죽으면
# 그 안의 담당자 지정 스텝도 실행되지 않아 아무도 빨간불을 모른다(gh-workflows #60).
# 리뷰 호출부가 자기 자신을 감시하는 건 불가능하다 — 자기 참조는 워크플로우 파일을
# 무효로 만든다(#63, claude-review.yml 주석 참고). 그래서 그 감시를 여기서 맡는다.
# gh-workflows가 `self-fix.yml`로 하는 것과 같은 구조다.
on:
  workflow_run:
    workflows: ["CI", "Claude Review"]
    types: [completed]
  status:

jobs:
  fix:
    # 호출부가 권한을 명시해야 한다 — claude-review.yml의 주석 참고.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    uses: superokok/gh-workflows/.github/workflows/claude-fix.yml@main
    secrets: inherit
    # claude-agent.yml과 같은 이유로 명시한다 — 재사용 워크플로우의 기본값은
    # kitchen-tempo(Node + Prisma + Next.js) 기준이고, `with:`를 생략하면 그게 조용히
    # 상속된다. claude-agent가 2026-09-12에 그 상속으로 `npx prisma generate`에서 죽었다.
    # claude-fix는 빨간불이 나야 깨어나므로 아직 드러나지 않았을 뿐 같은 구멍이었다.
    with:
      # 담당자 지정 — 코멘트·리뷰 알림은 설정에서 끌 수 있고(gh-workflows #46 실측)
      # 실제로 닿지 않았다. 담당자 지정은 끌 수 없는 유일한 경로다.
      notify-handle: {{NOTIFY_HANDLE}}
      # JVM 스택이면 빌드 파일의 toolchain과 맞춘다(아니면 비운다). claude-agent.yml과 같은 이유(#26).
      java-version: "{{JAVA_VERSION}}"
      # 루트가 npm workspaces(shared/web/app)라 루트 한 번으로 셋 다 설치된다.
      install: "{{INSTALL}}"
      # Prisma 없음.
      prepare: ""
      # claude-agent의 verify와 같은 것으로 맞춘다. -PwithDocker를 안 붙이는 이유도 같다 —
      # Testcontainers 통합 테스트는 PR의 CI(`backend` 잡)가 본다. 이제 backend 빨간불도
      # 고친 걸 이 러너에서 되돌려 확인할 수 있다 — 로그 읽기에만 의존하지 않는다.
      verify: "{{VERIFY}}"
      # Vercel이 없다. 빌드 재현 안내를 프롬프트에 넣지 않는다.
      build: ""
