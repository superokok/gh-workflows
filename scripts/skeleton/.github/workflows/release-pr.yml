name: Release PR (develop → main)

# ⚠️ **평소 경로는 여기가 아니다.** 같은 로직이 `after-merge.yml`의 스텝으로 들어갔다
# (`release-target` 입력, gh-workflows #41). develop으로의 PR 머지는 어차피 그 워크플로우를
# 깨우므로, 같은 사건에 잡을 둘 쓰면 **잡 단위 올림 과금**만 더 낼 뿐이다.
#
# 그래서 `push: [develop]` 트리거를 뗐다. 남겨둔 `workflow_dispatch:`는 **수동 재생성
# 창구**다 — after-merge의 릴리스 스텝이 실패했거나(App 토큰 문제 등) 릴리스 PR을 실수로
# 닫았을 때, 머지 이벤트를 억지로 만들지 않고 여기서 한 번 돌리면 복구된다.
# 안 돌리면 분도 들지 않으므로 남겨두는 비용은 0이다.
#
# 로직은 superokok/gh-workflows의 release-pr.yml에 있다 — 이 프로젝트는 트리거 +
# 이 프로젝트 고유 안내문만 갖는다.

on:
  workflow_dispatch:

jobs:
  release-pr:
    uses: superokok/gh-workflows/.github/workflows/release-pr.yml@main
    secrets: inherit
    with:
      # ⚠️ 이 안내문은 `after-merge.yml`에도 **같은 내용으로** 들어 있다(평소 경로가 그쪽이라
      # 그렇다). 수동 재생성으로 만든 PR도 같은 본문이어야 하는데, GitHub Actions에는 파일 간
      # YAML 앵커가 없어 복제 말고는 방법이 없다. 한쪽을 고치면 다른 쪽도 고친다.
      pre-merge-note: |
        `main` 머지는 **운영 반영**입니다 — 백엔드는 Oracle Cloud VM, 웹은 Vercel입니다(`DEPLOY.md`). 머지 전에 이 릴리스에 Flyway 마이그레이션이 들어 있는지 확인하세요: 들어 있으면 운영 DB 스키마가 같이 바뀝니다.

        **머지 방식: Create a merge commit(병합 머지)** — squash/rebase 아님. `develop`은 이미 PR당 1커밋이라 여기서 또 squash하면 PR 단위 추적이 깨집니다.
